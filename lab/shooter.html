function pickFrom(pool, r) {
  const total = pool.reduce((a, [w]) => a + w, 0)
  let v = r() * total
  for (const [w, f] of pool) { if (v < w) return f; v -= w }
  return pool[pool.length - 1][1]
}

/**
 * 그 단계의 웨이브 표를 만든다.
 *
 * 같은 챕터·같은 단계면 언제나 같은 판이 나온다. 단계가 오를수록 길어지고
 * 사이가 좁아진다.
 */
function buildWaves(ch, sub) {
  const r = seeded(ch.id * 977 + sub * 31)
  const len = 24 + sub * 1.1
  const gap = 2.0 - Math.min(0.9, sub * 0.045)
  const out = []
  let t = 0.8
  while (t < len) {
    const f = pickFrom(ch.pool, r)
    out.push({ at: +t.toFixed(2), f: () => f(seeded((t * 1000) | 0)) })
    t += gap + r() * 1.1
  }
  /* 5·10·15 단계는 중간보스, 20 단계는 보스 */
  if (sub === SUBS) out.push({ at: len + 1.2, f: () => spawnBoss(false) })
  else if (MID_AT.includes(sub)) out.push({ at: len + 1.2, f: () => spawnBoss(true) })
  return out
}

/** 단계가 오를수록 조금씩 단단해진다. 20 단계면 챕터 기준의 1.67 배 */
function subScale(sub) { return 1 + (sub - 1) * 0.035 }

function curChapter() { return CHAPTERS[Math.min(prog.chapter || 0, CHAPTERS.length - 1)] }
function curSub() { return Math.min(SUBS, Math.max(1, prog.sub || 1)) }
function stageKey(ci, sub) { return CHAPTERS[ci].id + '-' + sub }
function starOf(ci, sub) { return prog.stars[stageKey(ci, sub)] || 0 }

/** 그 단계에 들어갈 수 있나. 앞 단계를 한 번은 깨야 한다 */
function subOpen(ci, sub) {
  if (sub === 1) return ci === 0 || starOf(ci - 1, SUBS) > 0
  return starOf(ci, sub - 1) > 0
}
function chapterOpen(ci) { return ci === 0 || starOf(ci - 1, SUBS) > 0 }
function chapterStars(ci) {
  let n = 0
  for (let k = 1; k <= SUBS; k++) n += starOf(ci, k)
  return n
}

/* 지금 고른 판을 하나로 묶어 넘긴다. 판 안에서는 이것만 본다 */
function curStage() {
  const ch = curChapter()
  const sub = curSub()
  const k = subScale(sub)
  return {
    id: ch.id, sub, name: ch.name + ' ' + sub, chapter: ch.name, theme: ch.theme,
    waves: buildWaves(ch, sub),
    bossHp: Math.round(ch.bossHp * (0.55 + sub * 0.045)),
    hpMul: ch.hpMul * k, spMul: ch.spMul * (1 + (sub - 1) * 0.012),
  }
}
/** 돌진기를 위에서 흩뿌린다. 같은 자리에 겹치면 한 번에 다 맞는다 */
function dive(n) {
  for (let i = 0; i < n; i++) {
    state.enemies.push(mkEnemy('dive', 60 + Math.random() * (W - 120), -40 - i * 70, 0))
  }
}
/*
 * V 자 편대.
 *
 * 한 줄로 내려오는 것만 있으면 화면 위쪽만 보면 된다. 대열을 이뤄 내려와
 * 잠시 머물면 "저 뭉치를 어떻게 뚫을까"가 생긴다.
 */
function wing(kind, n) {
  const cx = 90 + Math.random() * (W - 180)
  const top = 110 + Math.random() * 80
  for (let i = 0; i < n; i++) {
    const off = i - (n - 1) / 2
    const e = mkEnemy(kind, cx + off * 42, -50 - Math.abs(off) * 36, 0)
    e.mode = 'wing'
    e.holdY = top + Math.abs(off) * 18
    e.baseX = e.x
    e.hold = 2.8
    state.enemies.push(e)
  }
}

/** 옆에서 들어와 화면을 가로지른다. 위만 보고 있으면 못 본다 */
function side(kind, n, dir) {
  for (let i = 0; i < n; i++) {
    const e = mkEnemy(kind, dir > 0 ? -40 - i * 48 : W + 40 + i * 48, 90 + i * 34, 0)
    e.mode = 'side'
    e.vx = dir * 155
    state.enemies.push(e)
  }
}

/** 지상에서 솟구친다. 아래에서 올라오므로 뒤를 비워 두면 맞는다 */
function rise(kind, n) {
  for (let i = 0; i < n; i++) {
    const e = mkEnemy(kind, 60 + Math.random() * (W - 120), H + 24, 0)
    e.mode = 'rise'
    e.riseT = 1.5 + i * .35
    e.riseSp = 215
    state.enemies.push(e)
  }
}

function line(n, kind) {
  const gap = W / (n + 1)
  for (let i = 0; i < n; i++) state.enemies.push(mkEnemy(kind, gap * (i + 1), -40 - i * 12, 0))
}
function diagonal(kind, dir) {
  for (let i = 0; i < 5; i++)
    state.enemies.push(mkEnemy(kind, dir > 0 ? 40 : W - 40, -40 - i * 46, dir))
}
/*
 * 적 다섯 종.
 *
 * 하나씩 다른 걸 요구한다 - 잡졸은 수로, 중형은 유도탄으로, 돌진기는 자리를
 * 옮기게, 산탄기는 정면을 피하게, 맷집은 화력을 모으게 만든다. 다 같은
 * 방식으로 상대되면 종류를 늘린 의미가 없다.
 */
function mkEnemy(kind, x, y, drift) {
  const B = {
    small:  { hp: 4,  r: 13, sp: 78, score: 90,  fire: 2.4, art: 30 },
    mid:    { hp: 11, r: 20, sp: 52, score: 220, fire: 1.5, art: 46 },
    /* 쏘지 않고 몸으로 온다. 조준하는 동안 예고선이 보인다 */
    dive:   { hp: 6,  r: 15, sp: 40, score: 180, fire: 99,  art: 34, aim: .9, dashSp: 430 },
    /* 좌우로 크게 흔들며 부채꼴로 뿌린다. 정면에 서 있으면 안 된다 */
    gunner: { hp: 8,  r: 18, sp: 44, score: 200, fire: 2.0, art: 42, sway: 92 },
    /* 느리고 단단하다. 지나가길 기다리지 말고 화력을 모아 떨궈야 한다 */
    tank:   { hp: 26, r: 24, sp: 30, score: 420, fire: 2.6, art: 54 },
    /*
     * 자리를 잡고 아래로 굵은 빔을 쏜다.
     *
     * 예고가 1.1초다. 그 동안 빔이 지나갈 길이 보이므로 옆으로 비키면 된다.
     * 대신 안 비키면 제일 아프다 - 피할 수 있는 것일수록 세게 때린다는
     * 원칙을 여기서도 지킨다.
     */
    lancer: { hp: 16, r: 19, sp: 32, score: 340, fire: 3.4, art: 44, lance: true },
  }
  const b = B[kind] || B.small
  // 뒤 스테이지일수록 더 단단하고 빠르다. 점수는 그대로 둔다 - 뒤 판을
  // 돌면 점수가 저절로 불어나면 앞 판이 의미를 잃는다
  const SG = state.stage || { hpMul: 1, spMul: 1 }
  return { kind, x, y, drift, t: Math.random() * 3, cd: b.fire * (.4 + Math.random()),
           beamPh: 0, holdY: 0, mode: null,
           ...b, hp: Math.round(b.hp * SG.hpMul), sp: Math.round(b.sp * SG.spMul) }
}

/* ================================================================
 * 지상 위협
 *
 * 하늘에서 내려오는 적만 있으면 위협이 한 방향뿐이라 금방 읽힌다.
 * 땅에 붙은 것들은 지형 속도로 천천히 올라오면서 다른 방식으로 압박한다.
 *
 *   대공포   조준 3연발. 가깝고 잦다
 *   채프포   위로 쏘아 올려 정해진 높이에서 파편으로 터진다
 *   방공레이저 겨냥선을 먼저 보여주고 굵은 빔을 쏜다 — 피할 시간을 준다
 *   레이더   원 안에 머무르면 유도탄이 날아온다. 원이 보이니 피할 수 있다
 *
 * 넷 다 예고가 있다. 예고 없는 즉사는 어렵게 만드는 게 아니라 억울하게
 * 만든다.
 * ================================================================ */
/*
 * 공격마다 아픈 정도.
 *
 * 피하기 쉬운 것일수록 세게 때린다. 방공 레이저는 예고가 뜨고 폭이 좁아
 * 피할 수 있으니 제일 아프고, 흔한 총알은 스쳐도 살 만하다.
 */
/*
 * 목숨.
 *
 * 셋이면 두 번을 그냥 버려도 판이 이어져서, 조심할 이유가 없었다. 하나면
 * 한 번의 실수가 판을 끝낸다 - 대신 체력이 넉넉하고(100 에 등급·스탯이
 * 얹힌다) 격추돼도 부활 광고가 한 번 있다.
 */
const LIVES = 1
const PLAYER_HP = 100
const DMG = {
  bullet: 12,      // 적기 일반탄
  flak: 16,        // 지상 대공포탄
  missile: 24,     // 유도탄
  beam: 34,        // 방공 레이저
  ram: 20,         // 적기와 충돌
  dive: 38,        // 돌진기와 충돌
  boss: 20,        // 보스 탄
  bossDash: 50,    // 보스 돌진
  /*
   * 즉사 광선.
   *
   * 한 방에 기체 하나가 날아간다. 대신 예고가 길다 - 붉은 길이 1.5초 깔린
   * 뒤에야 쏜다. 폭도 좁아서 옆으로 한 뼘만 비키면 산다.
   *
   * 예고 없는 즉사는 억울하게 만들지만, 예고 있는 즉사는 '봤는데 안 피했다'
   * 가 된다. 그건 어려운 것이고 억울한 것이 아니다.
   */
  lance: 9999,
}

const TERRAIN_SPEED = 62

function mkGround(kind, x, y) {
  const b = {
    turret: { hp: 9,  r: 16, cd: 1.8, score: 150 },
    flak:   { hp: 11, r: 17, cd: 3.0, score: 210 },
    laser:  { hp: 16, r: 18, cd: 3.4, score: 340 },
    radar:  { hp: 13, r: 18, cd: 0,   score: 300 },
  }[kind]
  return { kind, x, y, t: Math.random() * 2, phase: 'idle', ph: 0, lock: 0, aimX: 0, flash: 0, ...b }
}
/*
 * 화면 위에서 생겨 아래로 흐른다. 비행기가 앞으로 나아가니 땅은
 * 다가와서 지나가는 게 맞다.
 */
function ground(kind, x) { state.grounds.push(mkGround(kind, x, -40)) }

/** 레이더 감지 반경. 그려서 보여주므로 숨기지 않는다. */
const RADAR_R = 118

/**
 * 적 유도탄의 선회 속도.
 *
 * 사용자 유도탄(일반형)이 5 다. 그 20% 로 둔다. 같은 성능이면 절대 못
 * 피하고, 그러면 유도탄이 아니라 사형선고가 된다. 이 정도면 옆으로 크게
 * 꺾어서 흘려보낼 수 있고, 가만히 있으면 맞는다.
 */
const PLAYER_HOMING_TURN = 5
const ENEMY_HOMING_TURN = PLAYER_HOMING_TURN * 0.2

/*
 * 보스.
 *
 * 320 은 너무 물렀다. 편대 셋에 개조까지 붙으면 순식간에 녹아서
 * 「보스가 나왔다」가 아니라 「덩치 큰 적이 지나갔다」가 됐다.
 *
 * 체력만 올리면 지루해지므로 구조를 준다 —
 *   · 양옆에 부술 수 있는 포탑 둘. 살아 있으면 보스가 더 자주 쏜다
 *   · 체력 구간마다 패턴이 바뀌고, 중반부터 부하를 부른다
 *   · 마지막 25% 에서는 돌진한다. 예고선을 먼저 보여주고 내려온다
 */
/*
 * 보스.
 *
 * 예전엔 덩어리 하나에 체력 한 줄이었다. 그래서 난사 궁 한 번이면 끝났고,
 * 어디를 쏘든 똑같아서 조준할 이유가 없었다.
 *
 * 이제 부위가 넷이다. 포탑 둘과 엔진을 먼저 부숴야 코어가 열린다. 코어가
 * 닫혀 있는 동안에는 아무리 때려도 본체 체력이 안 깎인다 - 맞는 자리가
 * 어디냐가 실제로 중요해진다.
 *
 * 코어가 열리면 2 페이즈다. 보스는 더 이상 자리를 지키지 않고 돌진하고,
 * 즉사 광선을 쏜다. 부위를 다 부순 대가로 사나워지는 셈이다.
 */
function spawnBoss(mid) {
  /* 중간보스는 작고 부위가 둘뿐이다. 엔진이 없어 탄이 처음부터 촘촘하다 */
  const base = Math.round(state.stage.bossHp * (mid ? 0.45 : 1))
  const mk = (key, name, dx, dy, r, mul, cd) => ({
    key, name, dx, dy, r, cd, flash: 0, alive: true,
    hp: Math.round(base * mul), maxHp: Math.round(base * mul),
  })
  state.boss = {
    mid: !!mid,
    x: W / 2, y: -120, r: mid ? 34 : 46, t: 0, cd: 1.2, entering: true,
    phase: 1, flash: 0, summonCd: mid ? 9 : 7, dashPh: 0, dashX: 0,
    lancePh: 0, lanceX: 0, lanceCd: 4,
    parts: mid
      ? [
          mk('lt', '좌 포탑', -30, 6, 15, 0.34, 1.0),
          mk('rt', '우 포탑', 30, 6, 15, 0.34, 1.6),
        ]
      : [
          mk('lt', '좌 포탑', -40, 8, 17, 0.26, 1.0),
          mk('rt', '우 포탑', 40, 8, 17, 0.26, 1.7),
          mk('en', '엔진', 0, 34, 20, 0.40, 2.4),
        ],
    core: { hp: base, maxHp: base, open: false },
  }
  banner(mid ? '중간보스' : '보스')
  sfx('alarm')
  music('boss')
}

/** 부위를 다 부쉈다. 코어가 열리고 보스가 사나워진다 */
function openCore(bs) {
  bs.core.open = true
  bs.phase = 2
  bs.lanceCd = 2.5
  banner('코어 노출')
  sfx('alarm')
  boom(bs.x, bs.y, 30, '#ffd27a')
}

function killBoss(bs) {
  const s = state
  boom(bs.x, bs.y, bs.mid ? 46 : 70, '#ffd27a')
  s.score += bs.mid ? 1800 : 4000
  s.boss = null
  s.cleared = true
  setTimeout(() => end(true), 900)
}

/*
 * 어디를 맞았는가.
 *
 * 살아 있는 부위에 닿으면 그 부위가 깎인다. 부위를 다 부순 뒤에만 코어가
 * 깎인다. 그 전에 본체를 때리면 튕긴다 - 'block' 을 돌려주고 부르는 쪽이
 * 불꽃만 튀긴다.
 */
function bossHit(bs, x, y, dmg) {
  const s = state
  for (const p of bs.parts) {
    if (!p.alive) continue
    const px = bs.x + p.dx, py = bs.y + p.dy
    if ((px - x) ** 2 + (py - y) ** 2 < (p.r + 7) ** 2) {
      p.hp -= dmg
      p.flash = .1
      if (p.hp <= 0) {
        p.alive = false
        boom(px, py, 26, '#ffd27a')
        s.score += 400
        if (bs.parts.every((q) => !q.alive)) openCore(bs)
      }
      return 'part'
    }
  }
  if (bs.core.open) {
    bs.core.hp -= dmg
    bs.flash = .08
    if (bs.core.hp <= 0) killBoss(bs)
    return 'core'
  }
  return 'block'
}

/** 범위 공격. 자리를 못 고르는 대신 살아 있는 부위를 한꺼번에 친다 */
function bossArea(bs, dmg) {
  let any = false
  for (const p of bs.parts) {
    if (!p.alive) continue
    any = true
    p.hp -= dmg
    p.flash = .08
    if (p.hp <= 0) {
      p.alive = false
      boom(bs.x + p.dx, bs.y + p.dy, 26, '#ffd27a')
      state.score += 400
      if (bs.parts.every((q) => !q.alive)) openCore(bs)
    }
  }
  if (!any && bs.core.open) {
    bs.core.hp -= dmg
    bs.flash = .06
    if (bs.core.hp <= 0) killBoss(bs)
  }
}

function banner(t) { state.banner = t; state.bannerT = 1.6 }

/**
 * 무엇을 떨굴지 고른다.
 *
 * 화력(P)만 떨어지면 판마다 똑같아지고, 개조만 떨어지면 화력이 안 올라
 * 후반이 버겁다. 섞되 화력을 조금 더 자주 준다.
 */
/* 아주 가끔 가챠권이 떨어진다. 한 판에 셋 중 하나꼴 */
const TICKET_DROP = 0.004

function dropItem(x, y, richer) {
  const s = state
  if (Math.random() < TICKET_DROP) {
    s.items.push({ x, y, t: 0, r: 12, tk: true })
    return
  }
  const wantMod = Math.random() < (richer ? .55 : .35)
  const key = wantMod ? rollMod(s.mods) : null
  s.items.push({ x, y, t: 0, r: 11, mod: key })   // mod 가 null 이면 화력 아이템
}

/*
 * 맞은 적에서 번개가 옆으로 튄다.
 *
 * 가까운 적을 차례로 물되 한 번 문 적은 다시 물지 않는다. 튈 때마다 힘이
 * 줄어서 무한히 퍼지지 않는다 - 안 줄이면 적이 몰린 판에서 한 방에 화면이
 * 비어 버린다.
 */
const CHAIN = { range: 135, falloff: 0.62 }

/*
 * 적이 얼마나 자주 쏘는가.
 *
 * 두 가지를 본다.
 *
 * 하나는 시간. 판이 시작하자마자 제 속도로 쏘면 자리를 잡기도 전에 탄이
 * 깔린다. 열네 초에 걸쳐 서서히 제 속도가 된다.
 *
 * 하나는 편대 크기. 처음 온 사람은 메인 한 대(화력 100%)로 나는데 적
 * 배치는 세 대(160%) 기준으로 짜여 있었다. 화력이 37% 모자란 만큼 탄이
 * 안 지워져서 첫 판이 유독 빽빽했다. 자리가 덜 열렸으면 그만큼 덜 쏜다.
 */
function fireScale() {
  const s = state
  const warm = Math.min(1, s.t / 14)
  const slots = s.squad.filter((u) => u.plane).length
  const small = slots <= 1 ? 1.55 : slots === 2 ? 1.22 : 1
  return (1.9 - 0.9 * warm) * small
}

function chainFrom(from, b) {
  const s = state
  let cur = from
  let dmg = b.dmg * CHAIN.falloff
  const bit = [from]
  const jumps = b.jumps || 3
  for (let j = 0; j < jumps; j++) {
    let best = null, bd = CHAIN.range * CHAIN.range
    for (const e of s.enemies) {
      if (e.dead || bit.includes(e)) continue
      const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2
      if (d < bd) { bd = d; best = e }
    }
    if (!best) break
    best.hp -= dmg
    best.flash = .12
    s.arcs.push({ x1: cur.x, y1: cur.y, x2: best.x, y2: best.y, age: 0, life: .22,
                  seed: Math.random() * 100 })
    if (best.hp <= 0 && !best.dead) {
      best.dead = true
      s.score += best.score
      s.kills++
      boom(best.x, best.y, 12, '#bff0ff')
      s.ult = Math.min(ULT_MAX, s.ult + 8)
    }
    bit.push(best)
    cur = best
    dmg *= CHAIN.falloff
  }
}

function boom(x, y, n, color) {
  // 알갱이 몇 개짜리는 총알이 박히는 불똥이지 폭발이 아니다. 소리까지 내면
  // 맞는 소리와 겹쳐서 탁해진다
  if (n >= 6) sfx('boom', n / 40)
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 180
    state.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                       life: .3 + Math.random() * .5, age: 0, color })
  }
}

/**
 * 강화는 화력만이 아니라 맷집도 올린다.
 *
 * 체력제로 바꾸고 나니 강화가 공격 일변도라, 맞으면서 밀고 들어갈 이유가
 * 없었다. 최대 체력을 같이 올리고 오른 만큼 채워 주면 "한 단계 올리고 한 번
 * 더 부딪쳐 본다"가 성립한다.
 */
/* ================================================================
 * 보상형 광고
 *
 * 강제로 붙이지 않는다. 하던 판을 이어가고 싶은 사람만 누른다 — 이 게임의
 * 목적이 어렵게 해서 결제를 부르는 게 아니라 오래 하게 만드는 것이라서다.
 *
 * 지금은 실제 광고가 없어 3초짜리 대기 화면으로 흉내만 낸다. 토스에 올릴
 * 때는 showAd 안쪽만 SDK 호출로 갈아 끼우면 된다. 실패하면 보상을 주지
 * 않고 조용히 돌아온다 — 광고를 못 봤는데 보상이 나가면 그게 사고다.
 *
 * 횟수 제한은 판마다 초기화된다. 예전에 스도쿠에서 부활 횟수를 세는 걸
 * 빠뜨려 무한 부활이 됐던 적이 있어서, 세는 자리를 한 곳에 모았다.
 * ================================================================ */
const AD_LIMIT = { revive: 1, charge: 2 }   // 한 판에 몇 번까지

const scAd = document.getElementById('adv')

function showAd(title, onDone) {
  const btn = document.getElementById('advSkip')
  document.getElementById('advTitle').textContent = title
  scAd.hidden = false
  let left = 3
  btn.disabled = true
  btn.textContent = left
  const iv = setInterval(() => {
    left--
    if (left > 0) { btn.textContent = left; return }
    clearInterval(iv)
    btn.disabled = false
    btn.textContent = '보상 받기'
  }, 1000)
  btn.onclick = () => {
    if (btn.disabled) return
    clearInterval(iv)
    scAd.hidden = true
    onDone()
  }
}

/** 격추된 자리에서 이어한다 */
function reviveByAd() {
  if (!state || state.adUsed.revive >= AD_LIMIT.revive) return
  showAd('이어하기', () => {
    state.adUsed.revive++
    const pl = state.player
    state.lives = LIVES
    pl.hp = pl.maxHp
    pl.inv = 3
    pl.x = W / 2
    pl.y = H - 120
    state.ebullets.length = 0        // 부활하자마자 맞으면 억울하다
    state.running = true
    scOver.hidden = true
    last = performance.now()
    banner('이어서 갑니다')
  })
}

/** 필살기 게이지를 채운다 */
function chargeByAd() {
  if (!state || !state.running) return
  if (state.adUsed.charge >= AD_LIMIT.charge) { banner('충전은 판당 ' + AD_LIMIT.charge + '번까지'); return }
  state.running = false                // 광고 보는 동안 판이 흐르면 안 된다
  showAd('필살기 충전', () => {
    state.adUsed.charge++
    state.ult = ULT_MAX
    state.running = true
    last = performance.now()
    banner('필살기 충전됨')
  })
}

/** 지금 메인에 태운 기체의 필살기 종류 */
function ultKind() {
  const u = state.squad[MAIN_SLOT]
  return u && u.plane ? u.plane.weapon : null
}

/**
 * 필살기를 쓴다.
 *
 * 게이지가 가득 찼을 때만 된다. 종류에 따라 즉시 끝나는 것(일제 사격, 충격파)
 * 과 얼마간 이어지는 것(난사, 광선, 호위)이 있어서, 이어지는 것은 ultT 에
 * 남은 시간을 담아 두고 update 가 매 프레임 처리한다.
 */
function fireUlt() {
  const s = state
  if (!s || !s.running || s.ult < ULT_MAX) return
  const k = ultKind()
  if (!k) return
  s.ult = 0
  s.ultUsed++
  s.ultKind = k
  banner(ULT[k].name)
  sfx('ult')
  haptic('ult')

  const pl = s.player
  switch (k) {
    case 'rapid':  s.ultT = 3.5; break
    case 'laser':  s.ultT = 3; break
    case 'spread': s.ultT = 2.5; break
    case 'orb':    s.ultT = 6; break
    case 'boomer':
      s.ultT = 6
      s.escorts = [-1.6, -0.8, 0.8, 1.6].map((o) => ({ off: o, cd: 0 }))
      break
    case 'pierce':
      s.ultT = 1.2
      pl.inv = Math.max(pl.inv, 1.4)
      break
    case 'wave':
      s.shards.push({ x: pl.x, y: pl.y, r: 10, kind: 'shock' })
      break
    case 'chain': {
      /* 나에게서 시작해 화면 전체를 물고 간다. 거리 제한을 풀어 다 닿게 */
      const save = CHAIN.range
      CHAIN.range = 9999
      chainFrom({ x: pl.x, y: pl.y - 20, dead: true },
                { dmg: 26, jumps: 14 })
      CHAIN.range = save
      break
    }
    case 'homing':
      for (const e of s.enemies) {
        const a = Math.atan2(e.y - pl.y, e.x - pl.x)
        s.bullets.push({ x: pl.x, y: pl.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
                         r: 5, dmg: 14, kind: 'homing', turn: PLAYER_HOMING_TURN * 2,
                         life: 3, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
      }
      if (s.boss) {
        for (let i = 0; i < 6; i++) {
          s.bullets.push({ x: pl.x, y: pl.y, vx: (i - 2.5) * 40, vy: -240,
                           r: 5, dmg: 14, kind: 'homing', turn: PLAYER_HOMING_TURN * 2,
                           life: 3, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
        }
      }
      break
    case 'mine':
      // 옆으로 빠지며 화면 전체에 떨군다. 자리는 미리 정해 두고 시간차로 터진다
      s.ultT = 1.8
      for (let i = 0; i < 14; i++) {
        s.shards.push({ x: 30 + Math.random() * (W - 60), y: -20 - Math.random() * H * .8,
                        r: 0, kind: 'bomb', delay: Math.random() * 1.5 })
      }
      break
    case 'beam':
      s.ultT = 1.6
      for (let i = 0; i < 3; i++) {
        s.shards.push({ x: W * (.25 + i * .25), y: H * .3, r: 0, kind: 'shell', delay: i * .45 })
      }
      break
  }
}

/** 이어지는 필살기를 매 프레임 굴린다 */
function updateUlt(dt) {
  const s = state
  const pl = s.player

  if (s.ultT > 0) {
    s.ultT -= dt
    const k = s.ultKind
    if (k === 'laser' || k === 'spread') {
      /* 지속 광선. 닿는 것을 계속 태운다 */
      const half = k === 'laser' ? 16 : 42
      const cx = k === 'spread' ? W / 2 + Math.sin(s.t * 3.2) * (W / 2 - 50) : pl.x
      s.sweeps = [{ x: cx, half }]
      for (const e of s.enemies) {
        if (Math.abs(e.x - cx) < half + e.r && e.y < pl.y) { e.hp -= 55 * dt; e.flash = .08 }
      }
      for (const u of s.grounds) {
        if (Math.abs(u.x - cx) < half + 14 && u.y < pl.y) { u.hp -= 40 * dt; u.flash = .08 }
      }
      if (s.boss && Math.abs(s.boss.x - cx) < half + s.boss.r) bossArea(s.boss, 70 * dt)
    } else if (k === 'pierce') {
      /* 무적으로 위로 뚫는다. 닿는 것은 부순다 */
      pl.y -= 620 * dt
      pl.inv = Math.max(pl.inv, .2)
      for (const e of s.enemies) {
        if (near(e, pl, e.r + 26)) { e.hp -= 90; e.flash = .1; boom(e.x, e.y, 8, '#ffe08a') }
      }
      if (s.boss && near(s.boss, pl, s.boss.r + 26)) bossArea(s.boss, 160 * dt)
    } else if (k === 'orb') {
      /* 도는 구슬이 적탄을 지운다 */
      const n = 8
      for (let i = 0; i < n; i++) {
        const a = s.t * 3.4 + (i / n) * Math.PI * 2
        const ox = pl.x + Math.cos(a) * 54, oy = pl.y + Math.sin(a) * 54
        for (const b of s.ebullets) {
          if ((b.x - ox) ** 2 + (b.y - oy) ** 2 < 18 * 18) b.dead = true
        }
      }
    } else if (k === 'boomer') {
      for (const es of s.escorts) {
        es.cd -= dt
        if (es.cd <= 0) {
          es.cd = .16
          const ex = Math.max(20, Math.min(W - 20, pl.x + es.off * 46))
          s.bullets.push({ x: ex, y: pl.y - 10, vx: 0, vy: -560, r: 3, dmg: 6,
                           kind: 'rapid', life: 2, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
        }
      }
    }
    if (s.ultT <= 0) { s.ultKind = null; s.escorts = []; s.sweeps = [] }
  } else {
    s.sweeps = []
  }

  /* 폭탄·포격·충격파 */
  for (const sh of s.shards) {
    if (sh.delay > 0) { sh.delay -= dt; continue }
    if (sh.kind === 'shock') {
      sh.r += 620 * dt
      for (const b of s.ebullets) if ((b.x - sh.x) ** 2 + (b.y - sh.y) ** 2 < sh.r * sh.r) b.dead = true
      for (const e of s.enemies) {
        if ((e.x - sh.x) ** 2 + (e.y - sh.y) ** 2 < sh.r * sh.r && !e.shocked) {
          e.shocked = true; e.hp -= 26; e.flash = .1
        }
      }
      if (sh.r > H) sh.done = true
    } else {
      sh.r += (sh.kind === 'shell' ? 420 : 260) * dt
      const dmg = sh.kind === 'shell' ? 90 : 44
      for (const e of s.enemies) {
        if (!e.hitBy || e.hitBy !== sh) {
          if ((e.x - sh.x) ** 2 + (e.y - sh.y) ** 2 < sh.r * sh.r) { e.hp -= dmg; e.flash = .1; e.hitBy = sh }
        }
      }
      for (const u of s.grounds) {
        if ((u.x - sh.x) ** 2 + (u.y - sh.y) ** 2 < sh.r * sh.r) { u.hp -= dmg * dt * 6; u.flash = .1 }
      }
      if (s.boss && (s.boss.x - sh.x) ** 2 + (s.boss.y - sh.y) ** 2 < sh.r * sh.r) bossArea(s.boss, dmg * dt * 5)
      if (sh.r > (sh.kind === 'shell' ? 130 : 76)) { sh.done = true; boom(sh.x, sh.y, 16, '#ffd27a') }
    }
  }
  s.shards = s.shards.filter((sh) => !sh.done)
}

function levelUp() {
  const pl = state.player
  if (pl.lv < 5) {
    pl.lv++
    const gain = 20
    pl.maxHp += gain
    pl.hp = Math.min(pl.maxHp, pl.hp + gain)
    banner('편대 ' + pl.lv + '단계')
  } else {
    state.score += 500
    pl.hp = Math.min(pl.maxHp, pl.hp + 25)     // 만렙이면 점수와 수리로
  }
}
/**
 * 맞으면 체력이 닳는다.
 *
 * 예전엔 한 대 맞을 때마다 강화가 하나씩 날아갔다. 스치기만 해도 화력이
 * 반토막 나니 다음 판을 아예 못 풀었다. 이제는 체력이 줄고, 다 닳았을 때만
 * 목숨을 하나 잃는다. 공격마다 아픈 정도가 다르다 — 레이저는 크게, 총알은
 * 조금. 그래야 무엇을 피해야 하는지가 손에 익는다.
 *
 * 무적 시간은 죽었을 때만 준다. 한 대마다 무적이면 탄막 속을 걸어 다닌다.
 */
function hitPlayer(dmg) {
  const pl = state.player
  if (pl.inv > 0) return
  state.hitCount++
  pl.hp -= dmg || DMG.bullet
  boom(pl.x, pl.y, dmg >= 20 ? 22 : 10, '#7fd6ff')
  pl.shake = Math.min(1, (dmg || 8) / 22)
  sfx('hurt', dmg >= 24 ? 1 : 0)
  haptic(dmg >= 24 ? 'hard' : 'soft')
  if (pl.hp > 0) return

  boom(pl.x, pl.y, 34, '#ffd27a')
  haptic('down')
  state.lives--
  pl.hp = pl.maxHp
  pl.inv = 2.2
  pl.x = W / 2
  pl.y = H - 120
  /*
   * 격추돼도 강화는 그대로 둔다.
   *
   * 이 게임의 목적은 어렵게 만들어 결제를 부르는 게 아니라 오래 하게 만드는
   * 것이다. 죽을 때마다 화력이 깎이면 뒤로 갈수록 못 이기고, 못 이기면 그만
   * 둔다. 목숨 하나로 충분히 아프다.
   */
  if (state.lives <= 0) end(false)
  else banner('격추 · 남은 기체 ' + state.lives)
}

/** 손끝으로 알려준다. 못 하는 기기면 조용히 넘어간다 */
/*
 * 손끝으로 알려준다.
 *
 * 스도쿠에서 배운 것이 하나 있다 - 세기가 비슷하면 무슨 일인지 구분이 안
 * 된다. 정답 12ms 와 오답 [10,55,10] 을 썼다가 둘이 같게 느껴져서 오답을
 * [45,70,45] 로 벌렸다. 여기서도 상황마다 확실히 벌려 둔다.
 *
 * 격추에는 진동을 넣지 않는다. 초당 몇 대씩 떨어지는데 그때마다 떨면
 * 폰이 계속 우는 것이고, 정작 중요한 '내가 맞았다'가 묻힌다.
 */
const HAPTIC = {
  soft: 14,                 // 스친 정도
  hard: [30, 45, 30],       // 크게 맞았다
  down: [70, 90, 70],       // 기체를 하나 잃었다
  ult: [22, 30, 22],        // 필살기
}
function haptic(kind) {
  const p = HAPTIC[kind]
  if (p == null || !AU.on.vib) return
  try { navigator.vibrate?.(p) } catch { /* 없으면 그만 */ }
}

/* ================================================================
 * 갱신
 * ================================================================ */
function update(dt) {
  const s = state
  s.t += dt

  for (const st of s.stars) { st.y += (30 + st.z * 120) * dt; if (st.y > H) { st.y = -2; st.x = Math.random() * W } }

  const pl = s.player
  const kv = 280 * dt
  if (keys.ArrowLeft) pl.x -= kv
  if (keys.ArrowRight) pl.x += kv
  if (keys.ArrowUp) pl.y -= kv
  if (keys.ArrowDown) pl.y += kv
  pl.x = Math.max(48, Math.min(W - 48, pl.x))
  pl.y = Math.max(70, Math.min(H - 34, pl.y))
  if (pl.inv > 0) pl.inv -= dt

  s.squad.forEach((u, i) => shoot(u, i, dt))

  updateUlt(dt)
  const wv = s.stage.waves
  while (s.waveIdx < wv.length && s.t >= wv[s.waveIdx].at) { wv[s.waveIdx].f(); s.waveIdx++ }

  /*
   * 보스가 없는 단계는 무엇으로 끝나는가.
   *
   * 5·10·15·20 단계만 보스로 끝난다. 나머지는 웨이브를 다 넘기고 화면이
   * 비면 끝이다. 이 조건이 없으면 웨이브가 떨어진 뒤로 아무 일도 안 일어나
   * 판이 영영 안 끝난다.
   */
  if (!s.cleared && !s.boss && s.waveIdx >= wv.length && s.enemies.length === 0) {
    s.clearWait = (s.clearWait || 0) + dt
    if (s.clearWait > 1.2) {
      s.cleared = true
      banner('작전 완료')
      setTimeout(() => { if (s.running) end(true) }, 800)
    }
  } else {
    s.clearWait = 0
  }

  /* 내 탄 — 종류마다 다르게 움직인다 */
  for (const b of s.bullets) {
    b.age += dt
    switch (b.kind) {
      case 'homing': {
        const tgt = nearestEnemy(b.x, b.y)
        if (tgt) {
          const want = Math.atan2(tgt.y - b.y, tgt.x - b.x)
          const cur = Math.atan2(b.vy, b.vx)
          let d = want - cur
          while (d > Math.PI) d -= Math.PI * 2
          while (d < -Math.PI) d += Math.PI * 2
          const na = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d))
          const sp = Math.hypot(b.vx, b.vy)
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp
        }
        break
      }
      case 'wave':
        b.x = b.x0 + Math.sin(b.age * 7 + b.ph) * b.amp * Math.min(1, b.age * 3)
        break
      case 'orb': {
        const p = slotPos(b.owner)
        b.a += dt * 4.5
        b.x = p.x + Math.cos(b.a) * b.rad
        b.y = p.y + Math.sin(b.a) * b.rad
        break
      }
      case 'mine':
        b.vy *= 1 - Math.min(1, dt * 5)
        b.fuse -= dt
        if (b.fuse <= 0) {
          b.dead = true
          boom(b.x, b.y, 18, '#ffd166')
          for (const e of s.enemies) {
            if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < 62 * 62) { e.hp -= b.dmg; e.flash = .1 }
          }
          for (const u of s.grounds) {
            if ((u.x - b.x) ** 2 + (u.y - b.y) ** 2 < 62 * 62) { u.hp -= b.dmg; u.flash = .1 }
          }
          if (s.boss && (s.boss.x - b.x) ** 2 + (s.boss.y - b.y) ** 2 < 70 * 70) bossArea(s.boss, b.dmg)
        }
        break
      case 'boomer':
        b.vy += 900 * dt
        if (b.age > 1.6) b.dead = true
        break
    }
    if (b.kind !== 'orb') { b.x += b.vx * dt; b.y += b.vy * dt }
    /* 반사 — 옆 벽에서만 튕긴다. 위아래로도 튕기면 탄이 화면에 갇힌다 */
    if (b.bounce > 0) {
      if (b.x < 6 && b.vx < 0) { b.vx = -b.vx; b.bounce-- }
      else if (b.x > W - 6 && b.vx > 0) { b.vx = -b.vx; b.bounce-- }
    }
    if (b.age > b.life) b.dead = true
  }
  s.bullets = s.bullets.filter((b) => !b.dead && b.y > -60 && b.y < H + 80 && b.x > -60 && b.x < W + 60)

  for (const e of s.enemies) {
    e.t += dt
    if (e.flash > 0) e.flash -= dt

    if (e.kind === 'dive') {
      /* 조준 - 잠깐 따라붙어 겨눈다. 이때 예고선이 보인다 */
      if (e.aim > 0) {
        e.aim -= dt
        e.y += e.sp * dt
        e.x += (pl.x - e.x) * Math.min(1, dt * 2.4)
      } else {
        e.y += e.dashSp * dt                    // 꽂힌다
      }
      continue
    }

    if (e.mode === 'wing') {
      /* 대열을 이뤄 내려와 잠시 멈춘다 */
      if (e.y < e.holdY) e.y += e.sp * 1.7 * dt
      else if (e.hold > 0) { e.hold -= dt; e.x = e.baseX + Math.sin(e.t * 1.5) * 13 }
      else e.y += e.sp * dt
    } else if (e.mode === 'side') {
      e.x += e.vx * dt
      e.y += e.sp * .35 * dt
    } else if (e.mode === 'rise') {
      if (e.riseT > 0) { e.riseT -= dt; e.y -= e.riseSp * dt }
      else e.y += e.sp * .8 * dt
    } else {
      e.y += e.sp * dt
      const wobble = e.sway ? Math.sin(e.t * 1.1) * e.sway : Math.sin(e.t * 1.6) * 34
      e.x += (e.drift ? e.drift * 46 : wobble) * dt
    }
    // 옆에서 들어오는 것만 화면 밖을 허용한다. 나머지는 가둔다
    if (e.mode !== 'side') e.x = Math.max(18, Math.min(W - 18, e.x))

    /*
     * 레이저기. 자리를 잡으면 예고하고 쏜다.
     *
     * 다른 적과 달리 조준탄을 안 쓴다. 대신 빔이 지나갈 길을 먼저 보여주고
     * 1.1초 뒤에 쏜다. 그 안에 옆으로 비키면 된다.
     */
    if (e.lance) {
      if (e.beamPh > 0) {
        e.beamPh -= dt
        if (e.beamPh <= .35 && Math.abs(pl.x - e.x) < 15 + PLAYER_R && pl.y > e.y) {
          hitPlayer(DMG.beam)
        }
      } else {
        e.cd -= dt
        if (e.cd <= 0 && e.y > 40 && e.y < H * .55) {
          e.cd = e.fire * fireScale()
          e.beamPh = 1.45
        }
      }
      continue
    }
    e.cd -= dt
    if (e.cd <= 0 && e.y > 0 && e.y < H * .72) {
      e.cd = e.fire * fireScale()
      const a = Math.atan2(pl.y - e.y, pl.x - e.x)
      if (e.kind === 'gunner') {
        /* 부채꼴 다섯 발. 정면이 제일 위험하고 옆이 안전하다 */
        for (let k = -2; k <= 2; k++) {
          s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a + k * .17) * 170,
                            vy: Math.sin(a + k * .17) * 170, r: 4, dmg: DMG.bullet, sh: 'fan' })
        }
        continue
      }
      if (e.kind === 'tank') {
        /* 굵고 느린 탄 두 발. 아프지만 잘 보인다 */
        for (const d of [-.1, .1]) {
          s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a + d) * 130, vy: Math.sin(a + d) * 130,
                            r: 6, dmg: DMG.flak, sh: 'heavy' })
        }
        continue
      }
      /*
       * 중형기는 이따금 유도탄을 쏜다.
       *
       * 전부 직선탄이면 옆으로 한 걸음씩만 밟으면 다 피해진다. 따라오는 탄이
       * 섞여야 자리를 옮기게 된다.
       */
      if ((e.kind === 'mid' || e.kind === 'tank') && Math.random() < .45) {
        s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120,
                          r: 5, kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
      } else {
        const sp = e.kind === 'mid' ? 190 : 160
        s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                          r: e.kind === 'mid' ? 4.5 : 3.5, dmg: DMG.bullet,
                          sh: e.kind === 'mid' ? 'mid' : 'small' })
      }
    }
  }
  s.enemies = s.enemies.filter((e) =>
    (e.mode === 'rise' && e.riseT > 0) ||
    (e.y < H + 60 && e.x > -90 && e.x < W + 90))

  const bs = s.boss
  if (bs) {
    bs.t += dt
    if (bs.flash > 0) bs.flash -= dt
    for (const p of bs.parts) if (p.flash > 0) p.flash -= dt

    if (bs.entering) {
      bs.y += 60 * dt
      if (bs.y >= 130) { bs.y = 130; bs.entering = false }
    } else {
      const alive = bs.parts.filter((p) => p.alive).length

      /* ---- 2 페이즈: 돌진 ---- */
      if (bs.phase === 2 && bs.dashPh <= 0 && bs.lancePh <= 0 && Math.random() < dt * 0.4) {
        bs.dashPh = 2.2; bs.dashX = pl.x
      }
      if (bs.dashPh > 0) {
        bs.dashPh -= dt
        if (bs.dashPh > 1.5) {
          // 예고. 자리를 잡고 기다린다
          bs.x += (bs.dashX - bs.x) * Math.min(1, dt * 4)
        } else if (bs.dashPh > 0.7) {
          bs.y += 620 * dt                     // 내리꽂는다
        } else {
          bs.y += (130 - bs.y) * Math.min(1, dt * 3)   // 제자리로
        }
        if (near(bs, pl, bs.r + PLAYER_R)) hitPlayer(DMG.bossDash)
      } else {
        bs.x = W / 2 + Math.sin(bs.t * .7) * (W / 2 - 70)
      }

      /*
       * ---- 2 페이즈: 즉사 광선 ----
       *
       * 예고 1.5초, 발사 0.45초. 예고 동안 붉은 길이 깔리고 폭이 좁아진다.
       * 폭 44 라 화면 420 에서 옆으로 한 뼘만 비키면 산다.
       */
      if (bs.phase === 2 && bs.dashPh <= 0 && !bs.mid) {
        bs.lanceCd -= dt
        if (bs.lancePh <= 0 && bs.lanceCd <= 0) {
          bs.lancePh = 1.95
          bs.lanceX = pl.x
          bs.lanceCd = 7.5
          sfx('alarm')
        }
      }
      if (bs.lancePh > 0) {
        bs.lancePh -= dt
        if (bs.lancePh <= 0.45 && Math.abs(pl.x - bs.lanceX) < 22 + PLAYER_R) {
          hitPlayer(DMG.lance)
        }
      }

      /* ---- 부위 사격. 살아 있는 것만 쏜다 ---- */
      for (const p of bs.parts) {
        if (!p.alive || p.key === 'en') continue
        p.cd -= dt
        if (p.cd <= 0) {
          p.cd = 1.3
          const tx = bs.x + p.dx, ty = bs.y + p.dy
          const a = Math.atan2(pl.y - ty, pl.x - tx)
          s.ebullets.push({ x: tx, y: ty, vx: Math.cos(a) * 195, vy: Math.sin(a) * 195,
                            r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
        }
      }

      /* ---- 부하 소환 ---- */
      bs.summonCd -= dt
      if (bs.summonCd <= 0) {
        bs.summonCd = bs.phase === 2 ? 4.5 : 7
        for (const sx of [70, W - 70]) s.enemies.push(mkEnemy('small', sx, -30, 0))
      }

      /*
       * ---- 본체 사격 ----
       *
       * 엔진이 살아 있으면 느리다. 엔진을 먼저 부수면 탄이 성겨지므로
       * "어디부터 부술까"가 실제 선택이 된다.
       */
      bs.cd -= dt
      if (bs.cd <= 0 && bs.dashPh <= 0 && bs.lancePh <= 0) {
        const engine = bs.parts.find((p) => p.key === 'en')
        const slow = engine && engine.alive ? 1.35 : 1
        const haste = 1 - alive * 0.06
        if (bs.phase === 1) {
          bs.cd = 1.05 * slow * haste
          for (let i = -3; i <= 3; i++) {
            const a = Math.PI / 2 + i * .17
            s.ebullets.push({ x: bs.x, y: bs.y + 24, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
                              r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
          }
          /* 조준 유도탄 하나. 가만히 서 있지 못하게 한다 */
          if (Math.random() < .45) {
            s.ebullets.push({ x: bs.x, y: bs.y + 20, vx: 0, vy: 130, r: 5,
                              kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
          }
        } else {
          /* 코어가 열리면 원형 탄막 + 조준 3연발을 번갈아 */
          bs.cd = 1.15
          if (Math.floor(bs.t) % 2 === 0) {
            for (let i = 0; i < 18; i++) {
              const a = (i / 18) * Math.PI * 2 - bs.t * .6
              s.ebullets.push({ x: bs.x, y: bs.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160,
                                r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
            }
          } else {
            const a = Math.atan2(pl.y - bs.y, pl.x - bs.x)
            for (const d of [-.14, 0, .14]) {
              s.ebullets.push({ x: bs.x, y: bs.y + 24, vx: Math.cos(a + d) * 225, vy: Math.sin(a + d) * 225,
                                r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
            }
            s.ebullets.push({ x: bs.x, y: bs.y + 20, vx: 0, vy: 140, r: 5,
                              kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
          }
        }
      }
    }
  }

  /* 땅과 지상 위협 */
  for (const sl of s.slabs) {
    sl.y += TERRAIN_SPEED * dt
    if (sl.y > H + 40) { sl.y = -60; sl.x = Math.random() * W; sl.w = 30 + Math.random() * 70 }
  }
  for (const u of s.grounds) {
    u.y += TERRAIN_SPEED * dt
    u.t += dt
    if (u.flash > 0) u.flash -= dt
    if (u.y < 10 || u.y > H + 20) continue            // 화면에 보일 때만 쏜다
    updateGround(u, dt)
  }
  s.grounds = s.grounds.filter((u) => u.y < H + 80 && !u.dead)

  /* 방공 빔 */
  for (const bm of s.beams) {
    bm.age += dt
    if (bm.age > bm.life) bm.dead = true
    else if (bm.age > bm.warn && Math.abs(pl.x - bm.x) < bm.w / 2 + PLAYER_R && pl.y < bm.y) hitPlayer(DMG.beam)
  }
  s.beams = s.beams.filter((b) => !b.dead)

  /* 적 탄 — 유도탄과 채프탄이 섞여 있다 */
  for (const b of s.ebullets) {
    b.age = (b.age || 0) + dt
    if (b.kind === 'missile') {
      /*
       * 선회 속도를 사용자 유도탄의 20% 로 둔다. 같은 성능이면 절대
       * 못 피하고, 그러면 유도탄이 아니라 사형선고가 된다.
       */
      const want = Math.atan2(pl.y - b.y, pl.x - b.x)
      const cur = Math.atan2(b.vy, b.vx)
      let d = want - cur
      while (d > Math.PI) d -= Math.PI * 2
      while (d < -Math.PI) d += Math.PI * 2
      const na = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d))
      const sp = Math.hypot(b.vx, b.vy)
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp
      if (b.age > 6) b.dead = true
    } else if (b.kind === 'flakshell' && b.y <= b.burstY) {
      /* 정해진 높이에서 파편으로 터진다 */
      b.dead = true
      boom(b.x, b.y, 10, '#ffd166')
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2
        s.ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 135, vy: Math.sin(a) * 135, r: 3.4, age: 0, dmg: DMG.flak })
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt
  }
  s.ebullets = s.ebullets.filter((b) => !b.dead && b.y > -60 && b.y < H + 40 && b.x > -40 && b.x < W + 40)

  for (const it of s.items) { it.y += 90 * dt; it.t += dt }
  s.items = s.items.filter((it) => it.y < H + 30)

  for (const p of s.parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94 }
  s.parts = s.parts.filter((p) => p.age < p.life)

  for (const a of s.arcs) a.age += dt
  s.arcs = s.arcs.filter((a) => a.age < a.life)

  collide()
  if (s.bannerT > 0) s.bannerT -= dt
}

/* 지상 위협 하나하나의 행동 */
function updateGround(u, dt) {
  const s = state, pl = s.player
  switch (u.kind) {
    case 'turret': {
      u.cd -= dt
      if (u.cd <= 0) {
        u.cd = 1.8 * fireScale()
        const a = Math.atan2(pl.y - u.y, pl.x - u.x)
        for (let k = -1; k <= 1; k++)
          s.ebullets.push({ x: u.x, y: u.y - 8, dmg: DMG.flak, vx: Math.cos(a + k * .09) * 205,
                            vy: Math.sin(a + k * .09) * 205, r: 4, age: 0 })
      }
      break
    }
    case 'flak': {
      u.cd -= dt
      if (u.cd <= 0) {
        u.cd = 3.0 * fireScale()
        // 사용자 높이보다 살짝 위에서 터뜨려야 파편이 내려오며 압박한다
        s.ebullets.push({ x: u.x, y: u.y - 10, vx: (pl.x - u.x) * .35, vy: -300,
                          r: 5, kind: 'flakshell', burstY: Math.max(60, pl.y - 40), age: 0 })
      }
      break
    }
    case 'laser': {
      u.cd -= dt
      if (u.phase === 'idle' && u.cd <= 0) { u.phase = 'aim'; u.ph = 0.9; u.aimX = pl.x }
      else if (u.phase === 'aim') {
        u.ph -= dt
        if (u.ph <= 0) {
          u.phase = 'idle'; u.cd = 3.4 * fireScale()
          s.beams.push({ x: u.aimX, y: u.y, w: 20, age: 0, warn: 0, life: 0.55 })
        }
      }
      break
    }
    case 'radar': {
      const d = Math.hypot(pl.x - u.x, pl.y - u.y)
      if (d < RADAR_R) {
        u.lock += dt
        if (u.lock >= 1.5) {
          u.lock = 0
          banner('미사일')
          for (const k of [-1, 1]) {
            s.ebullets.push({ x: u.x + k * 12, y: u.y - 8, vx: k * 90, vy: -160,
                              r: 5, kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0 })
          }
        }
      } else u.lock = Math.max(0, u.lock - dt * 1.5)
      break
    }
  }
}

/**
 * 맞은 자리에서 파편을 옆으로 흩는다.
 *
 * 파편은 다시 갈라지지 않는다(split 을 물려주지 않는다). 안 그러면 적이
 * 몰린 곳에서 탄이 기하급수로 늘어 프레임이 주저앉는다.
 */
function splitBullet(b) {
  for (const dir of [-1, 1]) {
    state.bullets.push({
      x: b.x, y: b.y, vx: dir * (140 + b.split * 40), vy: -260,
      r: Math.max(2, b.r * .6), dmg: b.dmg * .45, pierce: 0,
      life: .8, age: 0, kind: 'normal',
    })
  }
}

function near(a, b, r) { return (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < r * r }

function collide() {
  const s = state, pl = s.player

  for (const b of s.bullets) {
    if (b.dead || b.kind === 'mine') continue
    for (const e of s.enemies) {
      if (e.dead || b.dead) continue
      if (b.hitList && b.hitList.includes(e)) continue
      if (near(b, e, e.r + b.r)) {
        e.hp -= b.dmg; e.flash = .1
        sfx('hit')
        if (b.kind === 'chain') chainFrom(e, b)
        if (b.split > 0) splitBullet(b)
        if (b.pierce > 0) { b.pierce--; (b.hitList = b.hitList || []).push(e) }
        else b.dead = true
        if (e.hp <= 0) {
          e.dead = true; s.score += e.score; s.kills++
          boom(e.x, e.y, e.kind === 'mid' ? 22 : 12, '#ffb45c')
          // 중형이 죽을 때마다 뭔가 떨어지니 화면이 아이템으로 덮였다
          if (Math.random() < (e.kind === 'mid' ? .55 : .08)) dropItem(e.x, e.y, e.kind === 'mid')
          // 큰 적일수록 많이 찬다. 열댓 마리 잡으면 한 번 쓴다
          const before = s.ult
          // 예전엔 잡졸 열일곱만 잡으면 궁이 찼다. 판이 궁으로만 굴러갔다
          s.ult = Math.min(ULT_MAX, s.ult + (e.kind === 'small' ? 3 : e.kind === 'tank' ? 11 : 6))
          if (before < ULT_MAX && s.ult >= ULT_MAX) sfx('ready')
        }
      }
    }
    /* 지상 위협도 쏴서 없앨 수 있다. 피할 수만 있고 못 없애면 답답하다. */
    for (const u of s.grounds) {
      if (u.dead || b.dead || u.y < -20) continue
      if (b.hitList && b.hitList.includes(u)) continue
      if (near(b, u, u.r + b.r)) {
        u.hp -= b.dmg; u.flash = .1
        if (b.pierce > 0) { b.pierce--; (b.hitList = b.hitList || []).push(u) }
        else b.dead = true
        if (u.hp <= 0) {
          u.dead = true; s.score += u.score; s.kills++
          boom(u.x, u.y, 24, '#ffcf7a')
          // 지상 위협은 피하기 까다로우니 개조가 더 자주 나온다
          if (Math.random() < .35) dropItem(u.x, u.y, true)
        }
      }
    }

    const bs = s.boss
    /* 부위가 먼저 맞는다. 부위를 다 부수기 전에는 코어가 안 깎인다 */
    if (bs && !b.dead && !bs.entering && near(b, bs, bs.r + b.r + 24)) {
      const r = bossHit(bs, b.x, b.y, b.dmg)
      if (r !== 'block') {
        sfx('hit')
        boom(b.x, b.y, 2, r === 'core' ? '#9fe8ff' : '#ffd27a')
        if (b.pierce > 0) b.pierce--; else b.dead = true
      } else if (near(b, bs, bs.r + b.r)) {
        /* 코어가 닫혀 있다. 튕긴다 - 여기를 쏴도 소용없다는 걸 보여준다 */
        b.dead = true
        boom(b.x, b.y, 2, '#8aa0c0')
      }
    }
  }
  s.bullets = s.bullets.filter((b) => !b.dead)
  s.enemies = s.enemies.filter((e) => !e.dead)

  /* 판정은 메인 한 대뿐이다. 윙맨은 그림만 있고 맞지 않는다. */
  for (const b of s.ebullets) {
    if (!near(b, pl, b.r + PLAYER_R)) continue
    b.dead = true
    hitPlayer(b.dmg || DMG.bullet)
  }
  s.ebullets = s.ebullets.filter((b) => !b.dead)

  for (const e of s.enemies) {
    if (!near(e, pl, e.r + PLAYER_R)) continue
    e.dead = true
    boom(e.x, e.y, 14, '#ffb45c')
    hitPlayer(e.kind === 'dive' ? DMG.dive : DMG.ram)
  }
  s.enemies = s.enemies.filter((e) => !e.dead)

  for (const it of s.items) {
    if (!near(it, pl, it.r + 18)) continue
    it.dead = true
    s.score += 60
    sfx('pick')
    // 무엇을 줍든 조금 아문다. 회복 수단이 아예 없으면 후반이 버티기만 된다
    pl.hp = Math.min(pl.maxHp, pl.hp + 12)
    if (it.tk) {
      prog.ticket++
      save()
      banner('가챠권 +1')
      sfx('ready')
    } else if (it.mod) {
      s.mods[it.mod] = Math.min(MOD_MAX, s.mods[it.mod] + 1)
      banner(MODS[it.mod].name + ' ' + s.mods[it.mod])
    } else {
      levelUp()
    }
  }
  s.items = s.items.filter((it) => !it.dead)
}
