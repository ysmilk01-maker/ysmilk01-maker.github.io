<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편대 슈팅 프로토타입</title>

<!--
  편대 종스크롤 슈팅 프로토타입

  편대
    세 대가 함께 난다. 가운데가 메인으로 화력 100%, 좌우 윙맨이 30%.
    세 자리에 각각 다른 기체를 넣을 수 있어서, 조합이 곧 전략이 된다.

  기체 30기
    무기 열 종류 × 세 등급이다. 등급은 숫자만 올리는 게 아니라 탄이
    늘거나 성질이 붙는다 — 같은 유도탄이라도 전설은 두 발이 갈라진다.

  해금
    기본 3기는 무료, 12기는 점수로 열리고, 15기는 유료다.
    **결제는 아직 안 붙였다.** 등급분류가 나오기 전이고 인앱결제는 심사가
    따로 무겁다. 지금은 자리만 비워 두고 개발용 스위치로 열어 본다.

    유료 기체는 확률형(가챠)이 아니라 지정 구매다. 확률형이면 게임산업법상
    확률 표시 의무가 붙고 등급분류에서 사행성을 따로 본다. 그 줄을 넘지
    않으려고 처음부터 이렇게 짰다.

  그림
    지금은 전부 코드로 그린 도형이다. ART 에 주소를 넣으면 그림으로 바뀐다.
-->

<style>
  /*
   * 글꼴은 홈페이지와 같은 것을 쓴다.
   *
   * 한글 UI 에서 글꼴만큼 인상을 크게 바꾸는 게 없다. 맑은 고딕은 굵기가
   * 둘뿐이라 제목과 본문이 같은 무게로 눌린다. 프리텐다드는 가변 폰트라
   * 층이 생긴다.
   *
   * 못 받아 오면 뒤의 목록으로 조용히 내려간다 - 토스 안에서 바깥 주소가
   * 막히는 경우가 있어서 대비를 둔다.
   */
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

  /*
   * 색.
   *
   * 바탕을 푸른 남색에서 거의 검정으로 내렸다. 홈페이지가 검정 바탕이고,
   * 무엇보다 게임 화면(바다·사막·설원)이 저마다 색이 강해서 UI 바탕까지
   * 색을 가지면 서로 싸운다.
   *
   * 금색·붉은색·초록은 홈페이지에서 앱마다 쓰던 색을 그대로 가져왔다.
   * 시안만 게임 것으로 남긴다 - 이건 이 게임의 얼굴이다.
   */
  :root {
    --bg: #08090d; --panel: #13151c; --panel-2: #191c25;
    --line: #23262f; --line-2: #2e323e;
    --ink: #ececef; --muted: #8b8b93; --dim: #5f6068;
    --accent: #4fd1ff; --accent-ink: #04121a;
    --gold: #f0b90b; --warn: #f76c82; --ok: #4f9e77;
    --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
      'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font);
    /* 한국어는 어절 단위로 끊어야 읽힌다. 안 넣으면 낱글자가 줄 끝에 남는다 */
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; touch-action: none; background: #05060a;
    box-shadow: 0 0 0 1px var(--line), 0 24px 80px rgba(0,0,0,.7); border-radius: 12px;
  }

  .screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; padding: 18px;
  }
  .screen[hidden] { display: none !important; }

  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
  .sub { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.65; }
  b { color: var(--accent); font-weight: 700; }
  .lab {
    font-size: 11.5px; color: var(--dim); margin: 18px 0 8px;
    letter-spacing: .02em; font-weight: 600;
  }

  button {
    border: 0; border-radius: 12px; font-family: inherit; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    padding: 13px 24px; transition: transform .08s, background .12s;
  }
  button:active { transform: translateY(1px) scale(.995); }
  button.ghost {
    background: var(--panel); color: var(--muted); font-weight: 600;
    border: 1px solid var(--line);
  }
  button.small { padding: 9px 14px; font-size: 12.5px; border-radius: 10px; }

  /* 편대 슬롯 */
  .slots { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; margin-bottom: 14px; }
  .slot {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 8px; text-align: center; cursor: pointer; min-height: 98px;
  }
  .slot.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .slot .role { font-size: 10.5px; color: var(--dim); letter-spacing: .04em; }
  .slot .nm { font-size: 13px; font-weight: 700; margin-top: 5px; }
  .slot .wp { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .slot .pw { font-size: 10.5px; color: var(--gold); margin-top: 4px; font-weight: 700; }

  /* 기체 목록 */
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 13px; cursor: pointer; position: relative;
  }
  .card.locked { opacity: .5; }
  .card.picked { border-color: var(--accent); }
  .card .nm { font-size: 13.5px; font-weight: 700; }
  .card .wp { font-size: 11px; color: var(--accent); margin-top: 3px; }
  .card .de { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .card .tag {
    position: absolute; top: 9px; right: 10px; font-size: 9.5px; font-weight: 800;
    padding: 2px 6px; border-radius: 5px;
  }
  .t-common { background: #232733; color: #9aa1ae; }
  .t-rare { background: #16324e; color: #7dd3fc; }
  .t-legend { background: #3d2f07; color: var(--gold); }
  .card .lock { font-size: 10.5px; color: var(--gold); margin-top: 5px; font-weight: 700; }
  .card .pv {
    display: block; width: 100%; height: 74px; margin: 2px 0 6px;
    background: radial-gradient(ellipse at 50% 60%, #16243a 0%, #0d1522 72%);
    border-radius: 9px;
  }
  .card .up {
    display: flex; align-items: center; gap: 6px; margin-top: 7px;
    padding-top: 7px; border-top: 1px solid var(--line);
  }
  .card .up .lvl { font-size: 10.5px; color: var(--muted); font-weight: 700; }
  .card .up button {
    margin-left: auto; padding: 4px 9px; font-size: 10.5px; border-radius: 7px;
    background: #24406b; color: #cfe6ff; font-weight: 700; border: 0;
  }
  .card .up button[disabled] { background: #1a2536; color: #5b6a80; }
  .slot .pv { display: block; width: 100%; height: 52px; margin: 2px 0 1px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  /* 제일 자주 누르는 단추다. 다른 것보다 확실히 커야 한다 */
  #launch, #launch2 {
    flex: 1 1 160px; padding: 16px 24px; font-size: 17px; border-radius: 13px;
    box-shadow: 0 6px 18px rgba(79,209,255,.22);
  }
  button.off { opacity: .45; }
  .bar .grow { flex: 1; }
  .hint { font-size: 11px; color: var(--dim); }

  .panel {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(6,7,10,.9); backdrop-filter: blur(4px);
    text-align: center; padding: 24px;
  }
  .panel[hidden] { display: none !important; }

  /* 하단 탭 — 화면을 넷으로 나눴으니 오가는 길이 늘 보여야 한다 */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
    background: rgba(8,9,13,.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabs button {
    background: transparent; color: var(--dim); font-size: 11.5px;
    font-weight: 600; padding: 10px 2px; border-radius: 10px; border: 0;
  }
  .tabs button.on { color: var(--accent); background: rgba(79,209,255,.10); font-weight: 700; }
  .tabs[hidden] { display: none !important; }
  /* 탭이 아래에 떠 있다. 그만큼을 비워 두지 않으면 출격 단추가 그 밑에 깔린다 */
  .screen { padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px 8px; }

  /* 편대 요약 */
  .sum { display: grid; gap: 7px; margin-top: 14px; }
  .row {
    display: flex; align-items: center; gap: 9px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 13px;
  }
  .row .k { color: var(--muted); }
  .row .v { margin-left: auto; font-weight: 800; }
  .row .v.gold { color: var(--gold); }
  .locked-slot { opacity: .45; border-style: dashed; }

  /* 파일럿 */
  .xpbar { height: 8px; border-radius: 5px; background: #16203200; background-color: #162032; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: var(--accent); }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
  .stat .hd { display: flex; align-items: baseline; gap: 8px; }
  .stat .nm { font-size: 13.5px; font-weight: 800; }
  .stat .ef { font-size: 11px; color: var(--gold); font-weight: 700; }
  .stat .de { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .stat .pips { display: flex; gap: 3px; margin-top: 8px; align-items: center; }
  .stat .pip { width: 100%; height: 7px; border-radius: 3px; background: #1a2536; }
  .stat .pip.on { background: var(--accent); }
  .stat .pips button {
    flex: none; margin-left: 8px; padding: 4px 11px; font-size: 12px; border-radius: 7px;
    background: #24406b; color: #cfe6ff; font-weight: 800;
  }
  .stat .pips button[disabled] { background: #1a2536; color: #5b6a80; }
  .marks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 8px; }
  .mark {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px; cursor: pointer; display: grid; place-items: center;
  }
  .mark.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  input.nm {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); font-family: inherit; font-size: 14px; padding: 11px 12px;
  }
  input.nm:focus { outline: none; border-color: var(--accent); }
  .lab { font-size: 11px; color: var(--dim); margin: 14px 0 6px; letter-spacing: .03em; }

  /* 기록 */
  .rank { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
          border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .rank .no { width: 22px; color: var(--dim); font-weight: 800; font-variant-numeric: tabular-nums; }
  .rank .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
  .rank .dt { margin-left: auto; color: var(--dim); font-size: 10.5px; }
  .rank.top .sc { color: var(--gold); }
  .empty { color: var(--dim); font-size: 12.5px; padding: 22px 2px; line-height: 1.8; }

  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button { padding: 7px 12px; font-size: 12px; border-radius: 8px;
                    background: #141c2c; color: var(--muted); font-weight: 700; }
  .filters button.on { background: var(--accent); color: #04121a; }

  /* 스테이지 */
  .stages { display: grid; gap: 9px; }
  .card.stg .pv { height: 92px; background: none; }
  .hearts { letter-spacing: 2px; font-size: 13px; }
  .hearts .on { color: var(--warn); }
  .hearts .off { color: #2a3547; }

  /* ================================================================
   * 시작 연출
   *
   * 홈페이지(ysmilk01-maker.github.io)에 쓴 것과 같은 것이다. 마크가
   * 왼쪽부터 닦여 나오고, 뒤에서 빛이 번지고, 링 둘이 퍼지고, 글자 안쪽으로
   * 광택이 지나간다. 타이밍도 그대로 가져왔다 - 두 곳이 다르면 같은 데서
   * 만든 것으로 안 보인다.
   *
   * 움직임을 줄여 달라고 한 사람에게는 아예 만들지 않는다.
   * ================================================================ */
  .boot {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center; background: #05070d;
    animation: boot-out .62s cubic-bezier(.5,0,.75,0) 1.62s forwards;
  }
  .boot-stage { position: relative; width: min(320px, 62vw); aspect-ratio: 501 / 78; }
  .boot-glow {
    position: absolute; left: 50%; top: 50%; width: 220%; aspect-ratio: 1;
    transform: translate(-50%,-50%) scale(.4); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(72,92,255,.5), rgba(120,60,240,.18) 45%, transparent 72%);
    filter: blur(12px); opacity: 0;
    animation: boot-glow 1.5s ease-out .05s forwards;
  }
  .boot-ring {
    position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1;
    transform: translate(-50%,-50%) scale(.3);
    border: 1.5px solid rgba(120,130,255,.55); border-radius: 50%; opacity: 0;
    animation: boot-ring 1.15s cubic-bezier(.2,.7,.3,1) .42s forwards;
  }
  .boot-ring-2 { animation-delay: .6s; border-color: rgba(150,110,255,.4); }
  .boot-logo {
    position: absolute; inset: 0; clip-path: inset(0 100% 0 0); transform: scale(.94);
    animation: boot-wipe .82s cubic-bezier(.22,.9,.24,1) .22s forwards,
               boot-pop 1.05s cubic-bezier(.16,1,.3,1) .22s forwards;
  }
  .boot-logo img { width: 100%; height: auto; }
  .boot-shine {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%);
    background-size: 260% 100%; background-repeat: no-repeat;
    opacity: 0; animation: boot-shine .9s ease-in-out .72s forwards;
  }
  @keyframes boot-wipe { to { clip-path: inset(0 0 0 0); } }
  @keyframes boot-pop { to { transform: scale(1); } }
  @keyframes boot-glow { 30% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
                         to { opacity: 0; transform: translate(-50%,-50%) scale(1.35); } }
  @keyframes boot-ring { 10% { opacity: .9; }
                         to { opacity: 0; transform: translate(-50%,-50%) scale(2.6); } }
  @keyframes boot-shine { from { opacity: 1; background-position: 170% 0; }
                          to { opacity: 1; background-position: -70% 0; } }
  @keyframes boot-out { to { opacity: 0; transform: scale(1.06); visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .boot { display: none; } }


  /* 챕터 지도 */
  .chtabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .chtabs button { padding: 8px 12px; font-size: 12px; border-radius: 9px;
                   background: #141c2c; color: var(--muted); font-weight: 700; }
  .chtabs button.on { background: var(--accent); color: #04121a; }
  .chtabs button.lock { opacity: .45; }
  .nodes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 10px; }
  .node {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 2px 6px; text-align: center; cursor: pointer; position: relative;
  }
  .node.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .node.lock { opacity: .38; }
  .node.boss { background: #24141a; border-color: #4a2833; }
  .node .n { font-size: 13px; font-weight: 800; color: var(--ink); }
  .node .k { font-size: 9px; color: var(--gold); font-weight: 800; }
  .node .st { font-size: 9px; letter-spacing: 1px; margin-top: 2px; }
  .node .st .on { color: var(--gold); }
  .node .st .off { color: #2a3547; }

  /* 오늘의 임무 */
  .miss { display: grid; gap: 7px; margin-top: 14px; }
  .mrow {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px;
  }
  .mrow.done { border-color: var(--ok); }
  .mrow .top { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
  .mrow .nm { font-weight: 700; }
  .mrow .rw { margin-left: auto; font-size: 11px; color: var(--gold); font-weight: 800; }
  .mrow .bar2 { height: 6px; border-radius: 4px; background: #162032; overflow: hidden; margin-top: 7px; }
  .mrow .bar2 i { display: block; height: 100%; background: var(--accent); }
  .mrow button {
    margin-top: 8px; width: 100%; padding: 7px; font-size: 12px; border-radius: 8px;
    background: var(--ok); color: #04120a; font-weight: 800;
  }
  .mrow button[disabled] { background: #1a2536; color: #5b6a80; }
  .setrow {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px;
  }
  .setrow .nm { font-size: 13px; font-weight: 700; }
  .setrow .de { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .setrow .sw {
    margin-left: auto; width: 46px; height: 26px; border-radius: 13px;
    background: #1a2536; position: relative; cursor: pointer; flex: none;
  }
  .setrow .sw.on { background: var(--accent); }
  .setrow .sw::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #cfe0f5; transition: left .15s;
  }
  .setrow .sw.on::after { left: 23px; }

  /* 뽑기 */
  .gbox {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px;
    padding: 20px 18px; width: min(420px, 100%); max-height: 86vh; overflow-y: auto;
  }
  .gbox h2 { margin-bottom: 12px; }
  .got {
    display: grid; place-items: center; gap: 6px; padding: 22px 10px;
    background: #0a1220; border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px;
  }
  .got .big { font-size: 20px; font-weight: 800; }
  .got .cnt { font-size: 13px; color: var(--gold); font-weight: 800; }
  .got .msg { font-size: 12px; color: var(--muted); }
  .rate { display: flex; font-size: 12.5px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .rate .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  .shard { font-size: 10.5px; color: var(--accent); margin-top: 4px; font-weight: 700; }
  .grades { display: grid; gap: 7px; }
  .gcard {
    display: flex; align-items: center; gap: 9px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer;
  }
  .gcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .gcard.no { opacity: .5; }
  .gcard .nm { font-size: 13px; font-weight: 800; }
  .gcard .de { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .gcard .rt { margin-left: auto; font-size: 11px; font-weight: 800; color: var(--gold); }

  /* 접속 보상 */

<script>
'use strict'

/* ================================================================
 * 그림 슬롯 — 비우면 코드로 그린 도형이 나온다
 * ================================================================ */
const ART = { planes: {}, enemySmall: '', enemyMid: '', boss: '' }
const IMG = {}
function img(src) {
  if (!src) return null
  if (!IMG[src]) { const i = new Image(); i.src = src; IMG[src] = i }
  const i = IMG[src]
  return i.complete && i.naturalWidth ? i : null
}

/* ================================================================
 * 무기 열 가지
 *
 * 등급은 숫자만 올리지 않는다. 탄이 갈라지거나 성질이 하나 붙는다 —
 * 그래야 상위 기체를 얻었을 때 "달라졌다"가 손에 잡힌다.
 * ================================================================ */
const WEAPONS = {
  rapid:   { name: '연발탄', desc: '빠르게 곧게 나갑니다' },
  spread:  { name: '산탄',   desc: '부채꼴로 넓게 퍼집니다' },
  laser:   { name: '레이저', desc: '얇게 이어져 뚫고 지나갑니다' },
  homing:  { name: '유도탄', desc: '가까운 적을 쫓아갑니다' },
  pierce:  { name: '관통탄', desc: '적을 뚫고 계속 갑니다' },
  wave:    { name: '파동탄', desc: '좌우로 흔들리며 나아갑니다' },
  orb:     { name: '궤도구슬', desc: '기체 둘레를 돌며 부딪칩니다' },
  mine:    { name: '기뢰',   desc: '멈춰 있다가 터집니다' },
  beam:    { name: '집속포', desc: '굵고 느리게, 크게 터집니다' },
  boomer:  { name: '부메랑', desc: '나갔다가 되돌아옵니다' },
  chain:   { name: '연쇄뇌격', desc: '맞은 적에서 번개가 옆으로 튑니다' },
}

const TIERS = { common: '일반', rare: '희귀', legend: '전설' }

/*
 * 필살기.
 *
 * 메인 자리에 태운 기체의 무기에 따라 달라진다. 게이지는 적을 잡으면 찬다 —
 * 돈이 아니라 플레이로 채우는 자원이라, 오래 붙잡고 있을수록 자주 쓴다.
 *
 * 열 종류가 다 다른 일을 하지만 하는 일은 셋 중 하나다. 화면을 쓸거나(폭격,
 * 파동, 광선), 잠깐 세지거나(난사, 돌격), 도움을 부른다(호위, 방벽).
 */
const ULT = {
  rapid:  { name: '난사', desc: '5초간 발사 속도가 세 배가 됩니다' },
  spread: { name: '전면 소사', desc: '화면 폭을 훑는 광선이 2.5초간 지나갑니다' },
  laser:  { name: '관통 광선', desc: '굵은 광선이 3초간 위를 뚫습니다' },
  homing: { name: '일제 사격', desc: '화면의 모든 적에게 유도탄이 날아갑니다' },
  pierce: { name: '돌격', desc: '무적으로 위로 뚫고 올라갑니다' },
  wave:   { name: '충격파', desc: '퍼지는 파동이 적탄을 지우고 적을 밀칩니다' },
  orb:    { name: '위성 방벽', desc: '구슬 여덟 개가 6초간 돌며 막습니다' },
  mine:   { name: '융단 폭격', desc: '옆으로 빠지며 화면 전체에 폭탄을 떨굽니다' },
  beam:   { name: '거포 사격', desc: '큰 포격이 세 번 떨어집니다' },
  boomer: { name: '호위 편대', desc: '아군 넷이 6초간 함께 쏩니다' },
  chain:  { name: '뇌우', desc: '화면의 적을 번개가 차례로 물고 갑니다' },
}
const ULT_MAX = 100          // 게이지 가득. 적 하나에 얼마나 차는지는 처치 쪽에 있다

/* 기체 그림에 쓰는 무기 색. 그 무기가 쏘는 탄 색을 그대로 가져왔다 */
const WEAPON_COLOR = {
  rapid: '#cfe3ff', spread: '#ffd9a8', laser: '#bff4ff', homing: '#ffa8d6', pierce: '#ffe08a',
  wave: '#8fd8ff', orb: '#c9a8ff', mine: '#ffd166', beam: '#e6f4ff', boomer: '#9fffcf',
  chain: '#a8e8ff',
}

/* ================================================================
 * 탄 개조 — 그 판에서만
 *
 * 격납고에서 고르는 기체는 판을 넘어 남지만 이건 판이 끝나면 사라진다.
 * 그래야 같은 편대로 나가도 매번 다른 판이 된다. 뭐가 떨어질지 모르니
 * 주운 것에 맞춰 굴리게 된다.
 *
 * 저장하지 않는다. state 에만 들어가고 start() 마다 비워진다.
 *
 * 셋까지만 쌓인다. 상한이 없으면 운 좋은 판에서 화면이 탄으로 덮여
 * 정작 적이 안 보인다.
 * ================================================================ */
const MOD_MAX = 3
const MODS = {
  pierce: { ko: '관', name: '관통',   color: '#ffe08a', desc: '적을 하나 더 뚫습니다' },
  split:  { ko: '분', name: '분열',   color: '#ff9ecb', desc: '맞히면 파편이 갈라집니다' },
  extra:  { ko: '증', name: '증편',   color: '#9fe8ff', desc: '한 발 더 나갑니다' },
  seek:   { ko: '유', name: '유도',   color: '#c9a8ff', desc: '탄이 적을 약하게 쫓습니다' },
  rate:   { ko: '속', name: '속사',   color: '#7dffd4', desc: '사격 간격이 줄어듭니다' },
  big:    { ko: '대', name: '대구경', color: '#ffc44d', desc: '탄이 커지고 세집니다' },
  bounce: { ko: '반', name: '반사',   color: '#8fd8ff', desc: '옆 벽에 튕깁니다' },
  speed:  { ko: '가', name: '가속',   color: '#a8ffb0', desc: '탄이 빨라집니다' },
}
const MOD_KEYS = Object.keys(MODS)

/** 이미 셋을 다 채운 것은 빼고 고른다. 꽉 찬 걸 또 주면 주운 보람이 없다. */
function rollMod(mods) {
  const pool = MOD_KEYS.filter((k) => (mods[k] || 0) < MOD_MAX)
  if (!pool.length) return null
  return pool[(Math.random() * pool.length) | 0]
}

/*
 * 기체 30기 = 무기 10종 × 등급 3.
 *
 * unlock 은 세 가지다.
 *   free        처음부터
 *   score:N     누적 점수 N 점
 *   paid:원     유료 (결제는 아직 안 붙었다)
 */
const PLANES = []
{
  const NAMES = {
    rapid:  ['참새', '매', '번개매'],
    spread: ['부채', '나팔', '폭풍나팔'],
    laser:  ['바늘', '실', '광선실'],
    homing: ['사냥개', '늑대', '유령늑대'],
    pierce: ['송곳', '창', '벼락창'],
    wave:   ['물결', '해일', '심연해일'],
    orb:    ['팽이', '위성', '쌍성'],
    mine:   ['씨앗', '지뢰', '검은씨앗'],
    beam:   ['망치', '대포', '천둥대포'],
    boomer: ['회귀', '부메랑', '쌍회귀'],
  }
  const TIER_LIST = ['common', 'rare', 'legend']
  const UNLOCK = {
    // 각 무기의 일반형 중 셋만 무료, 나머지 일반형은 점수, 희귀는 점수, 전설은 유료
    common: (i) => (i < 3 ? { kind: 'free' } : { kind: 'score', v: 2000 + i * 1500 }),
    rare:   (i) => ({ kind: 'score', v: 12000 + i * 4000 }),
    legend: (i) => ({ kind: 'paid', v: 1200 + i * 300 }),
  }
  // 연쇄뇌격은 전설만 있다. 격자에 넣으면 일반형·희귀형 빈칸이 생긴다
  Object.keys(WEAPONS).filter((w) => w !== 'chain').forEach((w, i) => {
    TIER_LIST.forEach((t, ti) => {
      PLANES.push({
        id: w + '-' + t,
        name: NAMES[w][ti],
        weapon: w,
        tier: t,
        power: [1, 1.35, 1.8][ti],       // 화력 배수
        rate: [1, 0.88, 0.74][ti],       // 사격 간격 배수 (작을수록 빠름)
        unlock: UNLOCK[t](i),
      })
    })
  })

  /*
   * 격자 밖에 있는 한 대.
   *
   * 열 무기 × 세 등급 밖에 따로 둔다. 일반형·희귀형이 없어서 격자에 넣으면
   * 빈칸이 생긴다. 점수로는 안 열리고 뽑기와 결제로만 나온다.
   */
  PLANES.push({
    id: 'chain-legend', name: '뇌신', weapon: 'chain', tier: 'legend',
    power: 1.5, rate: 0.9, unlock: { kind: 'paid', v: 4500 },
  })
}

/* ================================================================
 * 저장 — 해금과 누적 점수
 * ================================================================ */
/* ================================================================
 * 출격권
 *
 * 다섯 판을 들고 시작하고 30분에 하나씩 찬다. 다 쓰면 광고를 보고 한 판.
 *
 * 조심할 것이 하나 있다. 이 게임의 목적은 오래 하게 만드는 것인데 출격권은
 * 그 반대로 작동한다 - 처음 온 사람이 15분 만에 벽을 만나면 다시 안 온다.
 * 그래서 상한을 다섯으로 넉넉히 두고, 비어 있을 때 광고 한 번이면 바로
 * 이어서 할 수 있게 했다. 기다리라고만 하면 그냥 나간다.
 * ================================================================ */
/* ================================================================
 * 별과 가챠권
 *
 * 판을 돌면 별이 하나, 깨면 셋이 찬다. 셋이 모이면 뽑기 한 장.
 * 못 깨도 별은 쌓이므로 지고 나가도 손에 남는 게 있다 - 지기만 하다
 * 아무것도 못 받으면 세 판 만에 그만둔다.
 * ================================================================ */
/* ================================================================
 * 접속 보상
 *
 * 이레마다 한 바퀴 돈다. 하루라도 거르면 첫날로 돌아간다.
 *
 * 넷째 날과 이렛날에 가챠권을 둔다. 부품만 주면 며칠째인지 체감이 안 되고,
 * 매일 가챠권을 주면 판을 돌 이유가 없어진다.
 * ================================================================ */
const LOGIN_WEEK = [
  { day: '일', kind: 'ticket', n: 3 },
  { day: '월', kind: 'ticket', n: 3 },
  { day: '화', kind: 'xp',     n: 3000 },
  { day: '수', kind: 'parts',  n: 1500 },
  { day: '목', kind: 'ticket', n: 3 },
  { day: '금', kind: 'energy', n: 5 },
  { day: '토', kind: 'energy', n: 5 },
]
const REWARD_NAME = {
  parts: '부품', energy: '출격권', ticket: '가챠권', xp: '파일럿 경험치',
}

function dayKey(d) {
  const x = d || new Date()
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') +
         '-' + String(x.getDate()).padStart(2, '0')
}

/** 오늘 몫을 아직 안 받았으면 주고 무엇을 줬는지 돌려준다 */
function claimDaily() {
  const today = dayKey()
  if (prog.login.last === today) return null
  const y = new Date(); y.setDate(y.getDate() - 1)
  prog.login.streak = prog.login.last === dayKey(y) ? prog.login.streak + 1 : 1
  prog.login.last = today

  const idx = new Date().getDay()          // 0 이 일요일
  const r = LOGIN_WEEK[idx]
  let up = 0
  if (r.kind === 'parts') prog.parts += r.n
  else if (r.kind === 'ticket') prog.ticket += r.n
  else if (r.kind === 'energy') prog.energy.n = energy() + r.n
  else if (r.kind === 'xp') up = addXpRaw(r.n)
  save()
  return { ...r, idx, up, streak: prog.login.streak }
}

/* ================================================================
 * 오늘의 임무
 *
 * 접속 보상은 받고 나가면 끝이다. 임무는 판을 돌게 만든다 - 재방문이
 * 거의 없는 지금 제일 아쉬운 자리다.
 *
 * 날짜를 시드로 세 개를 고른다. 같은 날이면 누구에게나 같은 임무이고,
 * 자정이 지나면 새로 뽑힌다. 서버는 필요 없다.
 * ================================================================ */
const MISSIONS = [
  { id: 'kill',  say: (n) => `적기 ${n}대 격추`,        ns: [70, 100, 140],  give: ['parts', 800] },
  { id: 'clear', say: (n) => `단계 ${n}개 클리어`,       ns: [2, 3],          give: ['ticket', 1] },
  { id: 'star',  say: (n) => `별 ${n}개 모으기`,         ns: [3, 4, 6],       give: ['ticket', 1] },
  { id: 'ult',   say: (n) => `필살기 ${n}번 쓰기`,       ns: [3, 5],          give: ['parts', 600] },
  { id: 'nohit', say: (n) => `한 대도 안 맞고 클리어`,   ns: [1],             give: ['ticket', 2] },
  { id: 'score', say: (n) => `한 판에 ${n.toLocaleString('ko-KR')}점`, ns: [12000, 18000], give: ['parts', 1000] },
  { id: 'run',   say: (n) => `${n}판 출격`,              ns: [3, 5],          give: ['energy', 2] },
  { id: 'boss',  say: (n) => `보스 ${n}번 격파`,         ns: [1, 2],          give: ['ticket', 2] },
]

/** 오늘 몫 셋을 고른다. 이미 뽑아 둔 날이면 그대로 쓴다 */
function missions() {
  const today = dayKey()
  if (prog.miss && prog.miss.d === today) return prog.miss
  const r = seeded(today.split('-').join('') | 0)
  const pool = MISSIONS.slice()
  const list = []
  for (let i = 0; i < 3 && pool.length; i++) {
    const m = pool.splice((r() * pool.length) | 0, 1)[0]
    const n = m.ns[(r() * m.ns.length) | 0]
    list.push({ id: m.id, n, p: 0, taken: false })
  }
  prog.miss = { d: today, list }
  save()
  return prog.miss
}
function missDef(id) { return MISSIONS.find((m) => m.id === id) }
function missDone(q) { return q.p >= q.n }

/** 판이 끝나면 진행도를 올린다 */
function bumpMissions(win, rate, bossRun) {
  const s = state
  for (const q of missions().list) {
    if (missDone(q)) continue
    switch (q.id) {
      case 'kill':  q.p += s.kills; break
      case 'clear': if (win) q.p++; break
      case 'star':  q.p += rate; break
      case 'ult':   q.p += s.ultUsed; break
      case 'nohit': if (win && s.hitCount === 0) q.p++; break
      case 'score': q.p = Math.max(q.p, s.score); break
      case 'run':   q.p++; break
      case 'boss':  if (win && bossRun) q.p++; break
    }
    if (q.p > q.n) q.p = q.n
  }
  save()
}

/** 다 한 임무의 보상을 받는다 */
function takeMission(i) {
  const q = missions().list[i]
  if (!q || q.taken || !missDone(q)) return null
  const [kind, n] = missDef(q.id).give
  if (kind === 'parts') prog.parts += n
  else if (kind === 'ticket') prog.ticket += n
  else if (kind === 'energy') prog.energy.n = energy() + n
  q.taken = true
  save()
  return { kind, n }
}

const EN_REGEN = 30 * 60 * 1000        // 30분에 하나

/* ================================================================
 * 부품 — 게임 안에서 버는 재화
 *
 * 판을 돌면 점수에 비례해 쌓이고, 격납고에서 기체별 무기를 올린다.
 * 개조(그 판에서만)와 다르게 이건 남는다.
 *
 * 돈으로 사는 전설 기체와도 별개다. 전설을 안 사도 일반 기체를 끝까지
 * 올리면 따라갈 수 있어야 한다 — 그래야 "돈 없으면 못 한다"가 안 된다.
 * ================================================================ */
/* ================================================================
 * 조각과 뽑기
 *
 * 뽑기는 기체를 통째로 주지 않고 조각을 준다. 통째로 주면 이미 가진 게
 * 또 나왔을 때 허탕이 되는데, 조각이면 어떤 것이 나와도 쌓인다.
 *
 * 값은 가챠권으로 치른다. 가챠권은 판을 돌아야만 생기고 돈으로 살 수 없다 -
 * 게임산업법의 확률형 아이템은 유상으로 사는 것이 대상이라 여기 걸리지
 * 않는다. 그래도 확률은 화면에 적어 둔다. 앱인토스 게임 출시 항목에
 * "확률 정보를 사용자가 확인할 수 있어요" 가 있고, 무엇보다 안 적으면
 * 뽑는 사람이 손해를 본다.
 *
 * 부품은 강화에만 쓴다. 재화 둘이 하는 일이 갈라져 있어야 어느 쪽을
 * 모아야 하는지가 분명해진다.
 * ================================================================ */
const SHARD_NEED = { common: 20, rare: 40, legend: 80 }      // 기체 해금
/* 강화 1~5단계에 드는 조각. 뒤로 갈수록 가파르다 */
const SHARD_UPG = [10, 20, 30, 50, 100]
const GACHA = {
  plane: {
    name: '기체 뽑기', cost: 1,
    rates: [['legend', 7], ['rare', 33], ['common', 60]],
    amount: { legend: [3, 6], rare: [5, 9], common: [8, 14] },
    jackpot: 1.0,        // 조각이 아니라 기체가 통째로 나올 확률(%)
  },
  pilot: {
    name: '파일럿 뽑기', cost: 1,
    rates: [['legend', 1], ['high', 7], ['mid', 22], ['normal', 70]],
    amount: { legend: [2, 4], high: [3, 6], mid: [6, 11], normal: [10, 18] },
    jackpot: 0.5,        // 조각이 아니라 파일럿이 통째로 나올 확률(%)
  },
}
/** 완성품이 이미 가진 것에 걸렸을 때 대신 주는 조각 */
const JACK_SHARD = 10
/*
 * 백 장을 쓰면 기체 하나가 확정으로 나온다.
 *
 * 조각만 쌓이다 보면 "이걸 계속 돌려서 뭐가 되나" 하는 구간이 온다.
 * 백 장이면 눈에 보이는 끝이 있어서 그 구간을 넘긴다. 등급은 랜덤이다 -
 * 확정을 주되 무엇이 나올지는 안 정한다.
 */
const HARD_PITY = 100
/*
 * 가챠권 판매.
 *
 * 결제가 붙으면 뽑기가 '간접적으로 유상'이 되어 게임산업법의 확률형 아이템
 * 대상이 된다. 연평균 매출 1억원 이하는 표시 의무가 면제지만, 우리는 어차피
 * 확률을 적고 있으니 달라질 게 없다.
 */
const SHOP = [
  { n: 10, won: 1000 },
  { n: 20, won: 1500 },
  { n: 50, won: 3000 },
]

/* 천장. 안 나오는 사람이 끝없이 안 나오는 일을 막는다 */
const PITY = { plane: { at: 40, tier: 'legend' }, pilot: { at: 60, tier: 'high' } }

function shardOf(id) { return prog.shardP[id] || 0 }
function shardG(k) { return prog.shardG[k] || 0 }
function shardNeed(p) { return SHARD_NEED[p.tier] }
function shardUpg(p, lv) { return SHARD_UPG[lv] || 0 }

function rollTier(kind) {
  const g = GACHA[kind]
  const n = prog.pull[kind] + 1
  const pity = PITY[kind]
  if (pity && n % pity.at === 0) return pity.tier      // 천장
  let r = Math.random() * 100
  for (const [t, w] of g.rates) { if (r < w) return t; r -= w }
  return g.rates[g.rates.length - 1][0]
}

function pull(kind) {
  const g = GACHA[kind]
  if (prog.ticket < g.cost) return null
  prog.ticket -= g.cost
  prog.pull[kind]++

  /* 백 장째는 기체가 통째로 나온다. 등급은 그때 뽑는다 */
  if (kind === 'plane' && prog.pull.plane % HARD_PITY === 0) {
    const locked = PLANES.filter((p) => !unlocked(p))
    if (locked.length) {
      const pick = locked[Math.floor(Math.random() * locked.length)]
      prog.owned.push(pick.id)
      save()
      return { kind, tier: pick.tier, n: 1, name: pick.name, plane: pick,
               got: true, jack: true, hard: true }
    }
  }
  const tier = rollTier(kind)
  const [lo, hi] = g.amount[tier]
  let n = lo + Math.floor(Math.random() * (hi - lo + 1))
  const jack = Math.random() * 100 < g.jackpot

  if (kind === 'pilot') {
    const fresh = GRADE_NEED[tier] > 0 && !hasGrade(tier)
    if (jack && fresh) {
      prog.pilotOwned[tier] = true
      save()
      return { kind, tier, n: 1, name: GRADES[tier].name + ' 파일럿', got: true, jack: true }
    }
    /* 이미 가진 등급에 걸리면 조각 열 개로 바꿔 준다. 아니면 그냥 꽝이 된다 */
    let big = false
    if (jack) { n = JACK_SHARD; big = true }
    prog.shardG[tier] = shardG(tier) + n
    const got = fresh && prog.shardG[tier] >= GRADE_NEED[tier]
    if (got) { prog.pilotOwned[tier] = true; prog.shardG[tier] -= GRADE_NEED[tier] }
    save()
    return { kind, tier, n, big, name: GRADES[tier].name + ' 파일럿 조각', got }
  }

  /*
   * 그 등급 중에서 아직 안 연 기체를 고르되, 이미 제일 많이 모은 쪽에 몰아준다.
   *
   * 매번 아무 기체나 고르면 조각이 열 기체에 흩어져서 아무도 문턱에 못 닿는다.
   * 전설은 첫 해금까지 863번을 돌려야 했다. 몰아주면 254번이 된다.
   * 다 열었으면 아무거나 - 그때부터는 강화에 쓴다.
   */
  const pool = PLANES.filter((p) => p.tier === tier)
  const locked = pool.filter((p) => !unlocked(p))
  let pick
  if (locked.length) {
    let best = -1
    for (const p of locked) {
      const v = shardOf(p.id)
      if (v > best) { best = v; pick = p }
    }
  } else {
    pick = pool[Math.floor(Math.random() * pool.length)]
  }
  const fresh = !unlocked(pick)

  if (jack && fresh) {
    prog.owned.push(pick.id)
    save()
    return { kind, tier, n: 1, name: pick.name, plane: pick, got: true, jack: true }
  }
  let big = false
  if (jack) { n = JACK_SHARD; big = true }
  prog.shardP[pick.id] = shardOf(pick.id) + n
  const got = fresh && prog.shardP[pick.id] >= shardNeed(pick)
  if (got) { prog.owned.push(pick.id); prog.shardP[pick.id] -= shardNeed(pick) }
  save()
  return { kind, tier, n, big, name: pick.name + ' 조각', plane: pick, got }
}

const UPG_MAX = 5
/** 판이 끝나면 점수의 5% 를 부품으로 준다 */
function partsEarned(score) { return Math.max(1, Math.round(score / 20)) }
/** 다음 단계 비용. 등급이 높을수록 비싸다 */
function upgCost(p, lv) {
  const t = { common: 1, rare: 1.6, legend: 2.4 }[p.tier]
  return Math.round((40 + lv * 55) * t)
}
function upgOf(id) { return prog.upg[id] || 0 }
/** 강화 단계가 화력과 연사에 얹히는 몫 */
function upgPower(id) { return 1 + upgOf(id) * 0.12 }
function upgRate(id) { return 1 - upgOf(id) * 0.04 }
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(prog)) } catch { /* 무시 */ }
}
let prog = load()
if (!prog.energy.t) { prog.energy.t = Date.now(); prog.energy.n = EN_MAX }

/**
 * 지금 남은 출격권. 부를 때마다 그동안 찬 만큼을 정산한다.
 *
 * 타이머를 돌리지 않고 시각 차이로 계산한다. 앱을 꺼 둔 동안에도 차야 하고,
 * 타이머는 화면이 꺼지면 브라우저가 멈춰 세우기 때문이다.
 */
function energy() {
  const e = prog.energy
  // 보상으로 받은 것은 상한 위로 쌓인다. 저절로 차는 것만 다섯에서 멈춘다
  if (e.n >= enMax()) { e.t = Date.now(); return e.n }
  const got = Math.floor((Date.now() - e.t) / EN_REGEN)
  if (got > 0) {
    e.n = Math.min(enMax(), e.n + got)
    e.t = e.n >= enMax() ? Date.now() : e.t + got * EN_REGEN
    save()
  }
  return e.n
}
/** 다음 한 장까지 남은 밀리초. 꽉 찼으면 0 */
function energyWait() {
  if (energy() >= enMax()) return 0
  return Math.max(0, EN_REGEN - (Date.now() - prog.energy.t))
}
function energySpend() {
  const e = prog.energy
  if (energy() <= 0) return false
  if (e.n >= enMax()) e.t = Date.now()   // 꽉 찬 상태에서 처음 쓰면 그때부터 잰다
  e.n--
  save()
  return true
}
function adDayLeft() {
  const key = new Date().toISOString().slice(0, 10)
  if (prog.adDay.d !== key) { prog.adDay = { d: key, n: 0 }; save() }
  return AD_ENERGY_DAY - prog.adDay.n
}
function mmss(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000))
  return String((t / 60) | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0')
}

function unlocked(p) {
  if (p.unlock.kind === 'free') return true
  if (prog.owned.includes(p.id)) return true
  if (p.unlock.kind === 'score') return prog.total >= p.unlock.v
  return false
}
function unlockLabel(p) {
  if (p.unlock.kind === 'free') return ''
  if (prog.owned.includes(p.id)) return ''
  if (p.unlock.kind === 'score') return `누적 ${p.unlock.v.toLocaleString('ko-KR')}점`
  return `${p.unlock.v.toLocaleString('ko-KR')}원`
}

/* ================================================================
 * 파일럿
 *
 * 기체 강화가 "무엇을 타는가"라면 파일럿은 "누가 타는가"다. 기체를 바꿔도
 * 따라오므로, 새 기체를 열었다고 처음부터 다시 키우는 느낌이 안 든다.
 *
 * 몫을 일부러 작게 잡았다. 기체 강화가 화력 +60%, 판 안의 편대 강화가
 * +65% 인데 파일럿까지 큰 몫을 가지면 셋 다 밋밋해진다. 파일럿은 최대
 * +25% 다 - 있으면 확실히 다르지만 다른 둘을 밀어내지 않는다.
 * ================================================================ */
/*
 * 파일럿 등급.
 *
 * 레전드가 스탯은 제일 낮지만 자리를 하나 더 준다. 상급을 위로 두면 등급이
 * 그냥 사다리가 되는데, 이렇게 두면 "화력이냐 자리냐"를 고르게 된다.
 */
const GRADES = {
  normal: { name: '일반',   base: 1.00, rear: false, tag: 't-common' },
  mid:    { name: '중급',   base: 1.10, rear: false, tag: 't-rare' },
  high:   { name: '상급',   base: 1.20, rear: false, tag: 't-rare' },
  legend: { name: '레전드', base: 1.00, rear: true,  tag: 't-legend' },
}
const GRADE_KEYS = ['normal', 'mid', 'high', 'legend']
/** 그 등급을 열려면 필요한 조각 */
const GRADE_NEED = { normal: 0, mid: 40, high: 80, legend: 150 }

const PILOT_MAX = 30
const ST_MAX = 10
const STATS = {
  pow:  { name: '화력', per: 2.5, unit: '%', desc: '탄 한 발의 위력이 오릅니다' },
  rate: { name: '연사', per: 1.5, unit: '%', desc: '사격 간격이 줄어듭니다' },
  rng:  { name: '탄폭', per: 2.0, unit: '%', desc: '탄이 굵어져 잘 맞습니다' },
  hp:   { name: '내구', per: 6,   unit: '',  desc: '최대 체력이 늘어납니다' },
}
const ST_KEYS = Object.keys(STATS)

/* 한 판이 대략 15,000~20,000 점이니 초반 레벨은 반 판에 하나씩 오른다.
   만렙 30 까지는 쉰 판 남짓 - 오래 붙잡을 목표로 이 정도가 맞다 */
function xpNeed(lv) { return 700 + 180 * (lv - 1) }
function xpFromScore(score) { return Math.round(score / 10) }

function grade() { return GRADES[prog.pilot.grade] || GRADES.normal }
function hasGrade(k) { return k === 'normal' || !!prog.pilotOwned[k] }

function pilotSpent() { return ST_KEYS.reduce((a, k) => a + (prog.pilot.st[k] || 0), 0) }
/** 레벨 1 에서 시작해 오를 때마다 하나씩. 만렙이면 29 점 */
function pilotPts() { return (prog.pilot.lv - 1) - pilotSpent() }
function pilotRank() {
  const lv = prog.pilot.lv
  return lv >= 30 ? '전설' : lv >= 20 ? '베테랑' : lv >= 10 ? '정예' : '신참'
}
/*
 * 전설 파일럿 - 후방 자리를 여는 열쇠.
 *
 * 사는 길과 키우는 길을 둘 다 둔다. 유료로만 열면 후방 자리는 대체 수단이
 * 없어서 "돈 없으면 못 한다"가 처음으로 진짜가 된다. 만렙까지 쉰 판쯤
 * 걸리니, 3,000원은 그 쉰 판을 아끼는 값이다.
 */
const LEGEND_PILOT = { id: 'pilot-legend', price: 3000 }
function boughtLegend() { return prog.owned.includes(LEGEND_PILOT.id) || hasGrade('legend') }
function isLegend() { return prog.pilot.lv >= PILOT_MAX || boughtLegend() }

/*
 * 등급 배수는 화력과 체력에만 얹는다.
 *
 * 연사와 탄폭에까지 곱하면 상급 파일럿 하나로 모든 축이 한꺼번에 올라
 * 스탯 투자가 의미를 잃는다. 두 축은 투자로만 오른다.
 */
function pilotPow()  { return grade().base * (1 + prog.pilot.st.pow * 0.025) }
function pilotRate() { return 1 - prog.pilot.st.rate * 0.015 }
function pilotRng()  { return 1 + prog.pilot.st.rng * 0.02 }
function pilotHp()   { return Math.round(PLAYER_HP * (grade().base - 1)) + prog.pilot.st.hp * 6 }

/** 경험치를 그대로 넣는다. 포션처럼 점수를 거치지 않는 것이 쓴다 */
function addXpRaw(n) {
  const pt = prog.pilot
  if (pt.lv >= PILOT_MAX) return 0
  pt.xp += n
  let up = 0
  while (pt.lv < PILOT_MAX && pt.xp >= xpNeed(pt.lv)) {
    pt.xp -= xpNeed(pt.lv); pt.lv++; up++
  }
  if (pt.lv >= PILOT_MAX) pt.xp = 0
  return up
}

/** 판이 끝나면 부른다. 오른 레벨 수를 돌려준다 */
function addXp(score) {
  const pt = prog.pilot
  if (pt.lv >= PILOT_MAX) return 0
  pt.xp += xpFromScore(score)
  let up = 0
  while (pt.lv < PILOT_MAX && pt.xp >= xpNeed(pt.lv)) {
    pt.xp -= xpNeed(pt.lv); pt.lv++; up++
  }
  if (pt.lv >= PILOT_MAX) pt.xp = 0
  return up
}

function pilotName() { return prog.pilot.name || '무명' }

/* 기본 편대. 넷째 자리는 전설이 되기 전까지 비어 있다 */
if (!prog.squad) prog.squad = ['rapid-common', 'spread-common', 'laser-common', null]
while (prog.squad.length < 4) prog.squad.push(null)

const W = 420, H = 720
const PLAYER_R = 8
const canvas = document.getElementById('c')
const g = canvas.getContext('2d')

function fit() {
  const s = Math.min((innerWidth - 16) / W, (innerHeight - 16) / H)
  const dpr = Math.min(devicePixelRatio || 1, 2)
  canvas.width = W * dpr; canvas.height = H * dpr
  canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px'
  g.setTransform(dpr, 0, 0, dpr, 0, 0)
}
addEventListener('resize', fit); fit()

/*
 * 화력 배분.
 *
 * 윙맨을 50% 로 뒀더니 셋을 합쳐 200% 라 메인을 뭘 태우든 비슷했다.
 * 30% 로 낮추면 합계 160% 가 되고, 메인 자리가 전체의 63% 를 쥔다 —
 * "메인에 뭘 태울까"가 실제 선택이 된다.
 */
/*
 * 처음에는 혼자 난다.
 *
 * 첫 판부터 세 대가 붙어 있으면 편대가 늘어나는 맛이 없다. 레벨 2 에서 한 대,
 * 5 에서 한 대가 붙는다 - 두어 판이면 닿는 거리다.
 */
const SLOT_META = [
  { role: '좌 윙맨', mul: 0.3, lv: 2 },
  { role: '메인', mul: 1.0 },
  { role: '우 윙맨', mul: 0.3, lv: 5 },
  /*
   * 후방은 전설 파일럿만 쓴다.
   *
   * 뒤에 붙지만 총구는 앞을 본다. 아래로 쏘게도 해 봤는데 잡을 게 없다 -
   * 지상 위협은 놓쳐도 그냥 화면 밖으로 지나가고, 돌진기는 아래로 빠지면
   * 위협이 끝난다. 뒤를 지키는 그림보다 화력 한 자리가 실제로 쓸모 있다.
   */
  { role: '후방', mul: 0.2, legend: true },
]

/*
 * 후방 자리의 화력은 어떻게 열었느냐로 갈린다.
 *
 * 산 사람은 20%, 만렙으로 연 사람은 10%. 만렙까지 쉰 판을 도는 값이
 * 절반이라도 남아 있어야 "돈 없으면 못 한다"가 안 된다.
 */
const REAR_BOUGHT = 0.2
const REAR_EARNED = 0.1
/** 그 자리를 쓸 수 있나 */
function slotOpen(i) {
  const m = SLOT_META[i]
  if (m.legend) return isLegend()
  if (m.lv) return prog.pilot.lv >= m.lv
  return true
}
function slotWhy(i) {
  const m = SLOT_META[i]
  if (m.legend) return '레전드 파일럿'
  if (m.lv) return '파일럿 Lv.' + m.lv
  return ''
}
function slotMul(i) {
  const m = SLOT_META[i]
  if (!m.legend) return m.mul
  return boughtLegend() ? REAR_BOUGHT : REAR_EARNED
}
let activeSlot = 1
const NO_MODS = { pierce: 0, split: 0, extra: 0, seek: 0, rate: 0, big: 0, bounce: 0, speed: 0 }
const elSlots = document.getElementById('slots')
const elPlanes = document.getElementById('planes')
const elWallet = document.getElementById('wallet')

/* ================================================================
 * 화면 넷
 *
 * 예전에는 한 화면에 편대·기체·강화·설정이 다 있었다. 기체가 서른이 되고
 * 파일럿까지 붙으니 스크롤이 끝나지 않아서 넷으로 나눴다.
 *
 * 자리를 누르면 기체 화면으로 넘어가고, 기체를 고르면 편대로 돌아온다.
 * 나누기 전과 같은 두 번의 손짓이다 - 화면만 넓어졌다.
 * ================================================================ */
const SCREENS = { squad: 'scSquad', planes: 'scPlanes', stage: 'scStage',
                  rank: 'scRank', pilot: 'scPilot' }
const elTabs = document.getElementById('tabs')
let curScreen = 'squad'
let planeFilter = 'all'

function go(name) {
  curScreen = name
  for (const [k, id] of Object.entries(SCREENS)) document.getElementById(id).hidden = k !== name
  elTabs.hidden = false
  elTabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.go === name))
  render()
}
function hideMenus() {
  for (const id of Object.values(SCREENS)) document.getElementById(id).hidden = true
  elTabs.hidden = true
}
function render() {
  renderWallet()
  if (curScreen === 'squad') renderSquad()
  else if (curScreen === 'planes') renderPlanes()
  else if (curScreen === 'stage') renderStage()
  else if (curScreen === 'rank') renderRank()
  else renderPilot()
}

function renderWallet() {
  elWallet.textContent =
    `부품 ${prog.parts.toLocaleString('ko-KR')}개 · 가챠권 ${prog.ticket}장` +
    ` · 보유 ${PLANES.filter(unlocked).length}/30기`
}

function row(k, v, gold) {
  return `<div class="row"><span class="k">${k}</span><span class="v${gold ? ' gold' : ''}">${v}</span></div>`
}

/* ── 편대 ───────────────────────────────────────────────────────── */
function renderSquad() {
  const legend = isLegend()
  document.getElementById('squadSub').innerHTML =
    `메인이 <b>화력 100%</b>` +
    (slotOpen(0) || slotOpen(2) ? ', 윙맨이 각 30%' : '') +
    (legend ? `, 후방이 ${Math.round(slotMul(3) * 100)}%` : '') + `입니다.<br>` +
    (slotOpen(0) && slotOpen(2)
      ? `자리를 누르면 기체 화면으로 갑니다.`
      : `파일럿 레벨이 오르면 자리가 하나씩 열립니다.`)

  elSlots.innerHTML = ''
  SLOT_META.forEach((m, i) => {
    const usable = slotOpen(i)
    const p = usable ? planeById(prog.squad[i]) : null
    const d = document.createElement('div')
    d.className = 'slot' + (i === activeSlot && usable ? ' on' : '') + (usable ? '' : ' locked-slot')
    // 후방은 한 줄을 통째로 쓴다. 셋은 위, 하나는 아래 - 대형이 그대로 보인다
    if (m.legend) d.style.gridColumn = '1 / -1'
    d.innerHTML = usable
      ? `<div class="role">${m.role}</div>` +
        `<canvas class="pv" width="120" height="120"></canvas>` +
        `<div class="nm">${p ? p.name : '비었음'}</div>` +
        `<div class="wp">${p ? WEAPONS[p.weapon].name : '-'}</div>` +
        `<div class="pw">화력 ${Math.round(slotMul(i) * 100)}%</div>`
      : `<div class="role">${m.role}</div>` +
        `<div class="nm" style="margin-top:12px">아직 잠김</div>` +
        `<div class="wp">${slotWhy(i)}</div>`
    d.onclick = () => { if (usable) { activeSlot = i; go('planes') } else go('pilot') }
    elSlots.appendChild(d)
    if (p) paintPlane(d.querySelector('.pv'), p, i === MAIN_SLOT ? 1 : 0.75)
  })

  const sum = SLOT_META.reduce((a, m, i) =>
    a + (slotOpen(i) && prog.squad[i] ? slotMul(i) : 0), 0)
  const st = prog.pilot.st
  const boost = [
    st.pow ? `화력 +${(st.pow * STATS.pow.per).toFixed(1)}%` : '',
    st.rate ? `연사 +${(st.rate * STATS.rate.per).toFixed(1)}%` : '',
    st.rng ? `탄폭 +${(st.rng * STATS.rng.per).toFixed(0)}%` : '',
    st.hp ? `내구 +${st.hp * STATS.hp.per}` : '',
  ].filter(Boolean).join(' · ')

  document.getElementById('squadSum').innerHTML =
    `<div class="row" id="enRow"></div>` +
    row('출격지', `${curChapter().name} ${curSub()}단계`) +
    row('별', '★'.repeat(prog.star) + '☆'.repeat(STAR_TICKET - prog.star) +
        `  가챠권 ${prog.ticket}장`, prog.ticket > 0) +
    row('편대 화력 합계', Math.round(sum * 100) + '%', true) +
    row('파일럿', `${pilotName()} · ${grade().name} Lv.${prog.pilot.lv}`) +
    row('파일럿 보정', boost || '아직 없음') +
    row('누적 점수', prog.total.toLocaleString('ko-KR') + '점')
  paintEnergy()
  renderMissions()
}

/*
 * 출격권만 따로 다시 그린다.
 *
 * 초 단위로 줄어드는 시계가 있어서 화면 전체를 다시 그리면 기체 그림
 * 네 장을 매초 새로 그리게 된다. 바뀌는 줄만 갈아 끼운다.
 */
function paintEnergy() {
  const el = document.getElementById('enRow')
  if (!el) return
  const n = energy()
  const M = enMax()
  const hearts = n > M
    ? `<span class="on">♥</span> ${n}`
    : Array.from({ length: M },
        (_, i) => `<span class="${i < n ? 'on' : 'off'}">♥</span>`).join('')
  const wait = energyWait()
  el.innerHTML =
    `<span class="k">출격권</span>` +
    `<span class="hearts" style="margin-left:8px">${hearts}</span>` +
    `<span class="v">${n < M ? mmss(wait) : '가득'}</span>`
  const btn = document.getElementById('launch')
  if (btn) btn.textContent = n > 0 ? '출격' : '광고 보고 출격'
}
setInterval(() => { if (curScreen === 'squad' && !elTabs.hidden) paintEnergy() }, 1000)

function renderMissions() {
  const el = document.getElementById('missBody')
  if (!el) return
  const m = missions()
  el.innerHTML = m.list.map((q, i) => {
    const d = missDef(q.id)
    const [kind, n] = d.give
    const done = missDone(q)
    const pct = Math.min(100, (q.p / q.n) * 100)
    return `<div class="mrow${done ? ' done' : ''}">` +
      `<div class="top"><span class="nm">${d.say(q.n)}</span>` +
      `<span class="k" style="color:var(--dim);font-size:11px">` +
      `${Math.min(q.p, q.n).toLocaleString('ko-KR')}/${q.n.toLocaleString('ko-KR')}</span>` +
      `<span class="rw">${REWARD_NAME[kind]} ${n}</span></div>` +
      `<div class="bar2"><i style="width:${pct.toFixed(0)}%"></i></div>` +
      (q.taken
        ? `<button disabled>받았습니다</button>`
        : `<button data-miss="${i}" ${done ? '' : 'disabled'}>` +
          `${done ? '보상 받기' : '진행 중'}</button>`) +
      `</div>`
  }).join('')
  el.querySelectorAll('[data-miss]').forEach((b) => {
    b.onclick = () => {
      const got = takeMission(+b.dataset.miss)
      if (!got) return
      sfx('ready')
      banner && null
      render()
    }
  })
}

/* ── 설정 ───────────────────────────────────────────────────────── */
const elSet = document.getElementById('setting')

function renderSet() {
  const row = (key, nm, de) =>
    `<div class="setrow"><div><div class="nm">${nm}</div><div class="de">${de}</div></div>` +
    `<div class="sw${AU.on[key] ? ' on' : ''}" data-set="${key}"></div></div>`

const FILTERS = [['all', '전체'], ['own', '보유'], ['lock', '잠김'], ['legend', '전설']]

function renderPlanes() {
  document.getElementById('planesSub').innerHTML =
    `지금 <b>${SLOT_META[activeSlot].role}</b> 자리를 채웁니다. 고르면 편대로 돌아갑니다.`

  const ef = document.getElementById('planeFilters')
  ef.innerHTML = ''
  const gb = document.createElement('button')
  gb.textContent = `기체 뽑기 · 가챠권 ${prog.ticket}장`
  gb.style.cssText = 'background:#24406b;color:#cfe6ff'
  gb.onclick = () => openGacha('plane')
  ef.appendChild(gb)
  for (const [k, label] of FILTERS) {
    const b = document.createElement('button')
    b.textContent = label
    b.className = planeFilter === k ? 'on' : ''
    b.onclick = () => { planeFilter = k; renderPlanes() }
    ef.appendChild(b)
  }

  elPlanes.innerHTML = ''
  const list = PLANES.filter((p) =>
    planeFilter === 'all' ? true
    : planeFilter === 'own' ? unlocked(p)
    : planeFilter === 'lock' ? !unlocked(p)
    : p.tier === 'legend')

  if (!list.length) {
    elPlanes.innerHTML = '<div class="empty">여기 해당하는 기체가 없습니다.</div>'
    return
  }

  for (const p of list) {
    const ok = unlocked(p)
    const picked = prog.squad[activeSlot] === p.id
    const c = document.createElement('div')
    c.className = 'card' + (ok ? '' : ' locked') + (picked ? ' picked' : '')
    const lab = unlockLabel(p)
    const lv = upgOf(p.id)
    const cost = upgCost(p, lv)
    c.innerHTML =
      `<span class="tag t-${p.tier}">${TIERS[p.tier]}</span>` +
      `<canvas class="pv" width="220" height="150"></canvas>` +
      `<div class="nm">${p.name}</div>` +
      `<div class="wp">${WEAPONS[p.weapon].name}</div>` +
      `<div class="de">${WEAPONS[p.weapon].desc}</div>` +
      (lab ? `<div class="lock">${p.unlock.kind === 'paid' ? '🔒 ' : ''}${lab}</div>` : '') +
      (ok
        ? (shardOf(p.id) ? `<div class="shard">조각 ${shardOf(p.id)}개</div>` : '')
        : `<div class="shard">조각 ${shardOf(p.id)} / ${shardNeed(p)}</div>`) +
      (ok
        ? `<div class="up"><span class="lvl">강화 ${lv}/${UPG_MAX}` +
          (lv ? ` · 화력 +${Math.round((upgPower(p.id) - 1) * 100)}%` : '') + `</span>` +
          (lv >= UPG_MAX
            ? `<button disabled>최대</button>`
            : `<button ${prog.parts < cost || shardOf(p.id) < shardUpg(p, lv) ? 'disabled' : ''}>` +
              `부품 ${cost} · 조각 ${shardUpg(p, lv)}</button>`) +
          `</div>`
        : '')

    const btn = c.querySelector('.up button')
    if (btn && !btn.disabled) {
      btn.onclick = (ev) => {
        ev.stopPropagation()
        if (prog.parts < cost || shardOf(p.id) < shardUpg(p, lv)) return
        prog.parts -= cost
        prog.shardP[p.id] = shardOf(p.id) - shardUpg(p, lv)
        prog.upg[p.id] = lv + 1
        save(); renderPlanes(); renderWallet()
      }
    }

    c.onclick = () => {
      if (!ok) {
        alert(p.unlock.kind === 'paid'
          ? `유료 기체입니다. 결제는 아직 붙지 않았습니다.\n(${lab})`
          : `아직 잠겨 있습니다.\n${lab} 필요 · 지금 ${prog.total.toLocaleString('ko-KR')}점`)
        return
      }
      // 같은 기체를 두 자리에 넣지 않는다 - 자리를 맞바꾼다
      const dup = prog.squad.indexOf(p.id)
      if (dup >= 0 && dup !== activeSlot) prog.squad[dup] = prog.squad[activeSlot]
      prog.squad[activeSlot] = p.id
      save(); go('squad')
    }
    elPlanes.appendChild(c)
    paintPlane(c.querySelector('.pv'), p, 1.1)
  }
}

/*
 * 하나 여는 데 평균 몇 번이 드는지.
 *
 * 확률만 적어 두면 "전설 3%" 가 서른 번에 한 대처럼 읽힌다. 실제로는
 * 조각을 여든 개 모아야 하니 육백 번이다. 그 숫자를 같이 적는다.
 */
function pullsFor(kind, tier) {
  const g = GACHA[kind]
  const w = (g.rates.find(([t]) => t === tier) || [0, 0])[1] / 100
  const [lo, hi] = g.amount[tier]
  const per = w * ((lo + hi) / 2)
  const need = kind === 'plane' ? SHARD_NEED[tier] : GRADE_NEED[tier]
  if (!per || !need) return 0
  return Math.round(need / per)
}

function paintRates() {
  const g = GACHA[gKind]

    const nm = GRADES[t] ? GRADES[t].name : TIERS[t]
    const [lo, hi] = g.amount[t]
    const need = pullsFor(gKind, t)
    return `<div class="rate"><span>${nm}</span>` +
      `<span class="v">${w}% · 조각 ${lo}~${hi}` +
      (need ? ` · 하나 열기까지 평균 ${need.toLocaleString('ko-KR')}번` : '') +
      `</span></div>`
  }).join('')
  const pity = PITY[gKind]

    `<div class="lab">등급별 확률</div>${rows}` +

    `<div class="rate"><span>완성품이 이미 가진 것이면</span><span class="v">조각 ${JACK_SHARD}개</span></div>` +

    `<div class="empty">${pity.at}번마다 ` +
    `${GRADES[pity.tier] ? GRADES[pity.tier].name : TIERS[pity.tier]} 이상이 한 번 확정됩니다.<br>` +
    `가챠권은 별 ${STAR_TICKET}개마다 한 장입니다. 별은 한 판에 ${STAR_FAIL}개, ` +
    `깨면 ${STAR_CLEAR}개가 찹니다. 돈으로는 살 수 없습니다.</div>`
}

/** 카드에 그 판의 색을 그대로 보여 준다. 이름만으로는 어떤 곳인지 모른다 */
function paintStage(cv, sg) {
  if (!cv) return
  const TH = THEMES[sg.theme]
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  const w = cv.clientWidth || 260, h = cv.clientHeight || 92
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr)
  const c = cv.getContext('2d')
  c.setTransform(dpr, 0, 0, dpr, 0, 0)
  const gr = c.createLinearGradient(0, 0, 0, h)
  gr.addColorStop(0, TH.sky[0]); gr.addColorStop(.45, TH.sky[1]); gr.addColorStop(1, TH.sky[2])
  c.fillStyle = gr; c.fillRect(0, 0, w, h)
  c.lineWidth = 1.2
  for (let i = 0; i < 5; i++) {
    c.strokeStyle = 'rgba(' + TH.line + ',.10)'
    c.beginPath()
    for (let x = 0; x <= w; x += 14) c.lineTo(x, 14 + i * 17 + Math.sin(x * .05 + i) * 2.5)
    c.stroke()
  }
  const isles = [[w * .22, h * .62, 26, 13], [w * .68, h * .34, 20, 10], [w * .84, h * .76, 15, 8]]
  for (const [x, y, rx, ry] of isles) {
    c.fillStyle = TH.halo
    c.beginPath(); c.ellipse(x, y, rx + 5, ry + 4, 0, 0, 6.284); c.fill()
    c.fillStyle = TH.body
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.284); c.fill()
    c.fillStyle = TH.cap
    c.beginPath(); c.ellipse(x - rx * .08, y - ry * .1, rx * .72, ry * .68, 0, 0, 6.284); c.fill()
  }
}

  const tabs = CHAPTERS.map((c, i) =>

    `${c.id}. ${c.name} ${chapterStars(i)}/${SUBS * 3}★</button>`).join('')

    const stars = [0, 1, 2].map((i) =>

    `<div class="nm">${ch.id}. ${ch.name}</div><div class="de">${ch.sub}</div>` +

/* ── 파일럿 ─────────────────────────────────────────────────────── */
/*
 * 마크는 그림 파일 없이 캔버스로 그린다. 파일을 여섯 개 더 넣으면 본문이
 * 그만큼 무거워지는데, 이 정도 도형은 코드가 더 싸다.
 */
const MARK_COLOR = ['#4fd1ff', '#ffc44d', '#ff5470', '#4ade80', '#c9a8ff', '#7dffd4']
function drawMark(cv, idx) {
  if (!cv) return
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  const w = cv.clientWidth || 40, h = cv.clientHeight || 40
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr)
  const c = cv.getContext('2d')
  c.setTransform(dpr, 0, 0, dpr, 0, 0)
  c.clearRect(0, 0, w, h)
  c.translate(w / 2, h / 2)
  const R = Math.min(w, h) * 0.36
  c.fillStyle = c.strokeStyle = MARK_COLOR[idx % 6]
  c.lineWidth = 2.2; c.lineJoin = 'round'
  c.beginPath()
  switch (idx % 6) {
    case 0:                                  // 별
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI / 2 + (k * Math.PI) / 5
        const r = k % 2 ? R * 0.45 : R
        k ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r)
      }
      c.closePath(); c.fill(); break
    case 1:                                  // 번개
      c.moveTo(R * .25, -R); c.lineTo(-R * .45, R * .12); c.lineTo(-R * .02, R * .12)
      c.lineTo(-R * .25, R); c.lineTo(R * .5, -R * .18); c.lineTo(R * .06, -R * .18)
      c.closePath(); c.fill(); break
    case 2:                                  // 방패
      c.moveTo(0, -R); c.lineTo(R * .8, -R * .55); c.lineTo(R * .8, R * .2)
      c.quadraticCurveTo(R * .8, R * .85, 0, R)
      c.quadraticCurveTo(-R * .8, R * .85, -R * .8, R * .2)
      c.lineTo(-R * .8, -R * .55); c.closePath(); c.fill(); break
    case 3:                                  // 화살
      c.moveTo(0, -R); c.lineTo(R * .7, R * .35); c.lineTo(0, R * .05)
      c.lineTo(-R * .7, R * .35); c.closePath(); c.fill(); break
    case 4:                                  // 겹원
      c.arc(0, 0, R, 0, 6.284); c.stroke()
      c.beginPath(); c.arc(0, 0, R * .5, 0, 6.284); c.fill(); break
    case 5:                                  // 십자
      c.moveTo(-R * .26, -R); c.lineTo(R * .26, -R); c.lineTo(R * .26, -R * .26)
      c.lineTo(R, -R * .26); c.lineTo(R, R * .26); c.lineTo(R * .26, R * .26)
      c.lineTo(R * .26, R); c.lineTo(-R * .26, R); c.lineTo(-R * .26, R * .26)
      c.lineTo(-R, R * .26); c.lineTo(-R, -R * .26); c.lineTo(-R * .26, -R * .26)
      c.closePath(); c.fill(); break
  }
}

      `<span class="ef">후방 편대 ${Math.round(REAR_BOUGHT * 100)}%</span></div>` +
      `<div class="de">네 번째 자리가 열립니다.` +

    `<div class="lab">마크</div>` +
    `<div class="marks" id="marks">` +
    MARK_COLOR.map((_, i) =>
      `<div class="mark${i === pt.mark ? ' on' : ''}" data-mark="${i}">` +
      `<canvas width="80" height="80" style="width:100%;height:38px"></canvas></div>`).join('') +

  document.querySelectorAll('.gcard[data-g]').forEach((el) => {

      save(); sfx('pick'); renderPilot()
    }

/**
 * 카드 안에 기체를 그린다.
 *
 * 게임에서 쓰는 그림을 그대로 부른다. 카드용으로 따로 그리면 격납고에서 고른
 * 모습과 실제로 나는 모습이 어긋난다. 강화 단계를 기체 레벨로 넘겨서, 강화한
 * 기체는 카드에서도 날개가 넓어진다.
 */
function paintPlane(cv, p, zoom) {
  if (!cv) return
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  const w = cv.clientWidth || 130, h = cv.clientHeight || 62
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr)
  const c = cv.getContext('2d')
  c.setTransform(dpr, 0, 0, dpr, 0, 0)
  c.clearRect(0, 0, w, h)
  const lv = 1 + Math.min(4, upgOf(p.id))
  /* 기수 침과 엔진 불꽃까지 다 들어가야 한다. 세로 66 이 기체 한 대의 키다 */
  const scale = Math.min(w / 54, h / 66) * (zoom || 1)
  drawShipOn(c, w / 2, h * 0.5, { plane: p, lv, mods: NO_MODS, scale, flame: false, shadow: false })
}

/* ================================================================
 * 게임 상태
 * ================================================================ */
let state = null, keys = {}

function newState() {
  // 자리 수를 그대로 둔다. 넷째만 비워 놓으면 메인 자리 번호가 안 흔들린다
  const squad = SLOT_META.map((m, i) => {
    const usable = slotOpen(i)
    const p = usable ? planeById(prog.squad[i]) : null
    return { plane: p, mul: slotMul(i), cd: Math.random() * 0.2, orbA: (i * Math.PI * 2) / 3 }
  })
  return {
    t: 0, running: false,
    player: { x: W / 2, y: H - 120, lv: 1, inv: 0,
              hp: PLAYER_HP + pilotHp(), maxHp: PLAYER_HP + pilotHp() },
    ult: 0, ultT: 0, ultKind: null, escorts: [], shards: [], sweeps: [],
    adUsed: { revive: 0, charge: 0 },
    squad, lives: LIVES, score: 0, kills: 0, ultUsed: 0, hitCount: 0, clearWait: 0,
    bullets: [], ebullets: [], enemies: [], items: [], parts: [], stars: [],
    grounds: [], slabs: [], beams: [], arcs: [],
    /* 이 판에서만 사는 개조. 저장하지 않는다. */
    mods: Object.fromEntries(MOD_KEYS.map((k) => [k, 0])),
    boss: null, waveIdx: 0, banner: null, bannerT: 0, cleared: false,
    stage: curStage(), theme: THEMES[curStage().theme],
  }
}
/* 땅. 슬래브가 흘러가야 지상 유닛이 떠 있지 않고 붙어 보인다. */
/**
 * 바다에 뜬 섬을 뿌린다.
 *
 * 사각형이던 걸 타원으로 바꿨다. 바다 위에 직사각형이 떠 있으면 그게 무엇인지
 * 알 수 없어서 배경이 배경으로 안 읽힌다. seed 는 섬마다 다른 울퉁불퉁함을
 * 주려고 넣었다 - 매 프레임 난수를 쓰면 섬이 부들부들 떤다.
 */
function seedGround(s) {
  for (let i = 0; i < 7; i++) {
    s.slabs.push({
      x: Math.random() * W, y: Math.random() * H,
      w: 34 + Math.random() * 54, h: 20 + Math.random() * 32,
      seed: Math.random() * 6.28, kind: Math.random() < .3 ? 'reef' : 'isle',
    })
  }
}

/** 윤슬 - 물결에 햇빛이 튀는 점들. 예전 별을 그대로 물 위로 옮겼다 */
function seedStars(s) {
  for (let i = 0; i < 70; i++) {
    s.stars.push({ x: Math.random() * W, y: Math.random() * H,
                   z: Math.random() * .7 + .3, ph: Math.random() * 6.28 })
  }
}

/* ================================================================
 * 입력
 * ================================================================ */
let drag = null
function toLocal(e) {
  const r = canvas.getBoundingClientRect()
  const p = e.touches ? e.touches[0] : e
  return { x: (p.clientX - r.left) / r.width * W, y: (p.clientY - r.top) / r.height * H }
}
canvas.addEventListener('pointerdown', (e) => {
  const p = toLocal(e)
  // 버튼을 눌렀으면 기체를 끌지 않는다
  if (state && state.running && (p.x - ULT_BTN.x) ** 2 + (p.y - ULT_BTN.y) ** 2 < (ULT_BTN.r + 8) ** 2) {
    if (state.ult >= ULT_MAX) fireUlt()
    else chargeByAd()
    e.preventDefault()
    return
  }
  drag = p
  e.preventDefault()
})
addEventListener('pointermove', (e) => {
  if (!drag || !state || !state.running) return
  const p = toLocal(e), pl = state.player
  pl.x += p.x - drag.x; pl.y += p.y - drag.y; drag = p; e.preventDefault()
}, { passive: false })
addEventListener('pointerup', () => { drag = null })
addEventListener('keydown', (e) => { keys[e.key] = true })
addEventListener('keyup', (e) => { keys[e.key] = false })

/* ================================================================
 * 편대 자리
 *
 * 윙맨은 메인을 곧바로 따라가지 않고 조금 늦게 붙는다. 셋이 한 몸처럼
 * 움직이면 편대로 안 보인다.
 * ================================================================ */
/*
 * 편대 자리.
 *
 * 가운데(1번)가 메인이고 오프셋이 0 이다. 즉 state.player 가 곧 메인의
 * 자리이고, 피격 판정도 그 한 점만 쓴다 — **윙맨은 맞지 않는다.**
 * 세 대가 다 맞으면 화면 폭의 절반이 판정이 돼서 피할 수가 없다.
 *
 * 이 규칙은 오프셋이 0 이라는 데 기대고 있다. 가운데 자리를 옮기려면
 * collide() 의 판정도 같이 손봐야 한다.
 */
const SLOT_OFFSET = [{ x: -38, y: 20 }, { x: 0, y: 0 }, { x: 38, y: 20 }, { x: 0, y: 46 }]
const MAIN_SLOT = 1

/*
 * 필살기 버튼 자리.
 *
 * 오른쪽 아래에 둔다. 엄지로 기체를 끌면서 반대 손 없이 누를 수 있어야 한다.
 * 기체가 다니는 가운데 아래를 피해 구석에 붙였다.
 */
const ULT_BTN = { x: 0, y: 0, r: 34 }
function slotPos(i) {
  const pl = state.player, o = SLOT_OFFSET[i]
  return { x: pl.x + o.x, y: pl.y + o.y }
}

/* ================================================================
 * 사격
 * ================================================================ */
const LV = [null,
  { mult: 1.00, extra: 0 },
  { mult: 1.15, extra: 0 },
  { mult: 1.30, extra: 1 },
  { mult: 1.45, extra: 1 },
  { mult: 1.65, extra: 2 },
]

function baseRate(w) {
  return { rapid: .10, spread: .30, laser: .05, homing: .38, pierce: .26,
           wave: .22, orb: 1.2, mine: .70, beam: .85, boomer: .55, chain: .34 }[w]
}

function nearestEnemy(x, y) {
  let best = null, bd = 1e9
  const list = state.enemies.concat(state.boss ? [state.boss] : [])
  for (const e of list) {
    const d = (e.x - x) ** 2 + (e.y - y) ** 2
    if (d < bd) { bd = d; best = e }
  }
  return best
}

function shoot(u, i, dt) {
  const p = u.plane
  if (!p) return
  u.cd -= dt
  const lv = LV[state.player.lv]
  let rate = baseRate(p.weapon) * p.rate * upgRate(p.id) * pilotRate()
    / (0.85 + lv.mult * 0.15) * (1 - state.mods.rate * 0.18)
  /*
   * 난사 중에는 간격이 절반.
   *
   * 3분의 1 이었을 때 재 보니 6초에 880 이 들어갔다 - 보스 체력 전부다.
   * 다른 궁은 같은 조건에서 0~514 였다. 하나만 튀면 나머지 아홉이 장식이 된다.
   */
  if (state.ultKind === 'rapid' && state.ultT > 0) rate /= 2
  if (u.cd > 0) return
  u.cd = rate
  sfx('shot', p.tier === 'legend' ? 2 : p.tier === 'rare' ? 1 : 0)

  const pos = slotPos(i)
  const dmg = p.power * upgPower(p.id) * u.mul * lv.mult * pilotPow()
  const tier = p.tier === 'legend' ? 2 : p.tier === 'rare' ? 1 : 0
  const B = state.bullets
  const M = state.mods

  /*
   * 개조는 여기 한 곳에서만 얹는다. 무기마다 따로 처리하면 새 무기를
   * 넣을 때마다 여덟 가지를 다시 붙여야 하고, 한 군데 빠뜨리면
   * "이 기체만 개조가 안 먹는다"가 된다.
   */
  const add = (o) => {
    const b = { x: pos.x, y: pos.y - 10, r: 3, dmg, pierce: 0, life: 3, age: 0, kind: 'normal', ...o }
    b.pierce += M.pierce
    b.dmg *= 1 + M.big * 0.25
    b.r *= (1 + M.big * 0.18) * pilotRng()
    if (M.speed) { b.vx *= 1 + M.speed * 0.25; b.vy *= 1 + M.speed * 0.25 }
    if (M.bounce) b.bounce = M.bounce
    if (M.split) b.split = M.split
    // 유도는 직진탄에만 붙인다. 이미 궤도를 가진 탄에 얹으면 성질이 뭉개진다
    if (M.seek && (b.kind === 'normal' || b.kind === 'pierce')) {
      b.kind = 'homing'; b.turn = 1.1 * M.seek
    }
    B.push(b)
  }

  switch (p.weapon) {
    case 'rapid': {
      const n = 1 + tier + lv.extra + state.mods.extra
      for (let k = 0; k < n; k++) add({ x: pos.x + (k - (n - 1) / 2) * 7, vx: 0, vy: -620 })
      break
    }
    case 'spread': {
      const n = 3 + tier * 2 + lv.extra + state.mods.extra
      for (let k = 0; k < n; k++) {
        const a = -Math.PI / 2 + (k - (n - 1) / 2) * 0.17
        add({ vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, r: 2.6 })
      }
      break
    }
    case 'laser':
      // 굵은 빔 하나 대신 얇은 관통탄을 아주 빠르게 쏜다. 보기엔 이어진
      // 선이고, 충돌 판정은 기존 코드를 그대로 쓴다.
      add({ vx: 0, vy: -1100, r: 1.8, pierce: 2 + tier, kind: 'laser', dmg: dmg * 0.42 })
      break
    case 'homing': {
      const n = 1 + tier + state.mods.extra
      for (let k = 0; k < n; k++)
        add({ vx: (k - (n - 1) / 2) * 90, vy: -300, kind: 'homing',
              turn: PLAYER_HOMING_TURN + tier, r: 4 })
      break
    }
    case 'pierce':
      add({ vx: 0, vy: -700, r: 4.5, pierce: 2 + tier * 2, kind: 'pierce', dmg: dmg * 1.3 })
      break
    case 'wave': {
      const n = 1 + tier
      for (let k = 0; k < n; k++)
        add({ vx: 0, vy: -420, kind: 'wave', amp: 70 + tier * 25, ph: k * Math.PI, x0: pos.x, r: 4 })
      break
    }
    case 'orb': {
      const n = 2 + tier
      for (let k = 0; k < n; k++)
        B.push({ kind: 'orb', owner: i, a: (k / n) * Math.PI * 2, rad: 40 + tier * 8,
                 x: pos.x, y: pos.y, r: 6, dmg: dmg * 0.5, pierce: 99, life: 2.4, age: 0 })
      break
    }
    case 'mine':
      add({ vx: 0, vy: -180, kind: 'mine', fuse: 1.1, r: 6, dmg: dmg * 1.6 })
      break
    case 'beam':
      add({ vx: 0, vy: -300, kind: 'beam', r: 11 + tier * 3, pierce: 4 + tier * 2, dmg: dmg * 2.2 })
      break
    case 'chain':
      add({ vx: 0, vy: -560, r: 4.5, kind: 'chain', dmg: dmg * 0.9, jumps: 3 })
      break
    case 'boomer': {
      const n = 1 + tier

    }

}

/* ================================================================
 * 챕터와 단계
 *
 * 챕터 하나가 지도 한 장이고, 그 안에 스무 단계가 있다. 5·10·15 단계 끝에
 * 중간보스가, 20 단계 끝에 보스가 나온다.
 *
 * 예순 개짜리 웨이브 표를 손으로 쓸 수는 없다. 챕터마다 '무엇이 나올 수
 * 있는가' 만 적어 두고, 단계 번호를 시드로 매번 같은 판을 만든다 - 스도쿠
 * 오늘의 퍼즐과 같은 방식이다. 같은 단계는 언제 들어가도 같은 판이다.
 * ================================================================ */
const SUBS = 20
const MID_AT = [5, 10, 15]

/** 시드 하나로 같은 수열을 낸다. 서버 없이 판을 고정하는 데 쓴다 */
function seeded(n) {
  let x = (n * 1103515245 + 12345) >>> 0
  return () => {
    x = (x * 1103515245 + 12345) >>> 0
    return (x >>> 8) / 16777216
  }
}

/*
 * 챕터마다 나올 수 있는 것들.
 *
 * w 는 뽑힐 무게다. 사막은 지상이 촘촘하고, 극야는 돌진과 맷집이 많다 -
 * 무게만 바꿔서 판의 성격을 만든다.
 */
