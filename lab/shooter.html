const TERRAIN_SPEED = 62

function mkGround(kind, x, y) {
  const b = {
    turret: { hp: 9,  r: 16, cd: 1.8, score: 150 },
    flak:   { hp: 11, r: 17, cd: 3.0, score: 210 },
    laser:  { hp: 16, r: 18, cd: 3.4, score: 340 },
    radar:  { hp: 13, r: 18, cd: 0,   score: 300 },
  }[kind]
  return { kind, x, y, t: Math.random() * 2, phase: 'idle', ph: 0, lock: 0, aimX: 0, flash: 0, ...b }
}
/*
 * 화면 위에서 생겨 아래로 흐른다. 비행기가 앞으로 나아가니 땅은
 * 다가와서 지나가는 게 맞다.
 */
function ground(kind, x) { state.grounds.push(mkGround(kind, x, -40)) }

/** 레이더 감지 반경. 그려서 보여주므로 숨기지 않는다. */
const RADAR_R = 118

/**
 * 적 유도탄의 선회 속도.
 *
 * 사용자 유도탄(일반형)이 5 다. 그 20% 로 둔다. 같은 성능이면 절대 못
 * 피하고, 그러면 유도탄이 아니라 사형선고가 된다. 이 정도면 옆으로 크게
 * 꺾어서 흘려보낼 수 있고, 가만히 있으면 맞는다.
 */
const PLAYER_HOMING_TURN = 5
const ENEMY_HOMING_TURN = PLAYER_HOMING_TURN * 0.2

/*
 * 보스.
 *
 * 320 은 너무 물렀다. 편대 셋에 개조까지 붙으면 순식간에 녹아서
 * 「보스가 나왔다」가 아니라 「덩치 큰 적이 지나갔다」가 됐다.
 *
 * 체력만 올리면 지루해지므로 구조를 준다 —
 *   · 양옆에 부술 수 있는 포탑 둘. 살아 있으면 보스가 더 자주 쏜다
 *   · 체력 구간마다 패턴이 바뀌고, 중반부터 부하를 부른다
 *   · 마지막 25% 에서는 돌진한다. 예고선을 먼저 보여주고 내려온다
 */
/*
 * 보스.
 *
 * 예전엔 덩어리 하나에 체력 한 줄이었다. 그래서 난사 궁 한 번이면 끝났고,
 * 어디를 쏘든 똑같아서 조준할 이유가 없었다.
 *
 * 이제 부위가 넷이다. 포탑 둘과 엔진을 먼저 부숴야 코어가 열린다. 코어가
 * 닫혀 있는 동안에는 아무리 때려도 본체 체력이 안 깎인다 - 맞는 자리가
 * 어디냐가 실제로 중요해진다.
 *
 * 코어가 열리면 2 페이즈다. 보스는 더 이상 자리를 지키지 않고 돌진하고,
 * 즉사 광선을 쏜다. 부위를 다 부순 대가로 사나워지는 셈이다.
 */
function spawnBoss(mid) {
  /* 중간보스는 작고 부위가 둘뿐이다. 엔진이 없어 탄이 처음부터 촘촘하다 */
  const base = Math.round(state.stage.bossHp * (mid ? 0.45 : 1))
  const mk = (key, name, dx, dy, r, mul, cd) => ({
    key, name, dx, dy, r, cd, flash: 0, alive: true,
    hp: Math.round(base * mul), maxHp: Math.round(base * mul),
  })
  state.boss = {
    mid: !!mid,
    x: W / 2, y: -120, r: mid ? 34 : 46, t: 0, cd: 1.2, entering: true,
    phase: 1, flash: 0, summonCd: mid ? 9 : 7, dashPh: 0, dashX: 0,
    lancePh: 0, lanceX: 0, lanceCd: 4,
    parts: mid
      ? [
          mk('lt', '좌 포탑', -30, 6, 15, 0.34, 1.0),
          mk('rt', '우 포탑', 30, 6, 15, 0.34, 1.6),
        ]
      : [
          mk('lt', '좌 포탑', -40, 8, 17, 0.26, 1.0),
          mk('rt', '우 포탑', 40, 8, 17, 0.26, 1.7),
          mk('en', '엔진', 0, 34, 20, 0.40, 2.4),
        ],
    core: { hp: base, maxHp: base, open: false },
  }
  banner(mid ? '중간보스' : '보스')
  sfx('alarm')
  music('boss')
}

/** 부위를 다 부쉈다. 코어가 열리고 보스가 사나워진다 */
function openCore(bs) {
  bs.core.open = true
  bs.phase = 2
  bs.lanceCd = 2.5
  banner('코어 노출')
  sfx('alarm')
  boom(bs.x, bs.y, 30, '#ffd27a')
}

function killBoss(bs) {
  const s = state
  boom(bs.x, bs.y, bs.mid ? 46 : 70, '#ffd27a')
  s.score += bs.mid ? 1800 : 4000
  s.boss = null
  s.cleared = true
  setTimeout(() => end(true), 900)
}

/*
 * 어디를 맞았는가.
 *
 * 살아 있는 부위에 닿으면 그 부위가 깎인다. 부위를 다 부순 뒤에만 코어가
 * 깎인다. 그 전에 본체를 때리면 튕긴다 - 'block' 을 돌려주고 부르는 쪽이
 * 불꽃만 튀긴다.
 */
function bossHit(bs, x, y, dmg) {
  const s = state
  for (const p of bs.parts) {
    if (!p.alive) continue
    const px = bs.x + p.dx, py = bs.y + p.dy
    if ((px - x) ** 2 + (py - y) ** 2 < (p.r + 7) ** 2) {
      p.hp -= dmg
      p.flash = .1
      if (p.hp <= 0) {
        p.alive = false
        boom(px, py, 26, '#ffd27a')
        s.score += 400
        if (bs.parts.every((q) => !q.alive)) openCore(bs)
      }
      return 'part'
    }
  }
  if (bs.core.open) {
    bs.core.hp -= dmg
    bs.flash = .08
    if (bs.core.hp <= 0) killBoss(bs)
    return 'core'
  }
  return 'block'
}

/** 범위 공격. 자리를 못 고르는 대신 살아 있는 부위를 한꺼번에 친다 */
function bossArea(bs, dmg) {
  let any = false
  for (const p of bs.parts) {
    if (!p.alive) continue
    any = true
    p.hp -= dmg
    p.flash = .08
    if (p.hp <= 0) {
      p.alive = false
      boom(bs.x + p.dx, bs.y + p.dy, 26, '#ffd27a')
      state.score += 400
      if (bs.parts.every((q) => !q.alive)) openCore(bs)
    }
  }
  if (!any && bs.core.open) {
    bs.core.hp -= dmg
    bs.flash = .06
    if (bs.core.hp <= 0) killBoss(bs)
  }
}

function banner(t) { state.banner = t; state.bannerT = 1.6 }

/**
 * 무엇을 떨굴지 고른다.
 *
 * 화력(P)만 떨어지면 판마다 똑같아지고, 개조만 떨어지면 화력이 안 올라
 * 후반이 버겁다. 섞되 화력을 조금 더 자주 준다.
 */
/* 아주 가끔 가챠권이 떨어진다. 한 판에 셋 중 하나꼴 */
const TICKET_DROP = 0.004

function dropItem(x, y, richer) {
  const s = state
  if (Math.random() < TICKET_DROP) {
    s.items.push({ x, y, t: 0, r: 12, tk: true })
    return
  }
  const wantMod = Math.random() < (richer ? .55 : .35)
  const key = wantMod ? rollMod(s.mods) : null
  s.items.push({ x, y, t: 0, r: 11, mod: key })   // mod 가 null 이면 화력 아이템
}

/*
 * 맞은 적에서 번개가 옆으로 튄다.
 *
 * 가까운 적을 차례로 물되 한 번 문 적은 다시 물지 않는다. 튈 때마다 힘이
 * 줄어서 무한히 퍼지지 않는다 - 안 줄이면 적이 몰린 판에서 한 방에 화면이
 * 비어 버린다.
 */
const CHAIN = { range: 135, falloff: 0.62 }

/*
 * 적이 얼마나 자주 쏘는가.
 *
 * 두 가지를 본다.
 *
 * 하나는 시간. 판이 시작하자마자 제 속도로 쏘면 자리를 잡기도 전에 탄이
 * 깔린다. 열네 초에 걸쳐 서서히 제 속도가 된다.
 *
 * 하나는 편대 크기. 처음 온 사람은 메인 한 대(화력 100%)로 나는데 적
 * 배치는 세 대(160%) 기준으로 짜여 있었다. 화력이 37% 모자란 만큼 탄이
 * 안 지워져서 첫 판이 유독 빽빽했다. 자리가 덜 열렸으면 그만큼 덜 쏜다.
 */
function fireScale() {
  const s = state
  const warm = Math.min(1, s.t / 14)
  const slots = s.squad.filter((u) => u.plane).length
  const small = slots <= 1 ? 1.55 : slots === 2 ? 1.22 : 1
  return (1.9 - 0.9 * warm) * small
}

function chainFrom(from, b) {
  const s = state
  let cur = from
  let dmg = b.dmg * CHAIN.falloff
  const bit = [from]
  const jumps = b.jumps || 3
  for (let j = 0; j < jumps; j++) {
    let best = null, bd = CHAIN.range * CHAIN.range
    for (const e of s.enemies) {
      if (e.dead || bit.includes(e)) continue
      const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2
      if (d < bd) { bd = d; best = e }
    }
    if (!best) break
    best.hp -= dmg
    best.flash = .12
    s.arcs.push({ x1: cur.x, y1: cur.y, x2: best.x, y2: best.y, age: 0, life: .22,
                  seed: Math.random() * 100 })
    if (best.hp <= 0 && !best.dead) {
      best.dead = true
      s.score += best.score
      s.kills++
      boom(best.x, best.y, 12, '#bff0ff')
      s.ult = Math.min(ULT_MAX, s.ult + 8)
    }
    bit.push(best)
    cur = best
    dmg *= CHAIN.falloff
  }
}

function boom(x, y, n, color) {
  // 알갱이 몇 개짜리는 총알이 박히는 불똥이지 폭발이 아니다. 소리까지 내면
  // 맞는 소리와 겹쳐서 탁해진다
  if (n >= 6) sfx('boom', n / 40)
  /*
   * 알갱이만으로는 '터졌다'가 안 읽힌다. 여섯 장짜리 불꽃을 같이 얹는다.
   * 알갱이는 남겨 둔다 - 사방으로 튀는 움직임이 있어야 무게가 생긴다.
   */
  if (n >= 6) {
    state.blasts.push({ x, y, r: 22 + n * 1.5, age: 0, life: .34 })
  }
  for (let i = 0; i < Math.round(n * .55); i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 180
    state.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                       life: .3 + Math.random() * .5, age: 0, color })
  }
}

/**
 * 강화는 화력만이 아니라 맷집도 올린다.
 *
 * 체력제로 바꾸고 나니 강화가 공격 일변도라, 맞으면서 밀고 들어갈 이유가
 * 없었다. 최대 체력을 같이 올리고 오른 만큼 채워 주면 "한 단계 올리고 한 번
 * 더 부딪쳐 본다"가 성립한다.
 */
/* ================================================================
 * 보상형 광고
 *
 * 강제로 붙이지 않는다. 하던 판을 이어가고 싶은 사람만 누른다 — 이 게임의
 * 목적이 어렵게 해서 결제를 부르는 게 아니라 오래 하게 만드는 것이라서다.
 *
 * 지금은 실제 광고가 없어 3초짜리 대기 화면으로 흉내만 낸다. 토스에 올릴
 * 때는 showAd 안쪽만 SDK 호출로 갈아 끼우면 된다. 실패하면 보상을 주지
 * 않고 조용히 돌아온다 — 광고를 못 봤는데 보상이 나가면 그게 사고다.
 *
 * 횟수 제한은 판마다 초기화된다. 예전에 스도쿠에서 부활 횟수를 세는 걸
 * 빠뜨려 무한 부활이 됐던 적이 있어서, 세는 자리를 한 곳에 모았다.
 * ================================================================ */
const AD_LIMIT = { revive: 1, charge: 2 }   // 한 판에 몇 번까지

const scAd = document.getElementById('adv')

function showAd(title, onDone) {
  const btn = document.getElementById('advSkip')
  document.getElementById('advTitle').textContent = title
  scAd.hidden = false
  let left = 3
  btn.disabled = true
  btn.textContent = left
  const iv = setInterval(() => {
    left--
    if (left > 0) { btn.textContent = left; return }
    clearInterval(iv)
    btn.disabled = false
    btn.textContent = '보상 받기'
  }, 1000)
  btn.onclick = () => {
    if (btn.disabled) return
    clearInterval(iv)
    scAd.hidden = true
    onDone()
  }
}

/** 격추된 자리에서 이어한다 */
function reviveByAd() {
  if (!state || state.adUsed.revive >= AD_LIMIT.revive) return
  showAd('이어하기', () => {
    state.adUsed.revive++
    const pl = state.player
    state.lives = LIVES
    pl.hp = pl.maxHp
    pl.inv = 3
    pl.x = W / 2
    pl.y = H - 120
    state.ebullets.length = 0        // 부활하자마자 맞으면 억울하다
    state.running = true
    scOver.hidden = true
    last = performance.now()
    banner('이어서 갑니다')
  })
}

/** 필살기 게이지를 채운다 */
function chargeByAd() {
  if (!state || !state.running) return
  if (state.adUsed.charge >= AD_LIMIT.charge) { banner('충전은 판당 ' + AD_LIMIT.charge + '번까지'); return }
  state.running = false                // 광고 보는 동안 판이 흐르면 안 된다
  showAd('필살기 충전', () => {
    state.adUsed.charge++
    state.ult = ULT_MAX
    state.running = true
    last = performance.now()
    banner('필살기 충전됨')
  })
}

/** 지금 메인에 태운 기체의 필살기 종류 */
function ultKind() {
  const u = state.squad[MAIN_SLOT]
  return u && u.plane ? u.plane.weapon : null
}

/**
 * 필살기를 쓴다.
 *
 * 게이지가 가득 찼을 때만 된다. 종류에 따라 즉시 끝나는 것(일제 사격, 충격파)
 * 과 얼마간 이어지는 것(난사, 광선, 호위)이 있어서, 이어지는 것은 ultT 에
 * 남은 시간을 담아 두고 update 가 매 프레임 처리한다.
 */
function fireUlt() {
  const s = state
  if (!s || !s.running || s.ult < ULT_MAX) return
  const k = ultKind()
  if (!k) return
  s.ult = 0
  s.ultUsed++
  s.ultKind = k
  banner(ULT[k].name)
  sfx('ult')
  haptic('ult')

  const pl = s.player
  switch (k) {
    case 'rapid':  s.ultT = 3.5; break
    case 'laser':  s.ultT = 3; break
    case 'spread': s.ultT = 2.5; break
    case 'orb':    s.ultT = 6; break
    case 'boomer':
      s.ultT = 6
      s.escorts = [-1.6, -0.8, 0.8, 1.6].map((o) => ({ off: o, cd: 0 }))
      break
    case 'pierce':
      s.ultT = 1.2
      pl.inv = Math.max(pl.inv, 1.4)
      break
    case 'wave':
      s.shards.push({ x: pl.x, y: pl.y, r: 10, kind: 'shock' })
      break
    case 'chain': {
      /* 나에게서 시작해 화면 전체를 물고 간다. 거리 제한을 풀어 다 닿게 */
      const save = CHAIN.range
      CHAIN.range = 9999
      chainFrom({ x: pl.x, y: pl.y - 20, dead: true },
                { dmg: 26, jumps: 14 })
      CHAIN.range = save
      break
    }
    case 'homing':
      for (const e of s.enemies) {
        const a = Math.atan2(e.y - pl.y, e.x - pl.x)
        s.bullets.push({ x: pl.x, y: pl.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
                         r: 5, dmg: 14, kind: 'homing', turn: PLAYER_HOMING_TURN * 2,
                         life: 3, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
      }
      if (s.boss) {
        for (let i = 0; i < 6; i++) {
          s.bullets.push({ x: pl.x, y: pl.y, vx: (i - 2.5) * 40, vy: -240,
                           r: 5, dmg: 14, kind: 'homing', turn: PLAYER_HOMING_TURN * 2,
                           life: 3, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
        }
      }
      break
    case 'mine':
      // 옆으로 빠지며 화면 전체에 떨군다. 자리는 미리 정해 두고 시간차로 터진다
      s.ultT = 1.8
      for (let i = 0; i < 14; i++) {
        s.shards.push({ x: 30 + Math.random() * (W - 60), y: -20 - Math.random() * H * .8,
                        r: 0, kind: 'bomb', delay: Math.random() * 1.5 })
      }
      break
    case 'beam':
      s.ultT = 1.6
      for (let i = 0; i < 3; i++) {
        s.shards.push({ x: W * (.25 + i * .25), y: H * .3, r: 0, kind: 'shell', delay: i * .45 })
      }
      break
  }
}

/** 이어지는 필살기를 매 프레임 굴린다 */
function updateUlt(dt) {
  const s = state
  const pl = s.player

  if (s.ultT > 0) {
    s.ultT -= dt
    const k = s.ultKind
    if (k === 'laser' || k === 'spread') {
      /* 지속 광선. 닿는 것을 계속 태운다 */
      const half = k === 'laser' ? 16 : 42
      const cx = k === 'spread' ? W / 2 + Math.sin(s.t * 3.2) * (W / 2 - 50) : pl.x
      s.sweeps = [{ x: cx, half }]
      for (const e of s.enemies) {
        if (Math.abs(e.x - cx) < half + e.r && e.y < pl.y) { e.hp -= 55 * dt; e.flash = .08 }
      }
      for (const u of s.grounds) {
        if (Math.abs(u.x - cx) < half + 14 && u.y < pl.y) { u.hp -= 40 * dt; u.flash = .08 }
      }
      if (s.boss && Math.abs(s.boss.x - cx) < half + s.boss.r) bossArea(s.boss, 70 * dt)
    } else if (k === 'pierce') {
      /* 무적으로 위로 뚫는다. 닿는 것은 부순다 */
      pl.y -= 620 * dt
      pl.inv = Math.max(pl.inv, .2)
      for (const e of s.enemies) {
        if (near(e, pl, e.r + 26)) { e.hp -= 90; e.flash = .1; boom(e.x, e.y, 8, '#ffe08a') }
      }
      if (s.boss && near(s.boss, pl, s.boss.r + 26)) bossArea(s.boss, 160 * dt)
    } else if (k === 'orb') {
      /* 도는 구슬이 적탄을 지운다 */
      const n = 8
      for (let i = 0; i < n; i++) {
        const a = s.t * 3.4 + (i / n) * Math.PI * 2
        const ox = pl.x + Math.cos(a) * 54, oy = pl.y + Math.sin(a) * 54
        for (const b of s.ebullets) {
          if ((b.x - ox) ** 2 + (b.y - oy) ** 2 < 18 * 18) b.dead = true
        }
      }
    } else if (k === 'boomer') {
      for (const es of s.escorts) {
        es.cd -= dt
        if (es.cd <= 0) {
          es.cd = .16
          const ex = Math.max(20, Math.min(W - 20, pl.x + es.off * 46))
          s.bullets.push({ x: ex, y: pl.y - 10, vx: 0, vy: -560, r: 3, dmg: 6,
                           kind: 'rapid', life: 2, age: 0, owner: MAIN_SLOT, pierce: 0, bounce: 0 })
        }
      }
    }
    if (s.ultT <= 0) { s.ultKind = null; s.escorts = []; s.sweeps = [] }
  } else {
    s.sweeps = []
  }

  /* 폭탄·포격·충격파 */
  for (const sh of s.shards) {
    if (sh.delay > 0) { sh.delay -= dt; continue }
    if (sh.kind === 'shock') {
      sh.r += 620 * dt
      for (const b of s.ebullets) if ((b.x - sh.x) ** 2 + (b.y - sh.y) ** 2 < sh.r * sh.r) b.dead = true
      for (const e of s.enemies) {
        if ((e.x - sh.x) ** 2 + (e.y - sh.y) ** 2 < sh.r * sh.r && !e.shocked) {
          e.shocked = true; e.hp -= 26; e.flash = .1
        }
      }
      if (sh.r > H) sh.done = true
    } else {
      sh.r += (sh.kind === 'shell' ? 420 : 260) * dt
      const dmg = sh.kind === 'shell' ? 90 : 44
      for (const e of s.enemies) {
        if (!e.hitBy || e.hitBy !== sh) {
          if ((e.x - sh.x) ** 2 + (e.y - sh.y) ** 2 < sh.r * sh.r) { e.hp -= dmg; e.flash = .1; e.hitBy = sh }
        }
      }
      for (const u of s.grounds) {
        if ((u.x - sh.x) ** 2 + (u.y - sh.y) ** 2 < sh.r * sh.r) { u.hp -= dmg * dt * 6; u.flash = .1 }
      }
      if (s.boss && (s.boss.x - sh.x) ** 2 + (s.boss.y - sh.y) ** 2 < sh.r * sh.r) bossArea(s.boss, dmg * dt * 5)
      if (sh.r > (sh.kind === 'shell' ? 130 : 76)) { sh.done = true; boom(sh.x, sh.y, 16, '#ffd27a') }
    }
  }
  s.shards = s.shards.filter((sh) => !sh.done)
}

function levelUp() {
  const pl = state.player
  if (pl.lv < 5) {
    pl.lv++
    const gain = 20
    pl.maxHp += gain
    pl.hp = Math.min(pl.maxHp, pl.hp + gain)
    banner('편대 ' + pl.lv + '단계')
  } else {
    state.score += 500
    pl.hp = Math.min(pl.maxHp, pl.hp + 25)     // 만렙이면 점수와 수리로
  }
}
/**
 * 맞으면 체력이 닳는다.
 *
 * 예전엔 한 대 맞을 때마다 강화가 하나씩 날아갔다. 스치기만 해도 화력이
 * 반토막 나니 다음 판을 아예 못 풀었다. 이제는 체력이 줄고, 다 닳았을 때만
 * 목숨을 하나 잃는다. 공격마다 아픈 정도가 다르다 — 레이저는 크게, 총알은
 * 조금. 그래야 무엇을 피해야 하는지가 손에 익는다.
 *
 * 무적 시간은 죽었을 때만 준다. 한 대마다 무적이면 탄막 속을 걸어 다닌다.
 */
function hitPlayer(dmg) {
  const pl = state.player
  if (pl.inv > 0) return
  state.hitCount++
  pl.hp -= dmg || DMG.bullet
  boom(pl.x, pl.y, dmg >= 20 ? 22 : 10, '#7fd6ff')
  pl.shake = Math.min(1, (dmg || 8) / 22)
  sfx('hurt', dmg >= 24 ? 1 : 0)
  haptic(dmg >= 24 ? 'hard' : 'soft')
  if (pl.hp > 0) return

  boom(pl.x, pl.y, 34, '#ffd27a')
  haptic('down')
  state.lives--
  pl.hp = pl.maxHp
  pl.inv = 2.2
  pl.x = W / 2
  pl.y = H - 120
  /*
   * 격추돼도 강화는 그대로 둔다.
   *
   * 이 게임의 목적은 어렵게 만들어 결제를 부르는 게 아니라 오래 하게 만드는
   * 것이다. 죽을 때마다 화력이 깎이면 뒤로 갈수록 못 이기고, 못 이기면 그만
   * 둔다. 목숨 하나로 충분히 아프다.
   */
  if (state.lives <= 0) end(false)
  else banner('격추 · 남은 기체 ' + state.lives)
}

/** 손끝으로 알려준다. 못 하는 기기면 조용히 넘어간다 */
/*
 * 손끝으로 알려준다.
 *
 * 스도쿠에서 배운 것이 하나 있다 - 세기가 비슷하면 무슨 일인지 구분이 안
 * 된다. 정답 12ms 와 오답 [10,55,10] 을 썼다가 둘이 같게 느껴져서 오답을
 * [45,70,45] 로 벌렸다. 여기서도 상황마다 확실히 벌려 둔다.
 *
 * 격추에는 진동을 넣지 않는다. 초당 몇 대씩 떨어지는데 그때마다 떨면
 * 폰이 계속 우는 것이고, 정작 중요한 '내가 맞았다'가 묻힌다.
 */
const HAPTIC = {
  soft: 14,                 // 스친 정도
  hard: [30, 45, 30],       // 크게 맞았다
  down: [70, 90, 70],       // 기체를 하나 잃었다
  ult: [22, 30, 22],        // 필살기
}
function haptic(kind) {
  const p = HAPTIC[kind]
  if (p == null || !AU.on.vib) return
  try { navigator.vibrate?.(p) } catch { /* 없으면 그만 */ }
}

/* ================================================================
 * 갱신
 * ================================================================ */
function update(dt) {
  const s = state
  s.t += dt

  for (const st of s.stars) { st.y += (30 + st.z * 120) * dt; if (st.y > H) { st.y = -2; st.x = Math.random() * W } }

  const pl = s.player
  const kv = 280 * dt
  if (keys.ArrowLeft) pl.x -= kv
  if (keys.ArrowRight) pl.x += kv
  if (keys.ArrowUp) pl.y -= kv
  if (keys.ArrowDown) pl.y += kv
  pl.x = Math.max(48, Math.min(W - 48, pl.x))
  pl.y = Math.max(70, Math.min(H - 34, pl.y))
  if (pl.inv > 0) pl.inv -= dt

  s.squad.forEach((u, i) => shoot(u, i, dt))

  updateUlt(dt)
  const wv = s.stage.waves
  while (s.waveIdx < wv.length && s.t >= wv[s.waveIdx].at) { wv[s.waveIdx].f(); s.waveIdx++ }

  /*
   * 보스가 없는 단계는 무엇으로 끝나는가.
   *
   * 5·10·15·20 단계만 보스로 끝난다. 나머지는 웨이브를 다 넘기고 화면이
   * 비면 끝이다. 이 조건이 없으면 웨이브가 떨어진 뒤로 아무 일도 안 일어나
   * 판이 영영 안 끝난다.
   */
  if (!s.cleared && !s.boss && s.waveIdx >= wv.length && s.enemies.length === 0) {
    s.clearWait = (s.clearWait || 0) + dt
    if (s.clearWait > 1.2) {
      s.cleared = true
      banner('작전 완료')
      setTimeout(() => { if (s.running) end(true) }, 800)
    }
  } else {
    s.clearWait = 0
  }

  /* 내 탄 — 종류마다 다르게 움직인다 */
  for (const b of s.bullets) {
    b.age += dt
    switch (b.kind) {
      case 'homing': {
        const tgt = nearestEnemy(b.x, b.y)
        if (tgt) {
          const want = Math.atan2(tgt.y - b.y, tgt.x - b.x)
          const cur = Math.atan2(b.vy, b.vx)
          let d = want - cur
          while (d > Math.PI) d -= Math.PI * 2
          while (d < -Math.PI) d += Math.PI * 2
          const na = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d))
          const sp = Math.hypot(b.vx, b.vy)
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp
        }
        break
      }
      case 'wave':
        b.x = b.x0 + Math.sin(b.age * 7 + b.ph) * b.amp * Math.min(1, b.age * 3)
        break
      case 'orb': {
        const p = slotPos(b.owner)
        b.a += dt * 4.5
        b.x = p.x + Math.cos(b.a) * b.rad
        b.y = p.y + Math.sin(b.a) * b.rad
        break
      }
      case 'mine':
        b.vy *= 1 - Math.min(1, dt * 5)
        b.fuse -= dt
        if (b.fuse <= 0) {
          b.dead = true
          boom(b.x, b.y, 18, '#ffd166')
          for (const e of s.enemies) {
            if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < 62 * 62) { e.hp -= b.dmg; e.flash = .1 }
          }
          for (const u of s.grounds) {
            if ((u.x - b.x) ** 2 + (u.y - b.y) ** 2 < 62 * 62) { u.hp -= b.dmg; u.flash = .1 }
          }
          if (s.boss && (s.boss.x - b.x) ** 2 + (s.boss.y - b.y) ** 2 < 70 * 70) bossArea(s.boss, b.dmg)
        }
        break
      case 'boomer':
        b.vy += 900 * dt
        if (b.age > 1.6) b.dead = true
        break
    }
    if (b.kind !== 'orb') { b.x += b.vx * dt; b.y += b.vy * dt }
    /* 반사 — 옆 벽에서만 튕긴다. 위아래로도 튕기면 탄이 화면에 갇힌다 */
    if (b.bounce > 0) {
      if (b.x < 6 && b.vx < 0) { b.vx = -b.vx; b.bounce-- }
      else if (b.x > W - 6 && b.vx > 0) { b.vx = -b.vx; b.bounce-- }
    }
    if (b.age > b.life) b.dead = true
  }
  s.bullets = s.bullets.filter((b) => !b.dead && b.y > -60 && b.y < H + 80 && b.x > -60 && b.x < W + 60)

  for (const e of s.enemies) {
    e.t += dt
    if (e.flash > 0) e.flash -= dt

    if (e.kind === 'dive') {
      /* 조준 - 잠깐 따라붙어 겨눈다. 이때 예고선이 보인다 */
      if (e.aim > 0) {
        e.aim -= dt
        e.y += e.sp * dt
        e.x += (pl.x - e.x) * Math.min(1, dt * 2.4)
      } else {
        e.y += e.dashSp * dt                    // 꽂힌다
      }
      continue
    }

    if (e.mode === 'wing') {
      /* 대열을 이뤄 내려와 잠시 멈춘다 */
      if (e.y < e.holdY) e.y += e.sp * 1.7 * dt
      else if (e.hold > 0) { e.hold -= dt; e.x = e.baseX + Math.sin(e.t * 1.5) * 13 }
      else e.y += e.sp * dt
    } else if (e.mode === 'side') {
      e.x += e.vx * dt
      e.y += e.sp * .35 * dt
    } else if (e.mode === 'rise') {
      if (e.riseT > 0) { e.riseT -= dt; e.y -= e.riseSp * dt }
      else e.y += e.sp * .8 * dt
    } else {
      e.y += e.sp * dt
      const wobble = e.sway ? Math.sin(e.t * 1.1) * e.sway : Math.sin(e.t * 1.6) * 34
      e.x += (e.drift ? e.drift * 46 : wobble) * dt
    }
    // 옆에서 들어오는 것만 화면 밖을 허용한다. 나머지는 가둔다
    if (e.mode !== 'side') e.x = Math.max(18, Math.min(W - 18, e.x))

    /*
     * 레이저기. 자리를 잡으면 예고하고 쏜다.
     *
     * 다른 적과 달리 조준탄을 안 쓴다. 대신 빔이 지나갈 길을 먼저 보여주고
     * 1.1초 뒤에 쏜다. 그 안에 옆으로 비키면 된다.
     */
    if (e.lance) {
      if (e.beamPh > 0) {
        e.beamPh -= dt
        if (e.beamPh <= .35 && Math.abs(pl.x - e.x) < 15 + PLAYER_R && pl.y > e.y) {
          hitPlayer(DMG.beam)
        }
      } else {
        e.cd -= dt
        if (e.cd <= 0 && e.y > 40 && e.y < H * .55) {
          e.cd = e.fire * fireScale()
          e.beamPh = 1.45
        }
      }
      continue
    }
    e.cd -= dt
    if (e.cd <= 0 && e.y > 0 && e.y < H * .72) {
      e.cd = e.fire * fireScale()
      const a = Math.atan2(pl.y - e.y, pl.x - e.x)
      if (e.kind === 'gunner') {
        /* 부채꼴 다섯 발. 정면이 제일 위험하고 옆이 안전하다 */
        for (let k = -2; k <= 2; k++) {
          s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a + k * .17) * 170,
                            vy: Math.sin(a + k * .17) * 170, r: 4, dmg: DMG.bullet, sh: 'fan' })
        }
        continue
      }
      if (e.kind === 'tank') {
        /* 굵고 느린 탄 두 발. 아프지만 잘 보인다 */
        for (const d of [-.1, .1]) {
          s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a + d) * 130, vy: Math.sin(a + d) * 130,
                            r: 6, dmg: DMG.flak, sh: 'heavy' })
        }
        continue
      }
      /*
       * 중형기는 이따금 유도탄을 쏜다.
       *
       * 전부 직선탄이면 옆으로 한 걸음씩만 밟으면 다 피해진다. 따라오는 탄이
       * 섞여야 자리를 옮기게 된다.
       */
      if ((e.kind === 'mid' || e.kind === 'tank') && Math.random() < .45) {
        s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120,
                          r: 5, kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
      } else {
        const sp = e.kind === 'mid' ? 190 : 160
        s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                          r: e.kind === 'mid' ? 4.5 : 3.5, dmg: DMG.bullet,
                          sh: e.kind === 'mid' ? 'mid' : 'small' })
      }
    }
  }
  s.enemies = s.enemies.filter((e) =>
    (e.mode === 'rise' && e.riseT > 0) ||
    (e.y < H + 60 && e.x > -90 && e.x < W + 90))

  const bs = s.boss
  if (bs) {
    bs.t += dt
    if (bs.flash > 0) bs.flash -= dt
    for (const p of bs.parts) if (p.flash > 0) p.flash -= dt

    if (bs.entering) {
      bs.y += 60 * dt
      if (bs.y >= 130) { bs.y = 130; bs.entering = false }
    } else {
      const alive = bs.parts.filter((p) => p.alive).length

      /* ---- 2 페이즈: 돌진 ---- */
      if (bs.phase === 2 && bs.dashPh <= 0 && bs.lancePh <= 0 && Math.random() < dt * 0.4) {
        bs.dashPh = 2.2; bs.dashX = pl.x
      }
      if (bs.dashPh > 0) {
        bs.dashPh -= dt
        if (bs.dashPh > 1.5) {
          // 예고. 자리를 잡고 기다린다
          bs.x += (bs.dashX - bs.x) * Math.min(1, dt * 4)
        } else if (bs.dashPh > 0.7) {
          bs.y += 620 * dt                     // 내리꽂는다
        } else {
          bs.y += (130 - bs.y) * Math.min(1, dt * 3)   // 제자리로
        }
        if (near(bs, pl, bs.r + PLAYER_R)) hitPlayer(DMG.bossDash)
      } else {
        bs.x = W / 2 + Math.sin(bs.t * .7) * (W / 2 - 70)
      }

      /*
       * ---- 2 페이즈: 즉사 광선 ----
       *
       * 예고 1.5초, 발사 0.45초. 예고 동안 붉은 길이 깔리고 폭이 좁아진다.
       * 폭 44 라 화면 420 에서 옆으로 한 뼘만 비키면 산다.
       */
      if (bs.phase === 2 && bs.dashPh <= 0 && !bs.mid) {
        bs.lanceCd -= dt
        if (bs.lancePh <= 0 && bs.lanceCd <= 0) {
          bs.lancePh = 1.95
          bs.lanceX = pl.x
          bs.lanceCd = 7.5
          sfx('alarm')
        }
      }
      if (bs.lancePh > 0) {
        bs.lancePh -= dt
        if (bs.lancePh <= 0.45 && Math.abs(pl.x - bs.lanceX) < 22 + PLAYER_R) {
          hitPlayer(DMG.lance)
        }
      }

      /* ---- 부위 사격. 살아 있는 것만 쏜다 ---- */
      for (const p of bs.parts) {
        if (!p.alive || p.key === 'en') continue
        p.cd -= dt
        if (p.cd <= 0) {
          p.cd = 1.3
          const tx = bs.x + p.dx, ty = bs.y + p.dy
          const a = Math.atan2(pl.y - ty, pl.x - tx)
          s.ebullets.push({ x: tx, y: ty, vx: Math.cos(a) * 195, vy: Math.sin(a) * 195,
                            r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
        }
      }

      /* ---- 부하 소환 ---- */
      bs.summonCd -= dt
      if (bs.summonCd <= 0) {
        bs.summonCd = bs.phase === 2 ? 4.5 : 7
        for (const sx of [70, W - 70]) s.enemies.push(mkEnemy('small', sx, -30, 0))
      }

      /*
       * ---- 본체 사격 ----
       *
       * 엔진이 살아 있으면 느리다. 엔진을 먼저 부수면 탄이 성겨지므로
       * "어디부터 부술까"가 실제 선택이 된다.
       */
      bs.cd -= dt
      if (bs.cd <= 0 && bs.dashPh <= 0 && bs.lancePh <= 0) {
        const engine = bs.parts.find((p) => p.key === 'en')
        const slow = engine && engine.alive ? 1.35 : 1
        const haste = 1 - alive * 0.06
        if (bs.phase === 1) {
          bs.cd = 1.05 * slow * haste
          for (let i = -3; i <= 3; i++) {
            const a = Math.PI / 2 + i * .17
            s.ebullets.push({ x: bs.x, y: bs.y + 24, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
                              r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
          }
          /* 조준 유도탄 하나. 가만히 서 있지 못하게 한다 */
          if (Math.random() < .45) {
            s.ebullets.push({ x: bs.x, y: bs.y + 20, vx: 0, vy: 130, r: 5,
                              kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
          }
        } else {
          /* 코어가 열리면 원형 탄막 + 조준 3연발을 번갈아 */
          bs.cd = 1.15
          if (Math.floor(bs.t) % 2 === 0) {
            for (let i = 0; i < 18; i++) {
              const a = (i / 18) * Math.PI * 2 - bs.t * .6
              s.ebullets.push({ x: bs.x, y: bs.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160,
                                r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
            }
          } else {
            const a = Math.atan2(pl.y - bs.y, pl.x - bs.x)
            for (const d of [-.14, 0, .14]) {
              s.ebullets.push({ x: bs.x, y: bs.y + 24, vx: Math.cos(a + d) * 225, vy: Math.sin(a + d) * 225,
                                r: 4, age: 0, dmg: DMG.boss, sh: 'boss' })
            }
            s.ebullets.push({ x: bs.x, y: bs.y + 20, vx: 0, vy: 140, r: 5,
                              kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0, dmg: DMG.missile })
          }
        }
      }
    }
  }

  /* 땅과 지상 위협 */
  for (const sl of s.slabs) {
    sl.y += TERRAIN_SPEED * dt
    if (sl.y > H + 40) { sl.y = -60; sl.x = Math.random() * W; sl.w = 30 + Math.random() * 70 }
  }
  for (const u of s.grounds) {
    u.y += TERRAIN_SPEED * dt
    u.t += dt
    if (u.flash > 0) u.flash -= dt
    if (u.y < 10 || u.y > H + 20) continue            // 화면에 보일 때만 쏜다
    updateGround(u, dt)
  }
  s.grounds = s.grounds.filter((u) => u.y < H + 80 && !u.dead)

  /* 방공 빔 */
  for (const bm of s.beams) {
    bm.age += dt
    if (bm.age > bm.life) bm.dead = true
    else if (bm.age > bm.warn && Math.abs(pl.x - bm.x) < bm.w / 2 + PLAYER_R && pl.y < bm.y) hitPlayer(DMG.beam)
  }
  s.beams = s.beams.filter((b) => !b.dead)

  /* 적 탄 — 유도탄과 채프탄이 섞여 있다 */
  for (const b of s.ebullets) {
    b.age = (b.age || 0) + dt
    if (b.kind === 'missile') {
      /*
       * 선회 속도를 사용자 유도탄의 20% 로 둔다. 같은 성능이면 절대
       * 못 피하고, 그러면 유도탄이 아니라 사형선고가 된다.
       */
      const want = Math.atan2(pl.y - b.y, pl.x - b.x)
      const cur = Math.atan2(b.vy, b.vx)
      let d = want - cur
      while (d > Math.PI) d -= Math.PI * 2
      while (d < -Math.PI) d += Math.PI * 2
      const na = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d))
      const sp = Math.hypot(b.vx, b.vy)
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp
      if (b.age > 6) b.dead = true
    } else if (b.kind === 'flakshell' && b.y <= b.burstY) {
      /* 정해진 높이에서 파편으로 터진다 */
      b.dead = true
      boom(b.x, b.y, 10, '#ffd166')
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2
        s.ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 135, vy: Math.sin(a) * 135, r: 3.4, age: 0, dmg: DMG.flak })
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt
  }
  s.ebullets = s.ebullets.filter((b) => !b.dead && b.y > -60 && b.y < H + 40 && b.x > -40 && b.x < W + 40)

  for (const it of s.items) { it.y += 90 * dt; it.t += dt }
  s.items = s.items.filter((it) => it.y < H + 30)

  for (const p of s.parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94 }
  s.parts = s.parts.filter((p) => p.age < p.life)

  for (const a of s.arcs) a.age += dt
  s.arcs = s.arcs.filter((a) => a.age < a.life)

  for (const b of s.blasts) b.age += dt
  s.blasts = s.blasts.filter((b) => b.age < b.life)

  collide()
  if (s.bannerT > 0) s.bannerT -= dt
}

/* 지상 위협 하나하나의 행동 */
function updateGround(u, dt) {
  const s = state, pl = s.player
  switch (u.kind) {
    case 'turret': {
      u.cd -= dt
      if (u.cd <= 0) {
        u.cd = 1.8 * fireScale()
        const a = Math.atan2(pl.y - u.y, pl.x - u.x)
        for (let k = -1; k <= 1; k++)
          s.ebullets.push({ x: u.x, y: u.y - 8, dmg: DMG.flak, vx: Math.cos(a + k * .09) * 205,
                            vy: Math.sin(a + k * .09) * 205, r: 4, age: 0 })
      }
      break
    }
    case 'flak': {
      u.cd -= dt
      if (u.cd <= 0) {
        u.cd = 3.0 * fireScale()
        // 사용자 높이보다 살짝 위에서 터뜨려야 파편이 내려오며 압박한다
        s.ebullets.push({ x: u.x, y: u.y - 10, vx: (pl.x - u.x) * .35, vy: -300,
                          r: 5, kind: 'flakshell', burstY: Math.max(60, pl.y - 40), age: 0 })
      }
      break
    }
    case 'laser': {
      u.cd -= dt
      if (u.phase === 'idle' && u.cd <= 0) { u.phase = 'aim'; u.ph = 0.9; u.aimX = pl.x }
      else if (u.phase === 'aim') {
        u.ph -= dt
        if (u.ph <= 0) {
          u.phase = 'idle'; u.cd = 3.4 * fireScale()
          s.beams.push({ x: u.aimX, y: u.y, w: 20, age: 0, warn: 0, life: 0.55 })
        }
      }
      break
    }
    case 'radar': {
      const d = Math.hypot(pl.x - u.x, pl.y - u.y)
      if (d < RADAR_R) {
        u.lock += dt
        if (u.lock >= 1.5) {
          u.lock = 0
          banner('미사일')
          for (const k of [-1, 1]) {
            s.ebullets.push({ x: u.x + k * 12, y: u.y - 8, vx: k * 90, vy: -160,
                              r: 5, kind: 'missile', turn: ENEMY_HOMING_TURN, age: 0 })
          }
        }
      } else u.lock = Math.max(0, u.lock - dt * 1.5)
      break
    }
  }
}

/**
 * 맞은 자리에서 파편을 옆으로 흩는다.
 *
 * 파편은 다시 갈라지지 않는다(split 을 물려주지 않는다). 안 그러면 적이
 * 몰린 곳에서 탄이 기하급수로 늘어 프레임이 주저앉는다.
 */
function splitBullet(b) {
  for (const dir of [-1, 1]) {
    state.bullets.push({
      x: b.x, y: b.y, vx: dir * (140 + b.split * 40), vy: -260,
      r: Math.max(2, b.r * .6), dmg: b.dmg * .45, pierce: 0,
      life: .8, age: 0, kind: 'normal',
    })
  }
}

function near(a, b, r) { return (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < r * r }

function collide() {
  const s = state, pl = s.player

  for (const b of s.bullets) {
    if (b.dead || b.kind === 'mine') continue
    for (const e of s.enemies) {
      if (e.dead || b.dead) continue
      if (b.hitList && b.hitList.includes(e)) continue
      if (near(b, e, e.r + b.r)) {
        e.hp -= b.dmg; e.flash = .1
        sfx('hit')
        if (b.kind === 'chain') chainFrom(e, b)
        if (b.split > 0) splitBullet(b)
        if (b.pierce > 0) { b.pierce--; (b.hitList = b.hitList || []).push(e) }
        else b.dead = true
        if (e.hp <= 0) {
          e.dead = true; s.score += e.score; s.kills++
          boom(e.x, e.y, e.kind === 'mid' ? 22 : 12, '#ffb45c')
          // 중형이 죽을 때마다 뭔가 떨어지니 화면이 아이템으로 덮였다
          if (Math.random() < (e.kind === 'mid' ? .55 : .08)) dropItem(e.x, e.y, e.kind === 'mid')
          // 큰 적일수록 많이 찬다. 열댓 마리 잡으면 한 번 쓴다
          const before = s.ult
          // 예전엔 잡졸 열일곱만 잡으면 궁이 찼다. 판이 궁으로만 굴러갔다
          s.ult = Math.min(ULT_MAX, s.ult + (e.kind === 'small' ? 3 : e.kind === 'tank' ? 11 : 6))
          if (before < ULT_MAX && s.ult >= ULT_MAX) sfx('ready')
        }
      }
    }
    /* 지상 위협도 쏴서 없앨 수 있다. 피할 수만 있고 못 없애면 답답하다. */
    for (const u of s.grounds) {
      if (u.dead || b.dead || u.y < -20) continue
      if (b.hitList && b.hitList.includes(u)) continue
      if (near(b, u, u.r + b.r)) {
        u.hp -= b.dmg; u.flash = .1
        if (b.pierce > 0) { b.pierce--; (b.hitList = b.hitList || []).push(u) }
        else b.dead = true
        if (u.hp <= 0) {
          u.dead = true; s.score += u.score; s.kills++
          boom(u.x, u.y, 24, '#ffcf7a')
          // 지상 위협은 피하기 까다로우니 개조가 더 자주 나온다
          if (Math.random() < .35) dropItem(u.x, u.y, true)
        }
      }
    }

    const bs = s.boss
    /* 부위가 먼저 맞는다. 부위를 다 부수기 전에는 코어가 안 깎인다 */
    if (bs && !b.dead && !bs.entering && near(b, bs, bs.r + b.r + 24)) {
      const r = bossHit(bs, b.x, b.y, b.dmg)
      if (r !== 'block') {
        sfx('hit')
        boom(b.x, b.y, 2, r === 'core' ? '#9fe8ff' : '#ffd27a')
        if (b.pierce > 0) b.pierce--; else b.dead = true
      } else if (near(b, bs, bs.r + b.r)) {
        /* 코어가 닫혀 있다. 튕긴다 - 여기를 쏴도 소용없다는 걸 보여준다 */
        b.dead = true
        boom(b.x, b.y, 2, '#8aa0c0')
      }
    }
  }
  s.bullets = s.bullets.filter((b) => !b.dead)
  s.enemies = s.enemies.filter((e) => !e.dead)

  /* 판정은 메인 한 대뿐이다. 윙맨은 그림만 있고 맞지 않는다. */
  for (const b of s.ebullets) {
    if (!near(b, pl, b.r + PLAYER_R)) continue
    b.dead = true
    hitPlayer(b.dmg || DMG.bullet)
  }
  s.ebullets = s.ebullets.filter((b) => !b.dead)

  for (const e of s.enemies) {
    if (!near(e, pl, e.r + PLAYER_R)) continue
    e.dead = true
    boom(e.x, e.y, 14, '#ffb45c')
    hitPlayer(e.kind === 'dive' ? DMG.dive : DMG.ram)
  }
  s.enemies = s.enemies.filter((e) => !e.dead)

  for (const it of s.items) {
    if (!near(it, pl, it.r + 18)) continue
    it.dead = true
    s.score += 60
    sfx('pick')
    // 무엇을 줍든 조금 아문다. 회복 수단이 아예 없으면 후반이 버티기만 된다
    pl.hp = Math.min(pl.maxHp, pl.hp + 12)
    if (it.tk) {
      prog.ticket++
      save()
      banner('가챠권 +1')
      sfx('ready')
    } else if (it.mod) {
      s.mods[it.mod] = Math.min(MOD_MAX, s.mods[it.mod] + 1)
      banner(MODS[it.mod].name + ' ' + s.mods[it.mod])
    } else {
      levelUp()
    }
  }
  s.items = s.items.filter((it) => !it.dead)
}

/** 그림을 미리 받아 둔다. 첫 판에서 기체가 늦게 뜨면 안 된다 */
const SHIP_IMG = {}
for (const k in SHIP_B64) {
  const im = new Image()
  im.src = 'data:image/webp;base64,' + SHIP_B64[k]
  SHIP_IMG[k] = im
}
/* 뇌신은 아직 제 그림이 없다. 결이 맞는 천둥대포 것을 빌려 쓴다 */
SHIP_IMG['chain-legend'] = SHIP_IMG['beam-legend']

function shipArt(id) {
  const im = SHIP_IMG[id]
  return im && im.complete && im.naturalWidth ? im : null
}

const TIER_COLOR = { common: '#dbe7f5', rare: '#8fd8ff', legend: '#ffd27a' }

/**
 * 색을 밝히거나(양수) 어둡게(음수) 한다.
 *
 * 입체감은 결국 같은 색의 밝기 차이다. 명암마다 색을 따로 정해 두면 기체
 * 색을 바꿀 때 전부 다시 골라야 해서, 하나에서 파생시킨다.
 */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16)
  const r = (n >> 16) & 255, gr = (n >> 8) & 255, b = n & 255
  const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))))
  return 'rgb(' + f(r) + ',' + f(gr) + ',' + f(b) + ')'
}

/**
 * 바다에 뜬 섬 하나를 그린다.
 *
 * 물거품 - 모래 - 풀 - 볕 순으로 겹친다. 가장자리에 물거품을 깔아야 섬이
 * 물 위에 얹힌 것처럼 보인다. 없으면 그냥 배경에 뚫린 구멍으로 보인다.
 */
function drawIsle(sl) {
  const cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2
  if (cy < -90 || cy > H + 90) return
  const rx = sl.w / 2, ry = sl.h / 2
  g.save(); g.translate(cx, cy); g.rotate(sl.seed * .25)
  /*
   * 섬은 배경이다. 눈에 띄면 안 된다.
   *
   * 처음엔 모래색과 풀색을 그대로 썼더니 섬이 주인공이 되고 적기가 안 보였다.
   * 채도를 낮추고 알파를 걸어 물속에 잠긴 것처럼 만들었다.
   */
  const TH = (state && state.theme) || THEMES.sea
  g.fillStyle = TH.halo
  g.beginPath(); g.ellipse(0, 0, rx + 7, ry + 6, 0, 0, Math.PI * 2); g.fill()
  if (sl.kind === 'reef') {
    g.fillStyle = TH.dark
    g.beginPath(); g.ellipse(0, 0, rx * .72, ry * .72, 0, 0, Math.PI * 2); g.fill()
  } else {
    g.fillStyle = TH.body
    g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.fill()
    g.fillStyle = TH.cap
    g.beginPath(); g.ellipse(-rx * .07, -ry * .09, rx * .74, ry * .7, 0, 0, Math.PI * 2); g.fill()
  }
  g.restore()
}

/**
 * 기체를 그린다.
 *
 * 강화 레벨과 개조가 겉으로 드러나야 한다. 숫자만 오르고 그림이 그대로면
 * "세졌다"가 손에 안 잡히고, 다음 아이템을 주우러 갈 이유가 약해진다.
 *
 * 레벨은 뼈대를 키운다 — 날개가 넓어지고, 앞날개가 붙고, 엔진이 늘고,
 * 마지막에 꼬리날개가 선다. 개조는 그 위에 부품을 얹는다. 둘을 나눠 둬야
 * "레벨이 올랐나 개조를 주웠나"가 구분된다.
 */
/* 격납고 카드도 같은 그림을 써야 한다. 그래서 캔버스를 밖에서 받는다. */
function drawShip(x, y, u, isMain) {
  drawShipOn(g, x, y, {
    plane: u.plane, lv: state.player.lv, mods: state.mods, scale: isMain ? 1 : 0.58,
  })
}

function drawShipOn(g, x, y, opt) {
  const p = opt.plane
  const lv = opt.lv
  const M = opt.mods || NO_MODS
  const body = p ? TIER_COLOR[p.tier] : '#dbe7f5'
  const scale = opt.scale
  const span = (13 + lv * 2.6) * scale       // 레벨이 곧 날개 폭
  const nose = (18 + lv * 1.4) * scale
  const flame = opt.flame !== false

  /*
   * 바다에 지는 그림자.
   *
   * 이거 하나로 기체가 배경 위에 얹힌 게 아니라 그 위를 나는 것처럼 보인다.
   * 오른쪽 아래로 밀어야 햇빛이 왼쪽 위에서 오는 다른 음영과 맞는다.
   */
  if (opt.shadow !== false) {
    g.save()
    g.translate(x + 11 * scale, y + 15 * scale)
    g.fillStyle = 'rgba(0,12,28,.26)'
    g.beginPath(); g.ellipse(0, 0, span * .95, nose * .5, 0, 0, Math.PI * 2); g.fill()
    g.restore()
  }

  g.save(); g.translate(x, y); g.scale(scale, scale)

  /* ---- 엔진. 레벨 4 에서 둘, 5 에서 셋이 된다 ---- */
  const noz = lv >= 5 ? [-8, 0, 8] : lv >= 4 ? [-6, 6] : [0]
  const flick = flame ? .6 + Math.random() * .5 : .8
  const len = (18 + lv * 2) * (1 + M.speed * .35)   // 가속을 주우면 불꽃이 길어진다
  for (const nx of (flame ? noz : noz)) {
    const grd = g.createLinearGradient(0, 8, 0, 8 + len * flick)
    grd.addColorStop(0, 'rgba(120,220,255,.95)')
    grd.addColorStop(1, 'rgba(80,140,255,0)')
    g.fillStyle = grd
    g.beginPath(); g.moveTo(nx - 3, 8); g.lineTo(nx + 3, 8)
    g.lineTo(nx, 8 + len * flick); g.closePath(); g.fill()
  }

  /*
   * 그림이 있으면 그림을 쓰고, 없으면 예전처럼 도형으로 그린다.
   *
   * 그림은 첫 프레임에 아직 안 받아졌을 수 있다. 그때 아무것도 안 그리면
   * 기체가 깜빡이므로 도형 쪽으로 넘어간다.
   */
  const art = p && shipArt(p.id)
  if (art) {
    const s2 = 30 + lv * 3.6
    g.drawImage(art, -s2 / 2, -s2 / 2, s2, s2)
  } else {
    /* ---- 주익. 위가 밝고 아래가 어두워야 두께가 보인다 ---- */
    const wg = g.createLinearGradient(0, -6, 0, 12)
    wg.addColorStop(0, '#4b8fce')
    wg.addColorStop(.55, '#2f6fa8')
    wg.addColorStop(1, '#1d4a76')
    g.fillStyle = wg
    g.beginPath()
    g.moveTo(0, -5); g.lineTo(span, 7); g.lineTo(span * .55, 11)
    g.lineTo(0, 5); g.lineTo(-span * .55, 11); g.lineTo(-span, 7)
    g.closePath(); g.fill()
    /* 날개 앞전에 빛이 걸린다 */
    g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 1
    g.beginPath(); g.moveTo(-span, 7); g.lineTo(0, -5); g.lineTo(span, 7); g.stroke()

    /* ---- 앞날개. 레벨 3 부터 ---- */
    if (lv >= 3) {
      g.fillStyle = '#3d84c4'
      for (const sgn of [-1, 1]) {
        g.beginPath()
        g.moveTo(sgn * 3, -nose * .45)
        g.lineTo(sgn * (span * .58), -nose * .1)
        g.lineTo(sgn * 3, -nose * .05)
        g.closePath(); g.fill()
      }
    }

    /* ---- 꼬리날개. 레벨 5 ---- */
    if (lv >= 5) {
      g.fillStyle = '#24568a'
      g.beginPath(); g.moveTo(0, 4); g.lineTo(7, 13); g.lineTo(-7, 13); g.closePath(); g.fill()
    }

    /* ---- 동체. 가로 그라디언트로 둥글게 보이게 한다 ---- */
    const bg2 = g.createLinearGradient(-7, 0, 7, 0)
    bg2.addColorStop(0, shade(body, -.42))
    bg2.addColorStop(.38, body)
    bg2.addColorStop(.58, shade(body, .3))
    bg2.addColorStop(1, shade(body, -.28))
    g.fillStyle = bg2
    g.beginPath()
    g.moveTo(0, -nose); g.lineTo(6, 4); g.lineTo(3, 11)
    g.lineTo(-3, 11); g.lineTo(-6, 4)
    g.closePath(); g.fill()

    /* 전설 기체는 동체에 옅은 테두리가 돈다 */
    if (p && p.tier === 'legend') {
      g.strokeStyle = 'rgba(255,210,122,.85)'; g.lineWidth = 1.2; g.stroke()
    }

    /* ---- 캐노피. 레벨이 오르면 커진다 ---- */
    const cw = 2.4 + lv * .18, ch = 4.5 + lv * .5
    const cg = g.createLinearGradient(-cw, -3 - ch, cw, -3 + ch)
    cg.addColorStop(0, '#bff0ff')
    cg.addColorStop(.45, '#4fd1ff')
    cg.addColorStop(1, '#1a6f9c')
    g.fillStyle = cg
    g.beginPath(); g.ellipse(0, -3, cw, ch, 0, 0, Math.PI * 2); g.fill()
    /* 유리에 하늘이 비친다 */
    g.fillStyle = 'rgba(255,255,255,.5)'
    g.beginPath(); g.ellipse(-cw * .3, -3 - ch * .35, cw * .34, ch * .26, 0, 0, Math.PI * 2); g.fill()

    /* ================================================================
     * 무기별 생김새 — 30기가 다 같은 모양이면 고를 이유가 없다
     *
     * 무기 열 종류를 실루엣으로 구분한다. 격납고 카드에서도 이 그림을 그대로
     * 쓰기 때문에, 고를 때 본 모습이 날 때 그대로 나온다.
     * ================================================================ */
    if (p) {
      /* 색은 그 무기의 탄 색을 쓴다. 카드에서 본 색이 날 때 그대로 나온다 */
      const acc = WEAPON_COLOR[p.weapon] || '#9fb4cc'
      g.fillStyle = acc
      g.strokeStyle = acc
      switch (p.weapon) {
        case 'rapid':               // 총열 두 개
          for (const sgn of [-1, 1]) g.fillRect(sgn * (span * .5) - 1.4, -nose * .5, 2.8, 13)
          break
        case 'spread':              // 날개 끝이 부채처럼 벌어진다
          for (const sgn of [-1, 1]) {
            g.beginPath()
            g.moveTo(sgn * span * .8, 6); g.lineTo(sgn * (span + 9), 0)
            g.lineTo(sgn * (span + 6), 11); g.closePath(); g.fill()
          }
          break
        case 'laser':               // 기수 위로 긴 침이 솟는다
          g.fillRect(-1.8, -nose - 13, 3.6, 15)
          g.beginPath(); g.arc(0, -nose - 13, 2.6, 0, Math.PI * 2); g.fill()
          break
        case 'homing':              // 날개 밑 미사일 두 발
          for (const sgn of [-1, 1]) {
            g.beginPath(); g.ellipse(sgn * span * .6, 3, 2.6, 7, 0, 0, Math.PI * 2); g.fill()
          }
          break
        case 'pierce':              // 기수가 창처럼 길게 뻗는다
          g.beginPath(); g.moveTo(0, -nose - 12); g.lineTo(3.6, -nose + 3); g.lineTo(-3.6, -nose + 3)
          g.closePath(); g.fill()
          break
        case 'wave':                // 날개에 물결 세 겹
          g.lineWidth = 1.8
          for (let k = 0; k < 3; k++) {
            const yy = -1 + k * 4.5
            g.beginPath()
            g.moveTo(-span * .8, yy)
            g.quadraticCurveTo(-span * .4, yy - 3.2, 0, yy)
            g.quadraticCurveTo(span * .4, yy + 3.2, span * .8, yy)
            g.stroke()
          }
          break
        case 'orb':                 // 기체를 도는 구슬
          g.globalAlpha = .35; g.lineWidth = 1.2
          g.beginPath(); g.arc(0, 0, span * .82, 0, Math.PI * 2); g.stroke()
          g.globalAlpha = 1
          for (const sgn of [-1, 1]) {
            g.beginPath(); g.arc(sgn * (span * .82), -1, 3.2, 0, Math.PI * 2); g.fill()
          }
          break
        case 'mine':                // 배 밑에 매단 둥근 폭뢰
          for (const sgn of [-1, 1]) {
            g.beginPath(); g.arc(sgn * 5.5, 9, 3.4, 0, Math.PI * 2); g.fill()
          }
          g.fillRect(-7, 6.5, 14, 1.6)
          break
        case 'beam':                // 기수 밑 굵은 포신
          g.fillRect(-4, -nose * .8, 8, 15)
          g.globalAlpha = .4
          g.beginPath(); g.arc(0, -nose * .8, 7, Math.PI, 0); g.fill()
          g.globalAlpha = 1
          break
        case 'boomer':              // 날개 끝이 뒤로 휜다
          g.lineWidth = 2.4
          for (const sgn of [-1, 1]) {
            g.beginPath()
            g.moveTo(sgn * span * .88, 5)
            g.quadraticCurveTo(sgn * (span + 10), 8, sgn * (span + 4), 17)
            g.stroke()
          }
          break
      }
      g.lineWidth = 1
    }
  }

  /* ================================================================
   * 개조 부품 — 주운 게 기체에 붙는다
   * ================================================================ */

  /* 관통: 기수 끝에 창이 돋는다 */
  if (M.pierce) {
    g.fillStyle = '#ffe08a'
    g.beginPath(); g.moveTo(0, -nose - 4 - M.pierce * 2.5)
    g.lineTo(2.2, -nose + 1); g.lineTo(-2.2, -nose + 1); g.closePath(); g.fill()
  }
  /* 대구경: 날개 안쪽에 굵은 포구 */
  if (M.big) {
    g.fillStyle = '#ffc44d'
    for (const sgn of [-1, 1])
      g.fillRect(sgn * (span * .42) - 2.5, -6, 5 + M.big * .8, 9)
  }
  /* 속사: 날개 아래 보조 총열 */
  if (M.rate) {
    g.fillStyle = '#7dffd4'
    for (const sgn of [-1, 1])
      for (let k = 0; k < M.rate; k++)
        g.fillRect(sgn * (span * .68) - 1 + k * sgn * 3, 0, 2, 8)
  }
  /* 증편: 날개 끝 파일런 */
  if (M.extra) {
    g.fillStyle = '#9fe8ff'
    for (const sgn of [-1, 1])
      g.beginPath(), g.ellipse(sgn * (span + 3 + M.extra), 5, 2.6, 6, 0, 0, Math.PI * 2), g.fill()
  }
  /* 분열: 동체 옆 분리 포드 */
  if (M.split) {
    g.fillStyle = '#ff9ecb'
    for (const sgn of [-1, 1])
      g.beginPath(), g.arc(sgn * 8, 2, 2.2 + M.split * .5, 0, Math.PI * 2), g.fill()
  }
  /* 유도: 등에 선 안테나 */
  if (M.seek) {
    g.strokeStyle = '#c9a8ff'; g.lineWidth = 1.4
    g.beginPath(); g.moveTo(0, -2); g.lineTo(0, -nose * .55 - M.seek * 3); g.stroke()
    g.fillStyle = '#c9a8ff'
    g.beginPath(); g.arc(0, -nose * .55 - M.seek * 3, 1.8, 0, Math.PI * 2); g.fill()
  }
  /* 반사: 기체를 도는 옅은 고리 */
  if (M.bounce) {
    g.strokeStyle = 'rgba(143,216,255,' + (.28 + M.bounce * .14) + ')'
    g.lineWidth = 1.6
    g.beginPath(); g.arc(0, 0, span + 6, 0, Math.PI * 2); g.stroke()
  }

  g.restore()
}

/** 레이저기의 예고와 빔. 적기보다 먼저 깔아야 기체가 위에 온다 */
function drawEnemyBeam(e) {
  const firing = e.beamPh <= .35
  const half = firing ? 15 : 15 + ((e.beamPh - .35) / 1.1) * 16
  if (firing) {
    g.fillStyle = 'rgba(255,120,150,.8)'
    g.fillRect(e.x - half, e.y, half * 2, H - e.y)
    g.fillStyle = 'rgba(255,255,255,.9)'
    g.fillRect(e.x - half * .4, e.y, half * .8, H - e.y)
  } else {
    g.fillStyle = 'rgba(255,110,140,' + (.10 + Math.sin(e.t * 24) * .05) + ')'
    g.fillRect(e.x - half, e.y, half * 2, H - e.y)
  }
}

function drawEnemy(e) {
  const big = e.kind === 'mid'
  /* 어두운 바다 위라 예전 색은 묻혔다. 한 단계씩 밝혔다 */
  const wing = big ? '#b05a80' : '#7d8fb5'
  const body = big ? '#ff8fae' : '#c3d3ef'

  /* 바다에 지는 그림자. 아군과 같은 방향이어야 빛이 하나로 읽힌다 */
  g.save()
  g.translate(e.x + e.r * .55, e.y + e.r * .75)
  g.fillStyle = 'rgba(0,12,28,.24)'
  g.beginPath(); g.ellipse(0, 0, e.r * .95, e.r * .5, 0, 0, Math.PI * 2); g.fill()
  g.restore()

  g.save(); g.translate(e.x, e.y); g.rotate(Math.PI)

  /* 주익 */
  if (e.flash > 0) {
    g.fillStyle = '#ffffff'
  } else {
    const wg = g.createLinearGradient(0, -e.r, 0, e.r * .6)
    wg.addColorStop(0, shade(wing, .3))
    wg.addColorStop(.6, wing)
    wg.addColorStop(1, shade(wing, -.35))
    g.fillStyle = wg
  }
  g.beginPath()
  g.moveTo(0, -e.r * .9); g.lineTo(e.r, e.r * .5); g.lineTo(0, e.r * .15); g.lineTo(-e.r, e.r * .5)
  g.closePath(); g.fill()

  /* 동체 - 가로 그라디언트로 둥글게 */
  if (e.flash > 0) {
    g.fillStyle = '#ffffff'
  } else {
    const bg2 = g.createLinearGradient(-e.r * .34, 0, e.r * .34, 0)
    bg2.addColorStop(0, shade(body, -.4))
    bg2.addColorStop(.4, body)
    bg2.addColorStop(.6, shade(body, .28))
    bg2.addColorStop(1, shade(body, -.26))
    g.fillStyle = bg2
  }
  g.beginPath(); g.moveTo(0, -e.r * .75); g.lineTo(e.r * .34, e.r * .4); g.lineTo(-e.r * .34, e.r * .4)
  g.closePath(); g.fill()

  /* 캐노피 - 작지만 있으면 비행기로 읽힌다 */
  if (e.flash <= 0) {
    g.fillStyle = 'rgba(30,50,80,.85)'
    g.beginPath(); g.ellipse(0, -e.r * .3, e.r * .16, e.r * .24, 0, 0, Math.PI * 2); g.fill()
    g.fillStyle = 'rgba(255,255,255,.35)'
    g.beginPath(); g.ellipse(-e.r * .05, -e.r * .36, e.r * .07, e.r * .1, 0, 0, Math.PI * 2); g.fill()
  }
  g.restore()
}

function drawBoss(bs) {
  /* 돌진 예고 — 아래로 붉은 길이 깔린다 */
  if (bs.dashPh > 1.5) {
    g.fillStyle = 'rgba(255,84,112,' + (.10 + Math.sin(bs.t * 30) * .06) + ')'
    g.fillRect(bs.x - bs.r, bs.y, bs.r * 2, H - bs.y)
  }

  /* 즉사 광선. 예고 동안 길이 좁아지고, 발사 순간 하얗게 터진다 */
  if (bs.lancePh > 0) {
    const firing = bs.lancePh <= 0.45
    const warn = Math.max(0, (bs.lancePh - 0.45) / 1.5)
    const halfW = firing ? 22 : 22 + warn * 26
    if (firing) {
      g.fillStyle = 'rgba(255,90,120,.85)'
      g.fillRect(bs.lanceX - halfW, bs.y, halfW * 2, H - bs.y)
      g.fillStyle = 'rgba(255,255,255,.95)'
      g.fillRect(bs.lanceX - halfW * .42, bs.y, halfW * .84, H - bs.y)
    } else {
      g.fillStyle = 'rgba(255,84,112,' + (.12 + Math.sin(bs.t * 26) * .07) + ')'
      g.fillRect(bs.lanceX - halfW, bs.y, halfW * 2, H - bs.y)
      g.strokeStyle = 'rgba(255,140,160,.8)'; g.lineWidth = 1.4
      g.strokeRect(bs.lanceX - halfW, bs.y, halfW * 2, H - bs.y)
    }
  }

  g.save(); g.translate(bs.x, bs.y)

  /* 본체 */
  const bart = bossArt(bs)
  if (bart) {
    const sz = bs.r * 3.2
    if (bs.flash > 0) g.globalAlpha = .6
    g.drawImage(bart, -sz / 2, -sz / 2, sz, sz)
    if (bs.flash > 0) {
      g.globalCompositeOperation = 'lighter'
      g.drawImage(bart, -sz / 2, -sz / 2, sz, sz)
      g.globalCompositeOperation = 'source-over'
      g.globalAlpha = 1
    }
  } else {
    g.fillStyle = bs.flash > 0 ? '#8f7ab5' : '#3b2b52'
    g.beginPath()
    g.moveTo(0, bs.r * .75); g.lineTo(bs.r * 1.25, -bs.r * .15); g.lineTo(bs.r * .6, -bs.r * .7)
    g.lineTo(-bs.r * .6, -bs.r * .7); g.lineTo(-bs.r * 1.25, -bs.r * .15)
    g.closePath(); g.fill()
    g.fillStyle = '#7a5cab'
    g.beginPath(); g.moveTo(0, bs.r * .5); g.lineTo(bs.r * .42, -bs.r * .5); g.lineTo(-bs.r * .42, -bs.r * .5)
    g.closePath(); g.fill()
  }

  /*
   * 부위는 본체 위에 그린다.
   *
   * 밑에 깔았더니 본체 그림에 통째로 가려서 어디를 쏴야 하는지 보이지 않았다.
   * 타격지점은 보여야 지점이다.
   */
  for (const p of bs.parts) {
    g.save(); g.translate(p.dx, p.dy)
    if (p.alive) {
      g.fillStyle = p.flash > 0 ? '#ffffff' : p.key === 'en' ? '#3d5a78' : '#584078'
      g.beginPath(); g.arc(0, 0, p.r * .78, 0, Math.PI * 2); g.fill()
      if (p.key === 'en') {
        g.fillStyle = '#7fd6ff'
        g.beginPath(); g.arc(0, 0, p.r * .38, 0, Math.PI * 2); g.fill()
      } else {
        g.fillStyle = '#2a1f3d'; g.fillRect(-3, 4, 6, 16)
      }
      const bw = p.r * 1.3
      g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(-bw / 2, -p.r - 6, bw, 4)
      g.fillStyle = '#ffb45c'
      g.fillRect(-bw / 2, -p.r - 6, bw * Math.max(0, p.hp / p.maxHp), 4)
    } else {
      g.fillStyle = '#241a33'
      g.beginPath(); g.arc(0, 0, p.r * .62, 0, Math.PI * 2); g.fill()
      g.strokeStyle = 'rgba(255,140,90,.5)'; g.lineWidth = 2
      g.beginPath(); g.moveTo(-6, -6); g.lineTo(6, 6); g.moveTo(6, -6); g.lineTo(-6, 6); g.stroke()
    }
    g.restore()
  }

  /* 코어가 열리면 가운데가 벌겋게 뛴다 - 여기를 쏘라는 표시다 */
  if (bs.core.open) {
    const k = .55 + Math.sin(bs.t * 7) * .25
    g.fillStyle = 'rgba(255,90,120,' + k + ')'
    g.beginPath(); g.arc(0, 0, bs.r * .42, 0, Math.PI * 2); g.fill()
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2
    g.beginPath(); g.arc(0, 0, bs.r * .55, 0, Math.PI * 2); g.stroke()
  }


  /* 구간이 올라갈수록 눈이 밝아진다 */
  const eye = ['#ff5470', '#ff7a4a', '#ffb43a', '#ffffff'][bs.phase - 1] || '#ff5470'
  g.fillStyle = eye
  g.beginPath(); g.ellipse(0, -bs.r * .1, 7 + bs.phase, 5, 0, 0, Math.PI * 2); g.fill()
  g.restore()

  /* 체력 막대. 구간 경계에 눈금을 넣는다 */
  const w = W - 60
  const partHp = bs.parts.reduce((a, p) => a + Math.max(0, p.hp), 0)
  const partMax = bs.parts.reduce((a, p) => a + p.maxHp, 0)
  const ratio = bs.core.open ? bs.core.hp / bs.core.maxHp : partHp / partMax
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(30, 16, w, 6)
  g.fillStyle = bs.core.open ? '#ff5470' : '#ffb45c'
  g.fillRect(30, 16, w * Math.max(0, ratio), 6)
  /* 부위 경계. 남은 부위 수가 눈금으로 보인다 */
  if (!bs.core.open) {
    g.fillStyle = 'rgba(0,0,0,.45)'
    let acc = 0
    for (const p of bs.parts.slice(0, -1)) {
      acc += p.maxHp / partMax
      g.fillRect(30 + w * acc, 16, 1.5, 6)
    }
  }
  g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '10px system-ui'
  g.fillText(bs.core.open
    ? (bs.mid ? '중간보스' : '보스') + ' · 코어 노출'
    : (bs.mid ? '중간보스' : '보스') + ' · 부위 ' +
      bs.parts.filter((p) => p.alive).length + '개 남음', 30, 34)
}

/*
 * 적탄 색.
 *
 * glow 는 바깥 번짐, body 는 알맹이, core 는 반사광이다. 세 겹이면 어두운
 * 배경 위에서도 알맹이가 또렷하게 뜬다.
 */
const EBUL = {
  small: { glow: 'rgba(255,190,120,.28)', body: '#ffb45c', core: '#fff2d8' },
  mid:   { glow: 'rgba(255,120,150,.30)', body: '#ff6f8f', core: '#ffd9e2' },
  fan:   { glow: 'rgba(180,255,190,.26)', body: '#7fe6a0', core: '#e6fff0' },
  heavy: { glow: 'rgba(255,90,90,.34)',   body: '#e8503f', core: '#ffd2c9' },
  boss:  { glow: 'rgba(190,140,255,.32)', body: '#b388ff', core: '#efe4ff', },
  lance: { glow: 'rgba(255,255,255,.4)',  body: '#ffffff', core: '#ffffff', long: true },
}

function drawBullet(b) {
  switch (b.kind) {
    case 'laser':
      g.fillStyle = '#bff4ff'; g.fillRect(b.x - 1.4, b.y - 16, 2.8, 22); break
    case 'homing':
      g.fillStyle = '#ffa8d6'
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill()
      g.globalAlpha = .35; g.beginPath(); g.arc(b.x - b.vx * .012, b.y - b.vy * .012, b.r * .7, 0, Math.PI * 2); g.fill()
      g.globalAlpha = 1; break
    case 'orb':
      g.fillStyle = '#c9a8ff'
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill(); break
    case 'mine':
      g.fillStyle = b.fuse < .35 && Math.floor(b.fuse * 20) % 2 ? '#ffffff' : '#ffd166'
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill(); break
    case 'beam': {
      const gr = g.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r)
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, 'rgba(120,200,255,.15)')
      g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill(); break
    }
    case 'boomer':
      g.strokeStyle = '#9fffcf'; g.lineWidth = 3
      g.beginPath(); g.arc(b.x, b.y, b.r, b.age * 12, b.age * 12 + 4.2); g.stroke(); break
    case 'pierce':
      g.fillStyle = '#ffe08a'; g.fillRect(b.x - b.r / 2, b.y - 12, b.r, 18); break
    case 'wave':
      g.fillStyle = '#7dffd4'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill(); break
    default:
      g.fillStyle = '#9fe8ff'; g.fillRect(b.x - b.r / 2, b.y - 7, b.r, 11)
  }
}

/* 지상 위협 그리기. 예고는 크게, 본체는 작게 — 눈이 예고를 먼저 잡아야 한다. */
function drawGround(u) {
  const base = u.flash > 0 ? '#ffffff' : '#4a5568'
  g.save(); g.translate(u.x, u.y)

  if (u.kind === 'radar') {
    /* 감지 원을 먼저 그린다. 숨기면 피할 수가 없다. */
    const on = u.lock > 0
    g.strokeStyle = on ? 'rgba(255,84,112,' + (.3 + u.lock * .4) + ')' : 'rgba(255,180,90,.18)'
    g.lineWidth = on ? 2 : 1
    g.setLineDash([6, 6]); g.beginPath(); g.arc(0, 0, RADAR_R, 0, Math.PI * 2); g.stroke()
    g.setLineDash([])
    if (on) {
      g.strokeStyle = '#ff5470'; g.lineWidth = 3
      g.beginPath(); g.arc(0, 0, RADAR_R, -Math.PI / 2, -Math.PI / 2 + (u.lock / 1.5) * Math.PI * 2); g.stroke()
    }
  }

  if (u.kind === 'laser' && u.phase === 'aim') {
    /* 겨냥선. 굵기가 자라면서 "곧 온다"를 알린다. */
    const k = 1 - u.ph / 0.9
    g.strokeStyle = 'rgba(255,84,112,' + (.35 + k * .5) + ')'
    g.lineWidth = 1 + k * 4
    g.beginPath(); g.moveTo(u.aimX - u.x, -H); g.lineTo(u.aimX - u.x, 0); g.stroke()
  }

  const art = groundArt(u.kind)
  if (art) {
    const sz = u.r * 2.8
    if (u.flash > 0) g.globalAlpha = .6
    g.drawImage(art, -sz / 2, -sz / 2, sz, sz)
    if (u.flash > 0) {
      g.globalCompositeOperation = 'lighter'
      g.drawImage(art, -sz / 2, -sz / 2, sz, sz)
      g.globalCompositeOperation = 'source-over'
      g.globalAlpha = 1
    }
    g.restore()
    return
  }

  g.fillStyle = base
  g.beginPath(); g.roundRect(-u.r, -u.r * .55, u.r * 2, u.r * 1.25, 4); g.fill()

  const top = { turret: '#93a6c9', flak: '#ffd166', laser: '#ff8fa3', radar: '#7dffd4' }[u.kind]
  g.fillStyle = u.flash > 0 ? '#ffffff' : top
  if (u.kind === 'turret') { g.fillRect(-2.5, -u.r - 6, 5, 12) }
  else if (u.kind === 'flak') { g.beginPath(); g.moveTo(0, -u.r - 8); g.lineTo(6, -2); g.lineTo(-6, -2); g.closePath(); g.fill() }
  else if (u.kind === 'laser') { g.beginPath(); g.arc(0, -u.r * .4, 5, 0, Math.PI * 2); g.fill() }
  else { g.beginPath(); g.ellipse(0, -u.r * .5, 9, 4, -0.5, 0, Math.PI * 2); g.fill() }
  g.restore()
}

function draw() {
  const s = state
  const now = performance.now() / 1000
  g.clearRect(0, 0, W, H)

  /* 지면 - 위가 멀고 아래가 가깝다. 색은 스테이지가 정한다 */
  const TH = s.theme || THEMES.sea
  const sea = g.createLinearGradient(0, 0, 0, H)
  sea.addColorStop(0, TH.sky[0])
  sea.addColorStop(.45, TH.sky[1])
  sea.addColorStop(1, TH.sky[2])
  g.fillStyle = sea
  g.fillRect(0, 0, W, H)

  /* 물결 - 땅과 같은 속도로 흘러야 같이 나는 것처럼 보인다 */
  const scroll = now * TERRAIN_SPEED
  g.lineWidth = 1.4
  for (let i = 0; i < 16; i++) {
    const wy = ((i * 48 + scroll) % (H + 70)) - 35
    g.strokeStyle = 'rgba(' + TH.line + ',' + (.05 + .05 * Math.sin(i * 1.7)) + ')'
    g.beginPath()
    for (let x = 0; x <= W; x += 18) {
      const yy = wy + Math.sin(x * .035 + i + now) * 3.5
      if (x) g.lineTo(x, yy); else g.moveTo(x, yy)
    }
    g.stroke()
  }

  /* 윤슬 - 물결에 햇빛이 튄다 */
  for (const st of s.stars) {
    g.fillStyle = 'rgba(' + TH.glint + ',' + (.2 + Math.abs(Math.sin(st.ph + now * 3)) * .5) * st.z + ')'
    g.fillRect(st.x, st.y, 1.6 + st.z, 1.2)
  }

  for (const sl of s.slabs) drawIsle(sl)
  for (const u of s.grounds) drawGround(u)
  /* 방공 빔 */
  for (const bm of s.beams) {
    const a = 1 - bm.age / bm.life
    g.fillStyle = 'rgba(255,120,150,' + (.35 + a * .5) + ')'
    g.fillRect(bm.x - bm.w / 2, 0, bm.w, bm.y)
    g.fillStyle = 'rgba(255,255,255,' + (a * .8) + ')'
    g.fillRect(bm.x - 3, 0, 6, bm.y)
  }
  for (const it of s.items) {
    const k = 1 + Math.sin(it.t * 8) * .12
    const key = it.tk ? 'ticket' : it.mod || 'power'
    const im = ITEM_IMG[key]
    g.save(); g.translate(it.x, it.y); g.scale(k, k)
    if (im && im.complete && im.naturalWidth) {
      const d = it.r * 2.5
      g.drawImage(im, -d / 2, -d / 2, d, d)
    } else {
      /* 그림이 아직 안 떴으면 예전처럼 도형으로 */
      const m = it.mod ? MODS[it.mod] : null
      g.fillStyle = it.tk ? '#ffe27a' : m ? m.color : '#ffd166'
      g.beginPath(); g.arc(0, 0, it.r, 0, Math.PI * 2); g.fill()
    }
    g.restore()
  }
  for (const e of s.enemies) if (e.lance && e.beamPh > 0) drawEnemyBeam(e)
  for (const e of s.enemies) drawEnemy(e)
  if (s.boss) drawBoss(s.boss)

  /* 번개. 곧은 선은 번개로 안 보인다 - 중간을 몇 번 꺾는다 */
  for (const a of s.arcs) {
    const k = 1 - a.age / a.life
    const dx = a.x2 - a.x1, dy = a.y2 - a.y1
    const len = Math.hypot(dx, dy)
    // 꺾는 폭과 마디 수를 길이에 맞춘다. 긴 줄기에 같은 폭을 쓰면 그냥 직선이다
    const amp = Math.max(8, Math.min(34, len * 0.11))
    const seg = Math.max(5, Math.min(12, Math.round(len / 40)))
    g.lineCap = 'round'
    for (let pass = 0; pass < 2; pass++) {
      g.strokeStyle = pass ? 'rgba(255,255,255,' + k + ')'
                           : 'rgba(150,225,255,' + (k * .8) + ')'
      g.lineWidth = pass ? 1.6 : 5
      g.beginPath()
      g.moveTo(a.x1, a.y1)
      for (let i = 1; i < seg; i++) {
        const t = i / seg
        const off = Math.sin(a.seed + i * 2.7) * amp * (1 - Math.abs(t - .5) * 1.2)
        g.lineTo(a.x1 + dx * t - dy / len * off,
                 a.y1 + dy * t + dx / len * off)
      }
      g.lineTo(a.x2, a.y2)
      g.stroke()
    }
  }
  /* 불꽃. 적기 위에 얹어야 터진 자리가 가려지지 않는다 */
  for (const bl of s.blasts) {
    const i = Math.min(BOOM_IMG.length - 1, Math.floor((bl.age / bl.life) * BOOM_IMG.length))
    const im = BOOM_IMG[i]
    if (!im || !im.complete || !im.naturalWidth) continue
    const d = bl.r * (1.1 + (bl.age / bl.life) * 1.3)
    g.drawImage(im, bl.x - d / 2, bl.y - d / 2, d, d)
  }

  for (const b of s.bullets) drawBullet(b)
  for (const b of s.ebullets) {
    if (b.kind === 'missile') {
      g.fillStyle = '#ff5470'
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill()
      g.globalAlpha = .3
      g.beginPath(); g.arc(b.x - b.vx * .015, b.y - b.vy * .015, b.r * .8, 0, Math.PI * 2); g.fill()
      g.globalAlpha = 1
    } else if (b.kind === 'flakshell') {
      g.fillStyle = '#ffd166'
      g.fillRect(b.x - 2.5, b.y - 7, 5, 13)
    } else {
      /*
       * 쏜 쪽마다 다르게 그린다.
       *
       * 전부 같은 분홍 구슬이면 화면이 붉은 점으로 덮여서 무엇이 위험한지
       * 안 읽힌다. 아픈 탄일수록 크고 진하게, 흔한 탄은 작고 옅게 둔다 -
       * 색이 정보가 되어야 피할 것을 고를 수 있다.
       */
      const C = EBUL[b.sh] || EBUL.small
      if (C.long) {
        /* 길쭉한 탄은 날아가는 방향으로 눕힌다 */
        const an = Math.atan2(b.vy, b.vx)
        g.save(); g.translate(b.x, b.y); g.rotate(an)
        g.fillStyle = C.glow
        g.fillRect(-b.r * 2.6, -b.r * .9, b.r * 4.2, b.r * 1.8)
        g.fillStyle = C.core
        g.fillRect(-b.r * 1.6, -b.r * .45, b.r * 3, b.r * .9)
        g.restore()
      } else {
        g.fillStyle = C.glow
        g.beginPath(); g.arc(b.x, b.y, b.r * 1.7, 0, Math.PI * 2); g.fill()
        g.fillStyle = C.body
        g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill()
        g.fillStyle = C.core
        g.beginPath(); g.arc(b.x - b.r * .25, b.y - b.r * .25, b.r * .42, 0, Math.PI * 2); g.fill()
      }
    }
  }

  /* ---- 필살기 그림 ---- */
  for (const sw of s.sweeps || []) {
    const gr = g.createLinearGradient(sw.x - sw.half, 0, sw.x + sw.half, 0)
    gr.addColorStop(0, 'rgba(120,220,255,0)')
    gr.addColorStop(.5, 'rgba(190,245,255,.85)')
    gr.addColorStop(1, 'rgba(120,220,255,0)')
    g.fillStyle = gr
    g.fillRect(sw.x - sw.half, 0, sw.half * 2, s.player.y)
  }
  if (s.ultKind === 'orb' && s.ultT > 0) {
    for (let i = 0; i < 8; i++) {
      const a = s.t * 3.4 + (i / 8) * Math.PI * 2
      g.fillStyle = '#c9a8ff'
      g.beginPath(); g.arc(s.player.x + Math.cos(a) * 54, s.player.y + Math.sin(a) * 54, 6, 0, Math.PI * 2); g.fill()
    }
  }
  for (const es of s.escorts || []) {
    const ex = Math.max(20, Math.min(W - 20, s.player.x + es.off * 46))
    drawShipOn(g, ex, s.player.y + 6, { plane: s.squad[MAIN_SLOT].plane, lv: 2,
                                         mods: NO_MODS, scale: .5, shadow: false })
  }
  for (const sh of s.shards) {
    if (sh.delay > 0) continue
    if (sh.kind === 'shock') {
      g.strokeStyle = 'rgba(160,235,255,' + Math.max(0, 1 - sh.r / H) + ')'
      g.lineWidth = 5
      g.beginPath(); g.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2); g.stroke()
    } else {
      const k = sh.kind === 'shell' ? 130 : 76
      g.fillStyle = 'rgba(255,190,110,' + Math.max(0, .55 - sh.r / k * .5) + ')'
      g.beginPath(); g.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2); g.fill()
    }
  }

  if (!(s.player.inv > 0 && Math.floor(s.player.inv * 12) % 2 === 0)) {
    s.squad.forEach((u, i) => {
      if (!u.plane) return
      const p = slotPos(i); drawShip(p.x, p.y, u, i === 1)
    })
  }

  for (const p of s.parts) {
    g.globalAlpha = 1 - p.age / p.life; g.fillStyle = p.color
    g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3)
  }
  g.globalAlpha = 1

  g.fillStyle = '#e8edf7'; g.font = 'bold 15px system-ui'
  g.textAlign = 'left'; g.textBaseline = 'top'
  g.fillText(String(s.score).padStart(6, '0'), 14, 30)
  g.textAlign = 'right'; g.fillStyle = '#4fd1ff'
  g.fillText('편대 ' + s.player.lv, W - 14, 30)
  for (let i = 0; i < s.lives; i++) {
    g.fillStyle = '#ff5470'
    const x = W - 16 - i * 16, y = 56
    g.beginPath(); g.moveTo(x, y - 5); g.lineTo(x + 5, y + 4); g.lineTo(x - 5, y + 4); g.closePath(); g.fill()
  }

  /*
   * 체력바.
   *
   * 기체 바로 위에 붙인다. 화면 구석에 두면 탄을 보느라 못 본다. 색은 남은
   * 양에 따라 초록에서 빨강으로 넘어가서, 숫자를 읽지 않아도 위험한 줄 안다.
   */
  {
    const r = Math.max(0, s.player.hp / s.player.maxHp)
    const bw = 42, bx = s.player.x - bw / 2, by = s.player.y + 26
    g.fillStyle = 'rgba(0,0,0,.45)'
    g.fillRect(bx - 1, by - 1, bw + 2, 6)
    g.fillStyle = r > .55 ? '#5fd48a' : r > .28 ? '#ffcf5c' : '#ff5470'
    g.fillRect(bx, by, bw * r, 4)
  }
  /* ---- 필살기 버튼 ---- */
  {
    ULT_BTN.x = W - 52
    ULT_BTN.y = H - 56
    const ready = s.ult >= ULT_MAX
    const r = s.ult / ULT_MAX
    const k = ultKind()

    g.save()
    g.translate(ULT_BTN.x, ULT_BTN.y)
    // 바탕
    g.fillStyle = ready ? 'rgba(90,200,255,.22)' : 'rgba(255,255,255,.07)'
    g.beginPath(); g.arc(0, 0, ULT_BTN.r, 0, Math.PI * 2); g.fill()
    // 채워지는 테두리
    g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 4
    g.beginPath(); g.arc(0, 0, ULT_BTN.r, 0, Math.PI * 2); g.stroke()
    g.strokeStyle = ready ? '#7fe3ff' : '#4a90c8'
    g.lineWidth = 4
    g.beginPath(); g.arc(0, 0, ULT_BTN.r, -Math.PI / 2, -Math.PI / 2 + r * Math.PI * 2); g.stroke()
    // 이름
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillStyle = ready ? '#eaf8ff' : 'rgba(220,240,255,.5)'
    g.font = 'bold 12px system-ui'
    g.fillText(k && ULT[k] ? ULT[k].name : '필살기', 0, ready ? -4 : 0)
    if (ready) {
      g.font = '10px system-ui'
      g.fillStyle = 'rgba(160,230,255,' + (.6 + Math.sin(s.t * 6) * .35) + ')'
      g.fillText('탭', 0, 11)
    }
    g.restore()
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  }

  /* 지금 붙은 개조. 왼쪽 위에 작게 쌓는다 */
  {
    let cx = 14, cy = 52
    for (const key of MOD_KEYS) {
      const n = s.mods[key]
      if (!n) continue
      const m = MODS[key]
      g.fillStyle = m.color
      g.beginPath(); g.roundRect(cx, cy, 30, 17, 5); g.fill()
      g.fillStyle = '#12161f'; g.font = 'bold 11px system-ui'
      g.textAlign = 'left'; g.textBaseline = 'middle'
      g.fillText(m.ko + n, cx + 6, cy + 9)
      cx += 34
      if (cx > W - 120) { cx = 14; cy += 21 }
    }
  }

  if (s.bannerT > 0) {
    g.globalAlpha = Math.min(1, s.bannerT * 1.6)
    g.fillStyle = '#fff'; g.font = 'bold 26px system-ui'
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(s.banner, W / 2, H * .34)
    g.globalAlpha = 1
  }
}

/* ================================================================
 * 루프
 * ================================================================ */
let last = 0
function frame(now) {
  requestAnimationFrame(frame)
  if (!state || !state.running) return
  const dt = Math.min((now - last) / 1000, .05)
  last = now
  update(dt); draw()
}
requestAnimationFrame(frame)


/* ================================================================
 * 소리
 *
 * 음악은 바깥 파일로 둔다. 본문에 박아 넣으면 한 판 하려고 1MB 를 더 받아야
 * 한다. 기본은 꺼짐이고, 켜야 그때 받는다 - 데이터를 함부로 쓰지 않는다.
 *
 * 효과음은 파형을 직접 만든다. 총알이 초당 열 발씩 나가는 게임에서 발사음을
 * 파일로 두면 받는 것도 낭비고 재생도 밀린다.
 * ================================================================ */
const AUDIO_BASE = 'https://ysmilk01-maker.github.io/lab/audio/'
const TRACKS = { hangar: 'hangar.m4a', battle: 'battle.m4a', boss: 'boss.m4a' }
const MUS_VOL = 0.42
const AU_KEY = 'shooter-audio-v1'

const AU = {
  ctx: null, master: null, mus: null, sfxBus: null, noise: null,
  buf: {}, loading: {}, now: null, want: null, last: {},
  /*
   * 음악은 기본 켜짐이다.
   *
   * 브라우저는 사람이 화면을 만지기 전에는 소리를 안 내준다. 그래서 '켜짐'
   * 이라는 건 '첫 손짓 때 바로 시작한다' 는 뜻이다. 그때 곡 파일 1.1MB 를
   * 받는다 - 설정 화면에 적어 두었다.
   */
  on: { music: true, sfx: true, vib: true },
}
try {
  const raw = localStorage.getItem(AU_KEY)
  if (raw) Object.assign(AU.on, JSON.parse(raw))
} catch { /* 저장이 막혀 있으면 기본값으로 간다 */ }

function auSave() { try { localStorage.setItem(AU_KEY, JSON.stringify(AU.on)) } catch {} }

/** 소리 장치는 사람이 화면을 처음 만질 때만 열 수 있다. 브라우저 규칙이다 */
function auInit() {
  if (AU.ctx) {
    if (AU.ctx.state === 'suspended') AU.ctx.resume()
    return AU.ctx
  }
  const C = window.AudioContext || window.webkitAudioContext
  if (!C) return null
  const c = new C()
  AU.ctx = c
  AU.master = c.createGain(); AU.master.connect(c.destination)
  AU.mus = c.createGain(); AU.mus.gain.value = AU.on.music ? MUS_VOL : 0
  AU.mus.connect(AU.master)
  AU.sfxBus = c.createGain(); AU.sfxBus.gain.value = 0.5
  AU.sfxBus.connect(AU.master)
  return c
}
/* 첫 손짓에 소리 장치를 열고, 켜져 있으면 그 자리에서 음악을 시작한다 */
function auWake() {
  auInit()
  if (AU.on.music && AU.want && !AU.now) auPlay(AU.want)
}
addEventListener('pointerdown', auWake, { once: true })
addEventListener('keydown', auWake, { once: true })

/**
 * AAC 는 앞뒤에 인코더가 만든 무음을 붙인다. 그대로 반복시키면 한 바퀴마다
 * 짧은 공백이 생긴다. 소리가 실제로 있는 구간만 반복 지점으로 잡는다.
 */
function auTrim(b) {
  const d = b.getChannelData(0), n = d.length, th = 0.0008
  let a = 0, z = n - 1
  while (a < n && Math.abs(d[a]) < th) a++
  while (z > a && Math.abs(d[z]) < th) z--

  /*
   * 자를 때 파형은 이어 놓았지만, 압축을 풀고 나면 첫 칸과 끝 칸의 값이 조금
   * 어긋나 있다 - 코덱이 남긴 오차다. 그 한 칸 차이가 '틱' 소리로 들린다.
   * 끝에서 30ms 안쪽을 훑어 첫 칸과 값도 기울기도 가장 잘 맞는 자리를 찾아
   * 거기서 끊는다. 음악에서 30ms 는 귀에 걸리지 않는다.
   */
  const win = Math.min(Math.floor(b.sampleRate * 0.03), z - a - 1)
  if (win > 8) {
    const v = d[a], slope = d[a + 1] - d[a]
    let best = z, score = Infinity
    for (let k = z - win; k <= z; k++) {
      const e = Math.abs(d[k] - v) + Math.abs((d[k] - d[k - 1]) - slope)
      if (e < score) { score = e; best = k }
    }
    z = best
  }
  return { buf: b, start: a / b.sampleRate, end: (z + 1) / b.sampleRate }
}

function auLoad(name) {
  if (AU.buf[name]) return Promise.resolve(AU.buf[name])
  if (AU.loading[name]) return AU.loading[name]
  const c = auInit()
  if (!c || !TRACKS[name]) return Promise.resolve(null)
  AU.loading[name] = fetch(AUDIO_BASE + TRACKS[name])
    .then((r) => r.arrayBuffer())
    .then((a) => c.decodeAudioData(a))
    .then((b) => (AU.buf[name] = auTrim(b)))
    .catch(() => null)      // 못 받으면 조용히 넘어간다. 음악은 있으면 좋은 것이다
  return AU.loading[name]
}

function auStop(fade) {
  const c = AU.ctx
  if (!c || !AU.now) return
  const o = AU.now, t = c.currentTime, d = fade == null ? 0.5 : fade
  AU.now = null
  o.gain.gain.cancelScheduledValues(t)
  o.gain.gain.setValueAtTime(o.gain.gain.value, t)
  o.gain.gain.linearRampToValueAtTime(0, t + d)
  try { o.src.stop(t + d + 0.05) } catch {}
}

function auPlay(name) {
  const c = auInit()
  if (!c) return
  auLoad(name).then((rec) => {
    // 받는 사이에 화면이 바뀌었으면 버린다
    if (!rec || AU.want !== name || !AU.on.music) return
    if (AU.now && AU.now.name === name) return
    auStop(0.5)
    const t = c.currentTime
    const g = c.createGain(); g.gain.value = 0; g.connect(AU.mus)
    const src = c.createBufferSource()
    src.buffer = rec.buf
    src.loop = true
    src.loopStart = rec.start
    src.loopEnd = rec.end
    src.connect(g)
    src.start(t, rec.start)
    g.gain.linearRampToValueAtTime(1, t + 0.6)
    AU.now = { name, src, gain: g }
  })
}

/** 지금 어느 곡이 어울리는지만 말한다. 켜고 끄는 건 이쪽이 신경쓰지 않는다 */
function music(name) {
  if (AU.want === name) return
  AU.want = name
  if (AU.on.music) auPlay(name)
}

function setMusic(v) {
  AU.on.music = v
  auSave()
  const c = auInit()
  if (c) AU.mus.gain.setTargetAtTime(v ? MUS_VOL : 0, c.currentTime, 0.12)
  if (v) { if (AU.want) auPlay(AU.want) } else auStop(0.4)
  auPaint()
}
function setSfx(v) { AU.on.sfx = v; auSave(); auPaint() }

function auPaint() {
  const m = document.getElementById('btnMusic')
  const f = document.getElementById('btnSfx')
  if (m) m.classList.toggle('off', !AU.on.music)
  if (f) f.classList.toggle('off', !AU.on.sfx)
}

/* -- 효과음 ------------------------------------------------------- */

function auNoise(c) {
  if (AU.noise) return AU.noise
  const n = Math.floor(c.sampleRate * 1.2)
  const b = c.createBuffer(1, n, c.sampleRate)
  const d = b.getChannelData(0)
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1
  return (AU.noise = b)
}

/** 같은 소리가 겹쳐 터지면 귀가 아프다. 종류마다 최소 간격을 둔다 */
function auGate(k, gap) {
  const t = AU.ctx.currentTime
  if (AU.last[k] && t - AU.last[k] < gap) return false
  AU.last[k] = t
  return true
}

function auTone(type, hz0, hz1, dur, peak, t0) {
  const c = AU.ctx, t = t0 == null ? c.currentTime : t0
  const o = c.createOscillator(), g = c.createGain()
  o.type = type
  o.frequency.setValueAtTime(hz0, t)
  if (hz1 !== hz0) o.frequency.exponentialRampToValueAtTime(Math.max(20, hz1), t + dur)
  g.gain.setValueAtTime(0.0001, t)
  g.gain.linearRampToValueAtTime(peak, t + 0.012)
  g.gain.exponentialRampToValueAtTime(0.0005, t + dur)
  o.connect(g); g.connect(AU.sfxBus)
  o.start(t); o.stop(t + dur + 0.03)
}

function auHiss(f0, f1, dur, peak, type) {
  const c = AU.ctx, t = c.currentTime
  const s = c.createBufferSource(); s.buffer = auNoise(c)
  const f = c.createBiquadFilter()
  f.type = type || 'lowpass'
  f.frequency.setValueAtTime(f0, t)
  f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur)
  const g = c.createGain()
  g.gain.setValueAtTime(0.0001, t)
  g.gain.linearRampToValueAtTime(peak, t + 0.01)
  g.gain.exponentialRampToValueAtTime(0.0005, t + dur)
  s.connect(f); f.connect(g); g.connect(AU.sfxBus)
  s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05)
}

function sfx(kind, arg) {
  if (!AU.on.sfx || !AU.ctx) return
  switch (kind) {
    case 'shot': {
      if (!auGate('shot', 0.045)) return
      const base = [500, 640, 760][arg | 0] || 500
      auTone('square', base, base * 0.42, 0.075, 0.08)
      break
    }
    case 'hit':
      if (!auGate('hit', 0.028)) return
      auHiss(2600, 1400, 0.05, 0.085, 'bandpass')
      break
    /*
     * 내가 맞았을 때.
     *
     * 적이 터지는 소리와 반대로 간다 - 밝지 않고 둔탁하다. 소리만 듣고도
     * 내가 맞았는지 적이 터졌는지 알아야 한다.
     */
    case 'hurt': {
      if (!auGate('hurt', 0.06)) return
      const big = arg > 0.5
      auTone('sine', 190, 60, 0.24, 0.2)
      auHiss(500, 90, 0.2, big ? 0.16 : 0.1, 'lowpass')
      if (big) auTone('sawtooth', 110, 42, 0.3, 0.12)
      break
    }
    /*
     * 격추음.
     *
     * 노이즈 한 겹만 쓰면 '치익' 하는 바람 소리가 된다. 실제로 뭔가 터지는
     * 소리는 세 겹이다.
     *
     *   어택  아주 짧은 고역. 금속이 깨지는 첫 순간
     *   바디  밴드패스 노이즈. 찢어지는 중역
     *   저음  사인이 아래로 미끄러진다. 배를 울리는 몫
     *
     * 겹마다 길이를 다르게 둔다. 같이 시작해서 따로 끝나야 한 덩어리로
     * 들리면서도 두툼하다.
     */
    case 'boom': {
      if (!auGate('boom', 0.04)) return
      const sz = arg == null ? 0.5 : Math.min(1, arg)
      const c = AU.ctx, t0 = c.currentTime
      // 어택 - 깨지는 첫 순간
      auHiss(9000, 3000, 0.045, 0.10 + sz * 0.08, 'highpass')
      // 바디 - 찢어지는 소리
      auHiss(1400 + sz * 1400, 220, 0.22 + sz * 0.34, 0.10 + sz * 0.15, 'bandpass')
      // 꼬리 - 흩어지는 파편
      auHiss(700, 110, 0.34 + sz * 0.5, 0.05 + sz * 0.07, 'lowpass')
      // 저음 - 배를 울리는 몫. 작은 폭발엔 얕게만
      auTone('sine', 130 - sz * 35, 34, 0.3 + sz * 0.28, 0.10 + sz * 0.18, t0 + 0.01)
      break
    }
    case 'pick':
      if (!auGate('pick', 0.05)) return
      auTone('triangle', 660, 1180, 0.13, 0.09)
      break
    case 'ready':
      auTone('triangle', 880, 1320, 0.18, 0.11)
      auTone('triangle', 1320, 1760, 0.22, 0.07, AU.ctx.currentTime + 0.09)
      break
    case 'ult':
      // 올라가는 소리 뒤에 한 방. 화면이 번쩍하는 순간과 맞춘다
      auTone('sawtooth', 190, 1500, 0.34, 0.1)
      auTone('sine', 130, 42, 0.55, 0.26, AU.ctx.currentTime + 0.3)
      auHiss(5000, 500, 0.5, 0.1, 'lowpass')
      break
    case 'alarm':
      for (let i = 0; i < 3; i++) {
        auTone('square', 440, 440, 0.16, 0.07, AU.ctx.currentTime + i * 0.24)
        auTone('square', 330, 330, 0.16, 0.07, AU.ctx.currentTime + i * 0.24 + 0.1)
      }
      break
    case 'down':
      auTone('sawtooth', 420, 55, 0.85, 0.16)
      auHiss(1200, 90, 0.9, 0.16)
      break
    case 'clear':
      [523.25, 659.25, 783.99, 1046.5].forEach((hz, i) => {
        auTone('triangle', hz, hz, 0.5, 0.11, AU.ctx.currentTime + i * 0.12)
      })
      break
  }
}

/* ================================================================
 * 화면 전환
 * ================================================================ */
const scOver = document.getElementById('over')

function start() {
  state = newState(); seedStars(state); seedGround(state); state.running = true
  last = performance.now()
  hideMenus(); scOver.hidden = true
  prog.stats.runs++
  save()
  music('battle')
}
function end(win) {
  state.running = false
  const earned = partsEarned(state.score)
  prog.total += state.score
  prog.parts += earned

  const sg = state.stage
  /*
   * 단계 평가.
   *
   * 깨면 별 하나, 한 대도 안 잃으면 둘, 체력까지 70% 넘게 남기면 셋.
   * 최고 기록만 남는다 - 두 번째부터는 별이 줄지 않는다.
   */
  const key = stageKey(prog.chapter || 0, curSub())
  let rate = 0
  if (win) {
    rate = 1
    if (state.lives === LIVES) rate++
    if (state.player.hp / state.player.maxHp >= 0.7) rate++
  }
  const before = prog.stars[key] || 0
  if (rate > before) prog.stars[key] = rate
  bumpMissions(win, rate, MID_AT.includes(curSub()) || curSub() === SUBS)
  if (state.score > (prog.stageBest[key] || 0)) prog.stageBest[key] = state.score
  /* 깼으면 다음 단계를 미리 골라 둔다. 매번 지도로 돌아가지 않아도 되게 */
  const nextSub = curSub() + 1
  if (win && nextSub <= SUBS) prog.sub = nextSub

  const stars = win ? STAR_CLEAR : STAR_FAIL
  prog.star += stars
  let tickets = 0
  while (prog.star >= STAR_TICKET) { prog.star -= STAR_TICKET; prog.ticket++; tickets++ }

  const st = prog.stats
  st.kills += state.kills
  if (win) st.clears++
  if (state.score > st.best) st.best = state.score
  prog.scores.push({ s: state.score, t: Date.now(), w: !!win })
  prog.scores.sort((a, b) => b.s - a.s)
  prog.scores = prog.scores.slice(0, 50)          // 쉰 개면 충분하다

  const gained = xpFromScore(state.score)
  const up = addXp(state.score)
  save()

  document.getElementById('overTitle').textContent =
    win ? `${sg.chapter} ${sg.sub}단계 클리어` : '격추됨'
  document.getElementById('overBody').innerHTML =
    '이번 점수 <b>' + state.score.toLocaleString('ko-KR') + '</b>' +
    (state.score >= st.best ? ' · <b>최고 기록</b>' : '') + '<br>' +
    '부품 <b>+' + earned.toLocaleString('ko-KR') + '</b> (보유 ' + prog.parts.toLocaleString('ko-KR') + ')<br>' +
    '별 <b>+' + stars + '</b>' +
    (tickets ? ' · <b>가챠권 +' + tickets + '</b>' : ' (' + prog.star + '/' + STAR_TICKET + ')') + '<br>' +
    '파일럿 경험치 <b>+' + gained.toLocaleString('ko-KR') + '</b>' +
    (up ? ' · <b>레벨 ' + prog.pilot.lv + ' 달성</b>' +
          (prog.pilot.lv >= PILOT_MAX ? '<br><b>전설 파일럿 · 후방 자리가 열렸습니다</b>' : '')
        : '') + '<br>' +
    '누적 <b>' + prog.total.toLocaleString('ko-KR') + '</b>점' +
    (win ? '<br>평가 <b>' + '★'.repeat(rate) + '☆'.repeat(3 - rate) + '</b>' +
           (rate > before ? ' (최고 기록)' : '') : '') +
    (win && nextSub <= SUBS ? '<br><b>' + nextSub + '단계</b>가 열렸습니다' : '') +
    (win && nextSub > SUBS && CHAPTERS[(prog.chapter || 0) + 1]
      ? '<br><b>' + CHAPTERS[(prog.chapter || 0) + 1].name + '</b> 이 열렸습니다' : '')
  const rv = document.getElementById('revive')
  rv.hidden = win || state.adUsed.revive >= AD_LIMIT.revive
  scOver.hidden = false
  sfx(win ? 'clear' : 'down')
}

/* 출격은 두 화면에서 부를 수 있다. 처리는 한 곳에만 둔다 */
function doLaunch() {
  if (energy() > 0) { energySpend(); start(); return }
  if (adDayLeft() <= 0) {
    alert('오늘 광고로 채울 수 있는 횟수를 다 썼습니다.\n' + mmss(energyWait()) + ' 뒤에 한 판이 찹니다.')
    return
  }
  showAd('한 판 더', () => { prog.adDay.n++; save(); start() })
}
document.getElementById('launch').onclick = doLaunch
document.getElementById('launch2').onclick = doLaunch
document.getElementById('again').onclick = () => { scOver.hidden = true; go('squad'); music('hangar') }
elTabs.querySelectorAll('button').forEach((b) => { b.onclick = () => go(b.dataset.go) })
document.getElementById('revive').onclick = reviveByAd

go('squad')
auPaint()
music('hangar')
const daily = claimDaily()
if (daily) showDaily(daily)
</script>
